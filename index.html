    /* =====================================================
       V11 - PAGAMENTO SEPARADO: JUROS / MULTA / PRINCIPAL
       - Desconto fica somente dentro do bloco da multa.
       - Juros pagos não baixam multa; multa paga/desconto não baixa juros.
       - Mensagem de cobrança muda conforme parcelado ou saldo corrido.
       ===================================================== */
    function mvRoundMoney(v) { return Finance.round2(Number(v || 0)); }
    function mvSplitInterestPayment(det, jurosAmount) {
      let remaining = mvRoundMoney(jurosAmount);
      const paidToPeriodInterest = Math.min(Number(det.periodInterestPending || 0), remaining);
      remaining = mvRoundMoney(remaining - paidToPeriodInterest);
      const paidToExtraInterest = Math.min(Number(det.extraInterestPending || 0), remaining);
      remaining = mvRoundMoney(remaining - paidToExtraInterest);
      return { paidToPeriodInterest: mvRoundMoney(paidToPeriodInterest), paidToExtraInterest: mvRoundMoney(paidToExtraInterest), unusedInterest: mvRoundMoney(remaining) };
    }
    function mvPaymentInputs() {
      const juros = Math.max(0, Number(document.getElementById('pay-interest-amount')?.value || 0));
      const multa = Math.max(0, Number(document.getElementById('pay-penalty-amount')?.value || 0));
      const principal = Math.max(0, Number(document.getElementById('pay-principal-amount')?.value || 0));
      return { juros: mvRoundMoney(juros), multa: mvRoundMoney(multa), principal: mvRoundMoney(principal), total: mvRoundMoney(juros + multa + principal) };
    }
    function mvUpdatePaymentTotal() {
      const totalEl = document.getElementById('pay-total-money');
      const hidden = document.getElementById('pay-amount');
      const data = mvPaymentInputs();
      if (totalEl) totalEl.textContent = Utils.fmtMoney(data.total);
      if (hidden) hidden.value = data.total.toFixed(2);
      updatePenaltyDiscountPreview();
      updateAnticipationProjection();
    }
    function mvSetFieldValue(id, value) {
      const el = document.getElementById(id);
      if (el) el.value = mvRoundMoney(value).toFixed(2);
    }

    Crud.processPayment = (e) => {
      e.preventDefault();
      const instId = activeModal?.instId || activeModal?.inst?.id;
      const type = document.getElementById('pay-type')?.value || 'integral';
      const paymentDate = document.getElementById('pay-date')?.value || Utils.today();
      const nextDueDate = document.getElementById('pay-next-due')?.value || '';
      if (!instId) return Utils.toast('Parcela não selecionada', 'error');
      const inst = DB.getInstallmentById(instId);
      if (!inst) return Utils.toast('Parcela não encontrada', 'error');
      const loanForDue = DB.getLoanByKey(inst.loan_id_inst);
      const isProportional = Finance.isProportionalLoan(loanForDue);
      const isInstallmentMode = !isProportional;
      const previousDueDate = inst.due_date;

      const amountForSpecial = mvPaymentInputs().total || Number(document.getElementById('pay-amount')?.value || 0);
      if (type === 'quitacao_contrato') {
        if (!isInstallmentMode) return Utils.toast('Quitação projetada automática vale para contratos parcelados.', 'error');
        const result = Finance.applyInstallmentPayoff(inst.loan_id_inst, amountForSpecial, paymentDate);
        if (!result.ok) return Utils.toast(result.message || 'Não foi possível quitar o contrato.', 'error');
        DB.addPayment({
          id: Utils.uid(), type: 'payment', payment_id: Utils.uid(), installment_id_pay: inst.id, loan_id_pay: inst.loan_id_inst,
          payment_amount: mvRoundMoney(result.valorNecessario || amountForSpecial), payment_date: paymentDate, payment_type: 'quitacao_contrato',
          modoAplicacao: 'quitacao_valor_presente', observacao: 'Quitação total do contrato com projeção a valor presente nas parcelas futuras.',
          antecipacao_discount_total: mvRoundMoney(result.descontoAntecipacao || 0), antecipacao_total_baixado: mvRoundMoney(result.valorBaixadoTotal || 0),
          antecipacao_valor_recebido_aplicado: mvRoundMoney(result.valorNecessario || amountForSpecial), antecipacao_saldo_nao_aplicado: mvRoundMoney(result.saldoNaoAplicado || 0),
          parcelas_afetadas: result.parcelasAfetadas || [], paid_to_principal: mvRoundMoney(result.paidToPrincipal || 0),
          paid_to_period_interest: mvRoundMoney(result.paidToPeriodInterest || 0), paid_to_extra_interest: mvRoundMoney(result.paidToExtraInterest || 0), paid_to_penalty: mvRoundMoney(result.paidToPenalty || 0)
        });
        Utils.toast('Contrato quitado hoje: recebido ' + Utils.fmtMoney(result.valorNecessario) + ' | desconto futuro ' + Utils.fmtMoney(result.descontoAntecipacao), 'success');
        activeModal = null; render(); return;
      }
      if (type === 'antecipacao_parcelas') {
        if (!isInstallmentMode) return Utils.toast('Antecipação de parcelas futuras só vale para contratos parcelados.', 'error');
        const result = Finance.applyAnticipationToFutureInstallments(inst.loan_id_inst, amountForSpecial, paymentDate);
        if (!result.ok) return Utils.toast(result.message || 'Nenhuma parcela futura para antecipar.', 'error');
        DB.addPayment({
          id: Utils.uid(), type: 'payment', payment_id: Utils.uid(), installment_id_pay: inst.id, loan_id_pay: inst.loan_id_inst,
          payment_amount: mvRoundMoney(result.valorRecebidoAplicado || amountForSpecial), payment_date: paymentDate, payment_type: 'antecipacao_parcelas',
          modoAplicacao: 'de_tras_para_frente', observacao: 'Antecipação de parcelas futuras com desconto a valor presente, aplicada de trás para frente.',
          antecipacao_discount_total: mvRoundMoney(result.descontoAntecipacao || 0), antecipacao_total_baixado: mvRoundMoney(result.valorBaixadoTotal || 0),
          antecipacao_valor_recebido_aplicado: mvRoundMoney(result.valorRecebidoAplicado || 0), antecipacao_saldo_nao_aplicado: mvRoundMoney(result.saldoNaoAplicado || 0),
          parcelas_afetadas: result.parcelasAfetadas || [], paid_to_principal: 0, paid_to_period_interest: 0, paid_to_extra_interest: 0, paid_to_penalty: 0
        });
        Utils.toast('Antecipação aplicada: desconto ' + Utils.fmtMoney(result.descontoAntecipacao) + ' | baixa total ' + Utils.fmtMoney(result.valorBaixadoTotal), 'success');
        activeModal = null; render(); return;
      }

      let desiredNewDue = nextDueDate;
      if (desiredNewDue && new Date(desiredNewDue + 'T12:00:00') <= new Date(paymentDate + 'T12:00:00')) {
        return Utils.toast('A nova data precisa ser maior que a data do pagamento', 'error');
      }

      const paymentCycleReferenceDate = (!isInstallmentMode && paymentDate && previousDueDate && new Date(paymentDate + 'T12:00:00') <= new Date(previousDueDate + 'T12:00:00')) ? previousDueDate : paymentDate;
      const detOriginal = Finance.calcInstallmentDetails(inst, paymentCycleReferenceDate);
      const discountEnabled = !!document.getElementById('pay-discount-enabled')?.checked;
      const requestedPenaltyDiscountPercent = discountEnabled ? Math.max(0, Math.min(100, parseFloat(document.getElementById('pay-penalty-discount-percent')?.value || '0'))) : 0;
      const penaltyDiscountValue = mvRoundMoney(Math.min(Number(detOriginal.accumulatedPenalty || 0), Number(detOriginal.accumulatedPenalty || 0) * requestedPenaltyDiscountPercent / 100));
      const effectivePenaltyDue = mvRoundMoney(Math.max(0, Number(detOriginal.accumulatedPenalty || 0) - penaltyDiscountValue));
      const inputs = mvPaymentInputs();
      if (inputs.total <= 0) return Utils.toast('Informe algum valor pago em juros, multa ou principal.', 'error');

      const jurosSplit = mvSplitInterestPayment(detOriginal, inputs.juros);
      const paidToPeriodInterest = jurosSplit.paidToPeriodInterest;
      const paidToExtraInterest = jurosSplit.paidToExtraInterest;
      const paidToPenalty = mvRoundMoney(Math.min(effectivePenaltyDue, inputs.multa));
      const paidToPrincipal = (type !== 'juros' && type !== 'multa' && type !== 'jurosMulta') ? mvRoundMoney(Math.min(Number(detOriginal.principal || 0), inputs.principal)) : 0;
      const ignoredExcess = mvRoundMoney(Math.max(0, jurosSplit.unusedInterest) + Math.max(0, inputs.multa - paidToPenalty) + Math.max(0, inputs.principal - paidToPrincipal));
      const amount = mvRoundMoney(paidToPeriodInterest + paidToExtraInterest + paidToPenalty + paidToPrincipal);
      if (amount <= 0) return Utils.toast('O valor informado não encontrou juros, multa ou principal em aberto para baixar.', 'error');

      const remainingPrincipalAfterPayment = Math.max(0, Number(detOriginal.principal || 0) - paidToPrincipal);
      const cumulativePrincipal = Finance.getPaidTotal(inst, 'principal') + paidToPrincipal;
      const cumulativePeriodInterest = Finance.getPaidTotal(inst, 'periodInterest') + paidToPeriodInterest;
      const cumulativeExtraInterest = Finance.getPaidTotal(inst, 'extraInterest') + paidToExtraInterest;
      const cumulativePenalty = Finance.getPaidTotal(inst, 'penalty') + paidToPenalty;

      let newDue = previousDueDate;
      let patch = {
        paid_principal: mvRoundMoney(Number(inst.paid_principal || 0) + paidToPrincipal),
        paid_period_interest: mvRoundMoney(Number(inst.paid_period_interest || 0) + paidToPeriodInterest),
        paid_extra_interest: mvRoundMoney(Number(inst.paid_extra_interest || 0) + paidToExtraInterest),
        paid_penalty: mvRoundMoney(Number(inst.paid_penalty || 0) + paidToPenalty),
        total_paid_principal: mvRoundMoney(cumulativePrincipal),
        total_paid_period_interest: mvRoundMoney(cumulativePeriodInterest),
        total_paid_extra_interest: mvRoundMoney(cumulativeExtraInterest),
        total_paid_penalty: mvRoundMoney(cumulativePenalty),
        total_penalty_discount: mvRoundMoney(Number(inst.total_penalty_discount || 0) + penaltyDiscountValue),
        last_payment_date: paymentDate
      };

      const tempInst = { ...inst, ...patch };
      const detAfter = Finance.calcInstallmentDetails(tempInst, paymentCycleReferenceDate);
      const penaltyAfterCurrentDiscount = mvRoundMoney(Math.max(0, Number(detAfter.accumulatedPenalty || 0) - Number(penaltyDiscountValue || 0)));
      const fullyPaid = remainingPrincipalAfterPayment <= 0.009 && Number(detAfter.totalInterestPending || 0) <= 0.009 && penaltyAfterCurrentDiscount <= 0.009;

      if (fullyPaid) {
        patch = { ...patch, status_inst: 'pago' };
        if (isInstallmentMode) patch.last_payment_date = paymentDate;
        Utils.toast('Parcela quitada!', 'success');
      } else if (isInstallmentMode) {
        patch = { ...patch, status_inst: 'pendente' };
        Utils.toast('Pagamento registrado sem misturar juros e multa.', 'success');
      } else {
        const jurosQuitados = Number(detAfter.totalInterestPending || 0) <= 0.009;
        const multaQuitadaNoCiclo = penaltyAfterCurrentDiscount <= 0.009;
        const canRollCycle = jurosQuitados && multaQuitadaNoCiclo;
        if (!canRollCycle) {
          patch = { ...patch, status_inst: 'pendente' };
          Utils.toast('Pagamento registrado. Ainda ficou juros ou multa real em aberto; o ciclo não foi renovado.', 'success');
        } else {
          const paymentBeforeDue = new Date(paymentDate + 'T12:00:00') <= new Date(previousDueDate + 'T12:00:00');
          const baseDateForNextDue = paymentBeforeDue ? previousDueDate : paymentDate;
          newDue = desiredNewDue || Finance.getAutomaticNextDueDate(loanForDue, baseDateForNextDue);
          const roundedPrincipal = mvRoundMoney(remainingPrincipalAfterPayment);
          patch = {
            ...patch,
            original_principal_before_recalc: Number(inst.original_principal_before_recalc ?? inst.principal ?? 0),
            original_interest_before_recalc: Number(inst.original_interest_before_recalc ?? inst.interest ?? 0),
            principal: roundedPrincipal,
            interest: 0,
            installment_amount: roundedPrincipal,
            interest_start_date: paymentCycleReferenceDate,
            paid_principal: 0,
            paid_period_interest: 0,
            paid_extra_interest: 0,
            paid_penalty: 0,
            start_balance: roundedPrincipal,
            end_balance: 0,
            due_date: newDue,
            last_payment_date: '',
            status_inst: 'pendente'
          };
          Utils.toast('Ciclo renovado: juros e multa foram quitados separadamente.', 'success');
        }
      }

      DB.addPayment({
        id: Utils.uid(), type: 'payment', payment_id: Utils.uid(), installment_id_pay: inst.id, loan_id_pay: inst.loan_id_inst,
        payment_amount: amount, payment_date: paymentDate, payment_cycle_reference_date: paymentCycleReferenceDate,
        payment_type: type, payment_split_version: 2, previous_due_date: previousDueDate, new_due_date: (!isInstallmentMode && newDue !== previousDueDate) ? newDue : '',
        paid_to_principal: mvRoundMoney(paidToPrincipal), paid_to_period_interest: mvRoundMoney(paidToPeriodInterest), paid_to_extra_interest: mvRoundMoney(paidToExtraInterest), paid_to_penalty: mvRoundMoney(paidToPenalty),
        penalty_discount_percent: requestedPenaltyDiscountPercent, penalty_discount_value: penaltyDiscountValue,
        paid_extra_to_future_installments: 0, normal_excess_unallocated: ignoredExcess,
        recalculated_remaining_principal: remainingPrincipalAfterPayment, recalculated_future_interest: patch.interest ?? ''
      });

      DB.updateInstallment(inst.id, patch);
      const allInst = DB.getInstallmentsByLoan(inst.loan_id_inst);
      const allPaid = allInst.every(i => i.id === inst.id ? patch.status_inst === 'pago' : i.status_inst === 'pago');
      const loan = DB.getLoanByKey(inst.loan_id_inst);
      if (loan) DB.updateLoan(loan.id, { status_loan: allPaid ? 'quitado' : 'ativo' });
      activeModal = null;
      render();
    };

    mvSetPaymentMode = function(mode) {
      const inst = activeModal?.instId ? DB.getInstallmentById(activeModal.instId) : activeModal?.inst;
      if (!inst) return;
      const payDate = document.getElementById('pay-date')?.value || Utils.today();
      const refDate = mvGetPaymentCycleReferenceDate(inst);
      const det = Finance.calcInstallmentDetails(inst, refDate);
      const type = document.getElementById('pay-type');
      const title = document.getElementById('pay-mode-title');
      const nextWrap = document.getElementById('pay-next-wrap');
      const loan = DB.getLoanByKey(inst.loan_id_inst);
      const isInstallmentMode = loan && !Finance.isProportionalLoan(loan);
      if (type) type.value = mode;
      if (nextWrap) nextWrap.style.display = (mode === 'quitacao_contrato' || mode === 'antecipacao_parcelas') ? 'none' : 'block';
      const pct = document.getElementById('pay-discount-enabled')?.checked ? Math.max(0, Math.min(100, Number(document.getElementById('pay-penalty-discount-percent')?.value || 0))) : 0;
      const discount = mvRoundMoney(Number(det.accumulatedPenalty || 0) * pct / 100);
      const penaltyAfterDiscount = mvRoundMoney(Math.max(0, Number(det.accumulatedPenalty || 0) - discount));
      mvSetFieldValue('pay-interest-amount', 0);
      mvSetFieldValue('pay-penalty-amount', 0);
      mvSetFieldValue('pay-principal-amount', 0);
      if (mode === 'quitacao_contrato') {
        const payoff = Finance.simulateInstallmentPayoff(inst.loan_id_inst, payDate);
        if (title) title.textContent = 'Quitação total do contrato hoje';
        mvSetFieldValue('pay-principal-amount', payoff.totalHoje || 0);
      } else if (mode === 'antecipacao_parcelas') {
        if (title) title.textContent = 'Antecipar parcelas futuras';
      } else if (mode === 'juros') {
        if (title) title.textContent = 'Pagamento separado - somente juros';
        mvSetFieldValue('pay-interest-amount', det.totalInterestPending || 0);
      } else if (mode === 'multa') {
        if (title) title.textContent = 'Pagamento separado - somente multa';
        mvSetFieldValue('pay-penalty-amount', penaltyAfterDiscount);
      } else if (mode === 'parcial') {
        if (title) title.textContent = 'Pagamento manual separado';
      } else {
        if (title) title.textContent = 'Pagamento integral separado';
        mvSetFieldValue('pay-interest-amount', det.totalInterestPending || 0);
        mvSetFieldValue('pay-penalty-amount', penaltyAfterDiscount);
        mvSetFieldValue('pay-principal-amount', det.principal || 0);
      }
      mvUpdatePaymentTotal();
      updateAnticipationProjection();
    };

    updatePenaltyDiscountPreview = function() {
      const inst = activeModal?.instId ? DB.getInstallmentById(activeModal.instId) : activeModal?.inst;
      if (!inst) return;
      const det = Finance.calcInstallmentDetails(inst, mvGetPaymentCycleReferenceDate(inst));
      const enabled = document.getElementById('pay-discount-enabled')?.checked;
      const pct = enabled ? Math.max(0, Math.min(100, parseFloat(document.getElementById('pay-penalty-discount-percent')?.value || '0'))) : 0;
      const discount = mvRoundMoney(Number(det.accumulatedPenalty || 0) * pct / 100);
      const penaltyAfter = mvRoundMoney(Math.max(0, Number(det.accumulatedPenalty || 0) - discount));
      const preview = document.getElementById('pay-penalty-discount-preview');
      const after = document.getElementById('pay-penalty-after-discount');
      if (preview) preview.textContent = Utils.fmtMoney(discount);
      if (after) after.textContent = 'Multa após desconto: ' + Utils.fmtMoney(penaltyAfter);
      const type = document.getElementById('pay-type')?.value || 'integral';
      if (type === 'multa' || type === 'integral') mvSetFieldValue('pay-penalty-amount', penaltyAfter);
      const data = mvPaymentInputs();
      const totalEl = document.getElementById('pay-total-money');
      const hidden = document.getElementById('pay-amount');
      if (totalEl) totalEl.textContent = Utils.fmtMoney(data.total);
      if (hidden) hidden.value = data.total.toFixed(2);
    };

    mvBuildChargeMessage = function(loan, installment = null) {
      const client = DB.getClientById(loan.client_id);
      const pix = DB.getConfig('pix_key', 'Não configurado');
      const bizName = DB.getConfig('business_name', 'MV Financeira');
      const isProportional = Finance.isProportionalLoan(loan);
      const calcLabel = isProportional ? 'Saldo corrido proporcional' : (loan.calculation_mode === 'parcela_fixa' ? 'Parcela fixa' : 'Tabela Price');
      if (installment) {
        const det = Finance.calcInstallmentDetails(installment, Utils.today());
        if (!isProportional) {
          const installmentValue = mvRoundMoney(Number(installment.installment_amount || 0));
          const penaltyValue = mvRoundMoney(Number(det.accumulatedPenalty || 0));
          const totalToPay = mvRoundMoney(installmentValue + penaltyValue);
          const atraso = det.daysLate > 0 ? `\n⚠️ Atraso: ${det.daysLate} dia(s).` : '';
          const verbo = det.daysLate > 0 ? 'venceu em' : 'vence em';
          return `Olá, ${client?.name || 'cliente'}!\n\nSua parcela #${installment.number}, no valor de ${Utils.fmtMoney(installmentValue)}, ${verbo} ${Utils.fmtDate(installment.due_date)}.${atraso}\n\nMulta em atraso: ${Utils.fmtMoney(penaltyValue)}\nTotal para pagamento: ${Utils.fmtMoney(totalToPay)}\n\n💰 FORMA DE PAGAMENTO\nPIX: ${pix}\n\nApós o pagamento, envie o comprovante para baixa no sistema.\n\nAtenciosamente,\n${bizName}`;
        }
        const dueDet = Finance.calcInstallmentDetails(installment, installment.due_date);
        const todayDet = Finance.calcInstallmentDetails(installment, Utils.today());
        const capitalBase = mvRoundMoney(todayDet.principal || installment.principal || loan.amount || 0);

    function mvPaymentHasStoredAllocation(p) {
      return p && (p.payment_split_version === 2 || p.paid_to_principal != null || p.paid_to_period_interest != null || p.paid_to_extra_interest != null || p.paid_to_penalty != null);
    }

    Finance.rebuildInstallmentFromPayments = function(inst, paymentsToReplay) {
      const loan = DB.getLoanByKey(inst.loan_id_inst);
      const client = loan ? DB.getClientById(loan.client_id) : null;
      const dailyRate = Number(loan?.daily_rate_used ?? Finance.getLateDailyRate(client));
      const scheduledDue = Finance.getScheduledDueDate(loan, inst.number, inst.due_date);
      const isProportional = Finance.isProportionalLoan(loan);
      const originalPrincipal = Number(inst.original_principal_before_recalc ?? (Number(inst.principal || 0) + Finance.getPaidTotal(inst, 'principal')));
      const originalInterest = isProportional ? 0 : Number(inst.original_interest_before_recalc ?? (Number(inst.interest || 0) + Finance.getPaidTotal(inst, 'periodInterest')));
      let state = {
        ...inst,
        principal: mvRoundMoney(originalPrincipal), interest: mvRoundMoney(originalInterest), installment_amount: mvRoundMoney(originalPrincipal + originalInterest),
        paid_principal: 0, paid_period_interest: 0, paid_extra_interest: 0, paid_penalty: 0,
        total_paid_principal: 0, total_paid_period_interest: 0, total_paid_extra_interest: 0, total_paid_penalty: 0,
        total_penalty_discount: 0,
        due_date: scheduledDue, last_payment_date: '',
        interest_start_date: isProportional ? (loan?.date || inst.interest_start_date || scheduledDue) : (inst.interest_start_date || ''),
        start_balance: mvRoundMoney(originalPrincipal), end_balance: 0, status_inst: 'pendente'
      };
      const ordered = [...(paymentsToReplay || [])].sort((a,b) => {
        const da = String(a.payment_date || ''); const db = String(b.payment_date || '');
        if (da !== db) return da.localeCompare(db);
        return String(a.id || '').localeCompare(String(b.id || ''));
      });
      ordered.forEach(p => {
        const paymentDate = p.payment_date || Utils.today();
        const refDate = p.payment_cycle_reference_date || ((isProportional && state.due_date && paymentDate <= state.due_date) ? state.due_date : paymentDate);
        const det = Finance.calcInstallmentDetails(state, refDate);
        let paidToPeriodInterest, paidToExtraInterest, paidToPenalty, paidToPrincipal;
        if (mvPaymentHasStoredAllocation(p)) {
          paidToPeriodInterest = Math.min(Number(det.periodInterestPending || 0), Number(p.paid_to_period_interest || 0));
          paidToExtraInterest = Math.min(Number(det.extraInterestPending || 0), Number(p.paid_to_extra_interest || 0));
          paidToPenalty = Math.min(Number(det.accumulatedPenalty || 0), Number(p.paid_to_penalty || 0));
          paidToPrincipal = Math.min(Number(det.principal || 0), Number(p.paid_to_principal || 0));
        } else {
          let remaining = Number(p.payment_amount || 0);
          paidToPeriodInterest = Math.min(det.periodInterestPending, remaining); remaining -= paidToPeriodInterest;
          paidToExtraInterest = Math.min(det.extraInterestPending, remaining); remaining -= paidToExtraInterest;
          paidToPenalty = Math.min(det.accumulatedPenalty, remaining); remaining -= paidToPenalty;
          paidToPrincipal = p.payment_type !== 'jurosMulta' ? Math.min(det.principal, remaining) : 0;
        }
        state.paid_period_interest = mvRoundMoney(Number(state.paid_period_interest || 0) + paidToPeriodInterest);
        state.paid_extra_interest = mvRoundMoney(Number(state.paid_extra_interest || 0) + paidToExtraInterest);
        state.paid_penalty = mvRoundMoney(Number(state.paid_penalty || 0) + paidToPenalty);
        state.paid_principal = mvRoundMoney(Number(state.paid_principal || 0) + paidToPrincipal);
        state.total_paid_period_interest = mvRoundMoney(Number(state.total_paid_period_interest || 0) + paidToPeriodInterest);
        state.total_paid_extra_interest = mvRoundMoney(Number(state.total_paid_extra_interest || 0) + paidToExtraInterest);
        state.total_paid_penalty = mvRoundMoney(Number(state.total_paid_penalty || 0) + paidToPenalty);
        state.total_paid_principal = mvRoundMoney(Number(state.total_paid_principal || 0) + paidToPrincipal);
        state.total_penalty_discount = mvRoundMoney(Number(state.total_penalty_discount || 0) + Number(p.penalty_discount_value || 0));
        state.last_payment_date = paymentDate;
        const detAfter = Finance.calcInstallmentDetails(state, refDate);
        const penaltyAfterDiscount = mvRoundMoney(Math.max(0, Number(detAfter.accumulatedPenalty || 0) - Number(p.penalty_discount_value || 0)));
        const fullyPaid = Number(detAfter.principal || 0) <= 0.009 && Number(detAfter.totalInterestPending || 0) <= 0.009 && penaltyAfterDiscount <= 0.009;
        if (fullyPaid) {
          state.status_inst = 'pago';
        } else if (isProportional && Number(detAfter.totalInterestPending || 0) <= 0.009 && penaltyAfterDiscount <= 0.009) {
          const paymentBeforeDue = new Date(paymentDate + 'T12:00:00') <= new Date(state.due_date + 'T12:00:00');
          const baseDateForNextDue = paymentBeforeDue ? state.due_date : paymentDate;
          const newDue = p.new_due_date || Finance.getAutomaticNextDueDate(loan, baseDateForNextDue);
          const remainingPrincipal = mvRoundMoney(detAfter.principal || 0);
          state = { ...state, principal: remainingPrincipal, interest: 0, installment_amount: remainingPrincipal, interest_start_date: refDate,
            paid_principal: 0, paid_period_interest: 0, paid_extra_interest: 0, paid_penalty: 0, start_balance: remainingPrincipal, end_balance: 0, due_date: newDue, last_payment_date: '', status_inst: 'pendente' };
        } else {
          state.status_inst = 'pendente';
        }
      });
      return state;
    };

    Finance.rebuildNonProportionalLoanFromPayments = function(loanKey) {

      const payments = DB.getPaymentsByLoan(loanKey).sort((a,b) => {
        const da = String(a.payment_date || ''); const db = String(b.payment_date || '');
        if (da !== db) return da.localeCompare(db);
        return String(a.id || '').localeCompare(String(b.id || ''));
      });
      const n = Math.max(1, Number(loan.num_installments || installments.length || 1));
      const amount = Number(loan.amount || 0);
      const calc = Finance.isFixedInstallmentLoan(loan) ? Finance.calcFixedPaymentSchedule(amount, Number(loan.fixed_installment_value || 0), n) : Finance.calcInstallmentAmount(amount, Number(loan.rate_used || 0), loan.frequency || 'mensal', n);
      const schedule = calc?.schedule || [];
      installments.forEach(inst => {
        const row = schedule[Number(inst.number || 1) - 1] || {};
        const basePrincipal = mvRoundMoney(Number(row.principal ?? inst.original_principal_before_discount ?? inst.principal ?? 0));
        const baseInterest = mvRoundMoney(Number(row.interest ?? inst.original_interest_before_discount ?? inst.interest ?? 0));
        const baseAmount = mvRoundMoney(Number(row.installmentAmount ?? (basePrincipal + baseInterest)));
        DB.updateInstallment(inst.id, { principal: basePrincipal, interest: baseInterest, installment_amount: baseAmount,
          start_balance: mvRoundMoney(Number(row.startBalance ?? inst.start_balance ?? 0)), end_balance: mvRoundMoney(Number(row.endBalance ?? inst.end_balance ?? 0)),
          paid_principal: 0, paid_period_interest: 0, paid_extra_interest: 0, paid_penalty: 0,
          total_paid_principal: 0, total_paid_period_interest: 0, total_paid_extra_interest: 0, total_paid_penalty: 0, total_penalty_discount: 0,
          last_payment_date: '', status_inst: 'pendente', status_antecipacao: '', antecipacao_valor_recebido: 0, antecipacao_desconto: 0, antecipacao_baixa_total: 0, antecipacao_data: '',
          discount_applied: 0, original_principal_before_discount: basePrincipal, original_interest_before_discount: baseInterest, original_installment_amount_before_discount: baseAmount,
          payment_history_synced_at: new Date().toISOString() });
      });
      payments.forEach(pay => {
        if (pay.payment_type === 'antecipacao_parcelas') {
          const result = Finance.applyAnticipationToFutureInstallments(loanKey, Number(pay.payment_amount || 0), pay.payment_date || Utils.today());
          DB.updatePayment(pay.id, { antecipacao_discount_total: mvRoundMoney(result.descontoAntecipacao || 0), antecipacao_total_baixado: mvRoundMoney(result.valorBaixadoTotal || 0), antecipacao_valor_recebido_aplicado: mvRoundMoney(result.valorRecebidoAplicado || 0), antecipacao_saldo_nao_aplicado: mvRoundMoney(result.saldoNaoAplicado || 0), parcelas_afetadas: result.parcelasAfetadas || [] });
          return;
        }
        const currentInst = DB.getInstallmentById(pay.installment_id_pay);
        if (!currentInst) return;
        const det = Finance.calcInstallmentDetails(currentInst, pay.payment_date || Utils.today());
        let paidToPeriodInterest, paidToExtraInterest, paidToPenalty, paidToPrincipal;
        if (mvPaymentHasStoredAllocation(pay)) {
          paidToPeriodInterest = Math.min(Number(det.periodInterestPending || 0), Number(pay.paid_to_period_interest || 0));
          paidToExtraInterest = Math.min(Number(det.extraInterestPending || 0), Number(pay.paid_to_extra_interest || 0));
          paidToPenalty = Math.min(Number(det.accumulatedPenalty || 0), Number(pay.paid_to_penalty || 0));
          paidToPrincipal = Math.min(Number(det.principal || 0), Number(pay.paid_to_principal || 0));
        } else {
          let remaining = Number(pay.payment_amount || 0);
          paidToPeriodInterest = Math.min(det.periodInterestPending, remaining); remaining = mvRoundMoney(remaining - paidToPeriodInterest);
          paidToExtraInterest = Math.min(det.extraInterestPending, remaining); remaining = mvRoundMoney(remaining - paidToExtraInterest);
          paidToPenalty = Math.min(det.accumulatedPenalty, remaining); remaining = mvRoundMoney(remaining - paidToPenalty);
          paidToPrincipal = pay.payment_type !== 'jurosMulta' ? Math.min(det.principal, remaining) : 0;
        }
        const patch = { paid_principal: mvRoundMoney(Number(currentInst.paid_principal || 0) + paidToPrincipal), paid_period_interest: mvRoundMoney(Number(currentInst.paid_period_interest || 0) + paidToPeriodInterest), paid_extra_interest: mvRoundMoney(Number(currentInst.paid_extra_interest || 0) + paidToExtraInterest), paid_penalty: mvRoundMoney(Number(currentInst.paid_penalty || 0) + paidToPenalty), total_paid_principal: mvRoundMoney(Number(currentInst.total_paid_principal || 0) + paidToPrincipal), total_paid_period_interest: mvRoundMoney(Number(currentInst.total_paid_period_interest || 0) + paidToPeriodInterest), total_paid_extra_interest: mvRoundMoney(Number(currentInst.total_paid_extra_interest || 0) + paidToExtraInterest), total_paid_penalty: mvRoundMoney(Number(currentInst.total_paid_penalty || 0) + paidToPenalty), total_penalty_discount: mvRoundMoney(Number(currentInst.total_penalty_discount || 0) + Number(pay.penalty_discount_value || 0)), last_payment_date: pay.payment_date || Utils.today() };
        const testInst = { ...currentInst, ...patch };
        const detAfter = Finance.calcInstallmentDetails(testInst, pay.payment_date || Utils.today());
        const penaltyAfterDiscount = mvRoundMoney(Math.max(0, Number(detAfter.accumulatedPenalty || 0) - Number(pay.penalty_discount_value || 0)));
        patch.status_inst = (detAfter.totalInterestPending <= 0.009 && detAfter.principal <= 0.009 && penaltyAfterDiscount <= 0.009) ? 'pago' : 'pendente';
        DB.updateInstallment(currentInst.id, patch);
        DB.updatePayment(pay.id, { paid_to_principal: mvRoundMoney(paidToPrincipal), paid_to_period_interest: mvRoundMoney(paidToPeriodInterest), paid_to_extra_interest: mvRoundMoney(paidToExtraInterest), paid_to_penalty: mvRoundMoney(paidToPenalty), payment_split_version: mvPaymentHasStoredAllocation(pay) ? (pay.payment_split_version || 2) : (pay.payment_split_version || '') });
      });
      const updatedInstallments = DB.getInstallmentsByLoan(loanKey);
      const allPaid = updatedInstallments.length > 0 && updatedInstallments.every(i => i.status_inst === 'pago');
      DB.updateLoan(loan.id, { status_loan: allPaid ? 'quitado' : 'ativo', last_discount_recalc_at: new Date().toISOString() });
      return true;
    };




    /* =====================================================

    function mvGetPaymentCurrentDue(inst) {
      return document.getElementById('pay-current-due')?.value || inst?.due_date || Utils.today();
    }
    mvGetPaymentCycleReferenceDate = function(inst) {
      const paymentDate = document.getElementById('pay-date')?.value || Utils.today();
      const currentDue = mvGetPaymentCurrentDue(inst);
      if (!inst) return paymentDate;
      const loan = DB.getLoanByKey(inst.loan_id_inst);
      if (loan && Finance.isProportionalLoan(loan) && currentDue && new Date(paymentDate + 'T12:00:00') <= new Date(currentDue + 'T12:00:00')) {
        return currentDue;
      }
      return paymentDate;
    };
    mvRefreshPaymentByDate = function() {
      const mode = document.getElementById('pay-type')?.value || 'integral';
      const inst = activeModal?.instId ? DB.getInstallmentById(activeModal.instId) : activeModal?.inst;
      if (!inst) return;
      const workingInst = { ...inst, due_date: mvGetPaymentCurrentDue(inst) };
      const refDate = mvGetPaymentCycleReferenceDate(workingInst);
      const det = Finance.calcInstallmentDetails(workingInst, refDate);

      mvSetPaymentMode(mode);
    };

    Crud.processPayment = (e) => {
      e.preventDefault();
      const instId = activeModal?.instId || activeModal?.inst?.id;
      const type = document.getElementById('pay-type')?.value || 'integral';
      const paymentDate = document.getElementById('pay-date')?.value || Utils.today();
      const nextDueDate = document.getElementById('pay-next-due')?.value || '';
      if (!instId) return Utils.toast('Parcela não selecionada', 'error');
      const inst = DB.getInstallmentById(instId);
      if (!inst) return Utils.toast('Parcela não encontrada', 'error');
      const currentDueDate = document.getElementById('pay-current-due')?.value || inst.due_date || paymentDate;
      const instForCalc = { ...inst, due_date: currentDueDate };
      const loanForDue = DB.getLoanByKey(inst.loan_id_inst);
      const isProportional = Finance.isProportionalLoan(loanForDue);
      const isInstallmentMode = !isProportional;
      const previousDueDate = currentDueDate;

      if (currentDueDate !== inst.due_date) {
        DB.updateInstallment(inst.id, { due_date: currentDueDate, due_date_manual_updated_at: new Date().toISOString() });
      }

      const amountForSpecial = mvPaymentInputs().total || Number(document.getElementById('pay-amount')?.value || 0);
      if (type === 'quitacao_contrato') {
        if (!isInstallmentMode) return Utils.toast('Quitação projetada automática vale para contratos parcelados.', 'error');
        const result = Finance.applyInstallmentPayoff(inst.loan_id_inst, amountForSpecial, paymentDate);
        if (!result.ok) return Utils.toast(result.message || 'Não foi possível quitar o contrato.', 'error');
        DB.addPayment({
          id: Utils.uid(), type: 'payment', payment_id: Utils.uid(), installment_id_pay: inst.id, loan_id_pay: inst.loan_id_inst,
          payment_amount: mvRoundMoney(result.valorNecessario || amountForSpecial), payment_date: paymentDate, payment_type: 'quitacao_contrato',
          payment_split_version: 2, previous_due_date: previousDueDate, due_date_before_payment: previousDueDate,
          modoAplicacao: 'quitacao_valor_presente', observacao: 'Quitação total do contrato com projeção a valor presente nas parcelas futuras.',
          antecipacao_discount_total: mvRoundMoney(result.descontoAntecipacao || 0), antecipacao_total_baixado: mvRoundMoney(result.valorBaixadoTotal || 0),
          antecipacao_valor_recebido_aplicado: mvRoundMoney(result.valorNecessario || amountForSpecial), antecipacao_saldo_nao_aplicado: mvRoundMoney(result.saldoNaoAplicado || 0),
          parcelas_afetadas: result.parcelasAfetadas || [], paid_to_principal: mvRoundMoney(result.paidToPrincipal || 0),
          paid_to_period_interest: mvRoundMoney(result.paidToPeriodInterest || 0), paid_to_extra_interest: mvRoundMoney(result.paidToExtraInterest || 0), paid_to_penalty: mvRoundMoney(result.paidToPenalty || 0)
        });
        Utils.toast('Contrato quitado hoje: recebido ' + Utils.fmtMoney(result.valorNecessario) + ' | desconto futuro ' + Utils.fmtMoney(result.descontoAntecipacao), 'success');
        activeModal = null; render(); return;
      }
      if (type === 'antecipacao_parcelas') {
        if (!isInstallmentMode) return Utils.toast('Antecipação de parcelas futuras só vale para contratos parcelados.', 'error');
        const result = Finance.applyAnticipationToFutureInstallments(inst.loan_id_inst, amountForSpecial, paymentDate);
        if (!result.ok) return Utils.toast(result.message || 'Nenhuma parcela futura para antecipar.', 'error');
        DB.addPayment({
          id: Utils.uid(), type: 'payment', payment_id: Utils.uid(), installment_id_pay: inst.id, loan_id_pay: inst.loan_id_inst,
          payment_amount: mvRoundMoney(result.valorRecebidoAplicado || amountForSpecial), payment_date: paymentDate, payment_type: 'antecipacao_parcelas',
          payment_split_version: 2, previous_due_date: previousDueDate, due_date_before_payment: previousDueDate,
          modoAplicacao: 'de_tras_para_frente', observacao: 'Antecipação de parcelas futuras com desconto a valor presente, aplicada de trás para frente.',
          antecipacao_discount_total: mvRoundMoney(result.descontoAntecipacao || 0), antecipacao_total_baixado: mvRoundMoney(result.valorBaixadoTotal || 0),
          antecipacao_valor_recebido_aplicado: mvRoundMoney(result.valorRecebidoAplicado || 0), antecipacao_saldo_nao_aplicado: mvRoundMoney(result.saldoNaoAplicado || 0),
          parcelas_afetadas: result.parcelasAfetadas || [], paid_to_principal: 0, paid_to_period_interest: 0, paid_to_extra_interest: 0, paid_to_penalty: 0
        });
        Utils.toast('Antecipação aplicada: desconto ' + Utils.fmtMoney(result.descontoAntecipacao) + ' | baixa total ' + Utils.fmtMoney(result.valorBaixadoTotal), 'success');
        activeModal = null; render(); return;
      }

      const paymentCycleReferenceDate = (!isInstallmentMode && paymentDate && previousDueDate && new Date(paymentDate + 'T12:00:00') <= new Date(previousDueDate + 'T12:00:00')) ? previousDueDate : paymentDate;
      const detOriginal = Finance.calcInstallmentDetails(instForCalc, paymentCycleReferenceDate);
      const discountEnabled = !!document.getElementById('pay-discount-enabled')?.checked;
      const requestedPenaltyDiscountPercent = discountEnabled ? Math.max(0, Math.min(100, parseFloat(document.getElementById('pay-penalty-discount-percent')?.value || '0'))) : 0;
      const penaltyDiscountValue = mvRoundMoney(Math.min(Number(detOriginal.accumulatedPenalty || 0), Number(detOriginal.accumulatedPenalty || 0) * requestedPenaltyDiscountPercent / 100));
      const effectivePenaltyDue = mvRoundMoney(Math.max(0, Number(detOriginal.accumulatedPenalty || 0) - penaltyDiscountValue));
      const inputs = mvPaymentInputs();
      if (inputs.total <= 0 && penaltyDiscountValue <= 0) return Utils.toast('Informe algum valor pago em juros, multa ou principal.', 'error');

      const jurosSplit = mvSplitInterestPayment(detOriginal, inputs.juros);
      const paidToPeriodInterest = jurosSplit.paidToPeriodInterest;
      const paidToExtraInterest = jurosSplit.paidToExtraInterest;
      const paidToPenalty = mvRoundMoney(Math.min(effectivePenaltyDue, inputs.multa));
      const paidToPrincipal = (type !== 'juros' && type !== 'multa' && type !== 'jurosMulta') ? mvRoundMoney(Math.min(Number(detOriginal.principal || 0), inputs.principal)) : 0;
      const ignoredExcess = mvRoundMoney(Math.max(0, jurosSplit.unusedInterest) + Math.max(0, inputs.multa - paidToPenalty) + Math.max(0, inputs.principal - paidToPrincipal));
      const amount = mvRoundMoney(paidToPeriodInterest + paidToExtraInterest + paidToPenalty + paidToPrincipal);
      if (amount <= 0 && penaltyDiscountValue <= 0) return Utils.toast('O valor informado não encontrou juros, multa ou principal em aberto para baixar.', 'error');

      const remainingPrincipalAfterPayment = Math.max(0, Number(detOriginal.principal || 0) - paidToPrincipal);
      const cumulativePrincipal = Finance.getPaidTotal(inst, 'principal') + paidToPrincipal;
      const cumulativePeriodInterest = Finance.getPaidTotal(inst, 'periodInterest') + paidToPeriodInterest;
      const cumulativeExtraInterest = Finance.getPaidTotal(inst, 'extraInterest') + paidToExtraInterest;
      const cumulativePenalty = Finance.getPaidTotal(inst, 'penalty') + paidToPenalty;

      let newDue = previousDueDate;
      let patch = {
        due_date: previousDueDate,
        paid_principal: mvRoundMoney(Number(inst.paid_principal || 0) + paidToPrincipal),
        paid_period_interest: mvRoundMoney(Number(inst.paid_period_interest || 0) + paidToPeriodInterest),
        paid_extra_interest: mvRoundMoney(Number(inst.paid_extra_interest || 0) + paidToExtraInterest),
        paid_penalty: mvRoundMoney(Number(inst.paid_penalty || 0) + paidToPenalty),
        total_paid_principal: mvRoundMoney(cumulativePrincipal),
        total_paid_period_interest: mvRoundMoney(cumulativePeriodInterest),
        total_paid_extra_interest: mvRoundMoney(cumulativeExtraInterest),
        total_paid_penalty: mvRoundMoney(cumulativePenalty),
        total_penalty_discount: mvRoundMoney(Number(inst.total_penalty_discount || 0) + penaltyDiscountValue),
        last_payment_date: paymentDate
      };

      const tempInst = { ...instForCalc, ...patch };
      const detAfter = Finance.calcInstallmentDetails(tempInst, paymentCycleReferenceDate);
      const penaltyAfterCurrentDiscount = mvRoundMoney(Math.max(0, Number(detAfter.accumulatedPenalty || 0) - Number(penaltyDiscountValue || 0)));
      const fullyPaid = remainingPrincipalAfterPayment <= 0.009 && Number(detAfter.totalInterestPending || 0) <= 0.009 && penaltyAfterCurrentDiscount <= 0.009;

      if (fullyPaid) {
        patch = { ...patch, status_inst: 'pago' };
        if (isInstallmentMode) patch.last_payment_date = paymentDate;
        Utils.toast('Parcela quitada!', 'success');
      } else if (isInstallmentMode) {
        patch = { ...patch, status_inst: 'pendente' };
        Utils.toast('Pagamento registrado sem misturar juros e multa.', 'success');
      } else {
        const jurosQuitados = Number(detAfter.totalInterestPending || 0) <= 0.009;
        const multaQuitadaNoCiclo = penaltyAfterCurrentDiscount <= 0.009;
        const canRollCycle = jurosQuitados && multaQuitadaNoCiclo;
        if (!canRollCycle) {
          patch = { ...patch, status_inst: 'pendente' };
          Utils.toast('Pagamento registrado. Ainda ficou juros ou multa real em aberto; o ciclo não foi renovado.', 'success');
        } else {
          const paymentBeforeDue = new Date(paymentDate + 'T12:00:00') <= new Date(previousDueDate + 'T12:00:00');
          const baseDateForNextDue = paymentBeforeDue ? previousDueDate : paymentDate;
          newDue = nextDueDate || Finance.getAutomaticNextDueDate(loanForDue, baseDateForNextDue);
          const roundedPrincipal = mvRoundMoney(remainingPrincipalAfterPayment);
          patch = {
            ...patch,
            original_principal_before_recalc: Number(inst.original_principal_before_recalc ?? inst.principal ?? 0),
            original_interest_before_recalc: Number(inst.original_interest_before_recalc ?? inst.interest ?? 0),
            principal: roundedPrincipal,
            interest: 0,
            installment_amount: roundedPrincipal,
            interest_start_date: paymentCycleReferenceDate,
            paid_principal: 0,
            paid_period_interest: 0,
            paid_extra_interest: 0,
            paid_penalty: 0,
            start_balance: roundedPrincipal,
            end_balance: 0,
            due_date: newDue,
            last_payment_date: '',
            status_inst: 'pendente'
          };
          Utils.toast('Ciclo renovado pela data real do pagamento.', 'success');
        }
      }

      DB.addPayment({
        id: Utils.uid(), type: 'payment', payment_id: Utils.uid(), installment_id_pay: inst.id, loan_id_pay: inst.loan_id_inst,
        payment_amount: amount, payment_date: paymentDate, payment_cycle_reference_date: paymentCycleReferenceDate,
        payment_type: type, payment_split_version: 2, previous_due_date: previousDueDate, due_date_before_payment: previousDueDate, new_due_date: (!isInstallmentMode && newDue !== previousDueDate) ? newDue : '',
        paid_to_principal: mvRoundMoney(paidToPrincipal), paid_to_period_interest: mvRoundMoney(paidToPeriodInterest), paid_to_extra_interest: mvRoundMoney(paidToExtraInterest), paid_to_penalty: mvRoundMoney(paidToPenalty),
        penalty_discount_percent: requestedPenaltyDiscountPercent, penalty_discount_value: penaltyDiscountValue,
        paid_extra_to_future_installments: 0, normal_excess_unallocated: ignoredExcess,
        recalculated_remaining_principal: remainingPrincipalAfterPayment, recalculated_future_interest: patch.interest ?? ''
      });

      DB.updateInstallment(inst.id, patch);
      const allInst = DB.getInstallmentsByLoan(inst.loan_id_inst);
      const allPaid = allInst.every(i => i.id === inst.id ? patch.status_inst === 'pago' : i.status_inst === 'pago');
      const loan = DB.getLoanByKey(inst.loan_id_inst);
      if (loan) DB.updateLoan(loan.id, { status_loan: allPaid ? 'quitado' : 'ativo' });
      activeModal = null;
      render();
    };

    Finance.rebuildInstallmentFromPayments = function(inst, paymentsToReplay) {
      const loan = DB.getLoanByKey(inst.loan_id_inst);
      const scheduledDue = Finance.getScheduledDueDate(loan, inst.number, inst.due_date);
      const isProportional = Finance.isProportionalLoan(loan);
      const originalPrincipal = Number(inst.original_principal_before_recalc ?? inst.original_principal_before_discount ?? (Number(inst.principal || 0) + Finance.getPaidTotal(inst, 'principal')));
      const originalInterest = isProportional ? 0 : Number(inst.original_interest_before_recalc ?? inst.original_interest_before_discount ?? (Number(inst.interest || 0) + Finance.getPaidTotal(inst, 'periodInterest')));
      let state = { ...inst, principal: mvRoundMoney(originalPrincipal), interest: mvRoundMoney(originalInterest), installment_amount: mvRoundMoney(originalPrincipal + originalInterest), paid_principal: 0, paid_period_interest: 0, paid_extra_interest: 0, paid_penalty: 0, total_paid_principal: 0, total_paid_period_interest: 0, total_paid_extra_interest: 0, total_paid_penalty: 0, total_penalty_discount: 0, due_date: scheduledDue, last_payment_date: '', interest_start_date: isProportional ? (loan?.date || inst.interest_start_date || scheduledDue) : (inst.interest_start_date || ''), start_balance: mvRoundMoney(originalPrincipal), end_balance: 0, status_inst: 'pendente' };
      const ordered = [...(paymentsToReplay || [])].sort((a,b) => {
        const da = String(a.payment_date || ''); const db = String(b.payment_date || '');
        if (da !== db) return da.localeCompare(db);
        return String(a.id || '').localeCompare(String(b.id || ''));
      });
      ordered.forEach(p => {
        if (p.due_date_before_payment || p.previous_due_date) state.due_date = p.due_date_before_payment || p.previous_due_date;
        const paymentDate = p.payment_date || Utils.today();
        const refDate = p.payment_cycle_reference_date || ((isProportional && state.due_date && new Date(paymentDate + 'T12:00:00') <= new Date(state.due_date + 'T12:00:00')) ? state.due_date : paymentDate);
        const det = Finance.calcInstallmentDetails(state, refDate);
        let paidToPeriodInterest, paidToExtraInterest, paidToPenalty, paidToPrincipal;
        if (mvPaymentHasStoredAllocation(p)) {
          paidToPeriodInterest = Math.min(Number(det.periodInterestPending || 0), Number(p.paid_to_period_interest || 0));
          paidToExtraInterest = Math.min(Number(det.extraInterestPending || 0), Number(p.paid_to_extra_interest || 0));
          paidToPenalty = Math.min(Number(det.accumulatedPenalty || 0), Number(p.paid_to_penalty || 0));
          paidToPrincipal = Math.min(Number(det.principal || 0), Number(p.paid_to_principal || 0));
        } else {
          let remaining = Number(p.payment_amount || 0);
          paidToPeriodInterest = Math.min(det.periodInterestPending, remaining); remaining = mvRoundMoney(remaining - paidToPeriodInterest);
          paidToExtraInterest = Math.min(det.extraInterestPending, remaining); remaining = mvRoundMoney(remaining - paidToExtraInterest);
          paidToPenalty = Math.min(det.accumulatedPenalty, remaining); remaining = mvRoundMoney(remaining - paidToPenalty);
          paidToPrincipal = p.payment_type !== 'jurosMulta' ? Math.min(det.principal, remaining) : 0;
        }
        state.paid_period_interest = mvRoundMoney(Number(state.paid_period_interest || 0) + paidToPeriodInterest);
        state.paid_extra_interest = mvRoundMoney(Number(state.paid_extra_interest || 0) + paidToExtraInterest);
        state.paid_penalty = mvRoundMoney(Number(state.paid_penalty || 0) + paidToPenalty);
        state.paid_principal = mvRoundMoney(Number(state.paid_principal || 0) + paidToPrincipal);
        state.total_paid_period_interest = mvRoundMoney(Number(state.total_paid_period_interest || 0) + paidToPeriodInterest);
        state.total_paid_extra_interest = mvRoundMoney(Number(state.total_paid_extra_interest || 0) + paidToExtraInterest);
        state.total_paid_penalty = mvRoundMoney(Number(state.total_paid_penalty || 0) + paidToPenalty);
        state.total_paid_principal = mvRoundMoney(Number(state.total_paid_principal || 0) + paidToPrincipal);
        state.total_penalty_discount = mvRoundMoney(Number(state.total_penalty_discount || 0) + Number(p.penalty_discount_value || 0));
        state.last_payment_date = paymentDate;
        const detAfter = Finance.calcInstallmentDetails(state, refDate);
        const penaltyAfterDiscount = mvRoundMoney(Math.max(0, Number(detAfter.accumulatedPenalty || 0) - Number(p.penalty_discount_value || 0)));
        const fullyPaid = Number(detAfter.principal || 0) <= 0.009 && Number(detAfter.totalInterestPending || 0) <= 0.009 && penaltyAfterDiscount <= 0.009;
        if (fullyPaid) {
          state.status_inst = 'pago';
        } else if (isProportional && Number(detAfter.totalInterestPending || 0) <= 0.009 && penaltyAfterDiscount <= 0.009) {
          const paymentBeforeDue = new Date(paymentDate + 'T12:00:00') <= new Date(state.due_date + 'T12:00:00');
          const baseDateForNextDue = paymentBeforeDue ? state.due_date : paymentDate;
          const newDue = p.new_due_date || Finance.getAutomaticNextDueDate(loan, baseDateForNextDue);
          const remainingPrincipal = mvRoundMoney(detAfter.principal || 0);
          state = { ...state, principal: remainingPrincipal, interest: 0, installment_amount: remainingPrincipal, interest_start_date: refDate, paid_principal: 0, paid_period_interest: 0, paid_extra_interest: 0, paid_penalty: 0, start_balance: remainingPrincipal, end_balance: 0, due_date: newDue, last_payment_date: '', status_inst: 'pendente' };
        } else {
          state.status_inst = 'pendente';
        }
      });
      return state;
    };

    Crud.deletePayment = (paymentId) => {
      const payment = DB.getPaymentById(paymentId);
      if (!payment) return;
      const inst = DB.getInstallmentById(payment.installment_id_pay);
      const loan = DB.getLoanByKey(payment.loan_id_pay);
      DB.deletePayment(paymentId);
      if (loan && !Finance.isProportionalLoan(loan)) {
        Finance.rebuildNonProportionalLoanFromPayments(payment.loan_id_pay);
        Utils.toast('Pagamento removido. Contrato parcelado recalculado com o histórico restante.', 'success');
        render();
        return;
      }
      if (inst) {
        const remainingPayments = DB.getPaymentsByLoan(payment.loan_id_pay).filter(p => p.installment_id_pay === payment.installment_id_pay);
        const rebuilt = Finance.rebuildInstallmentFromPayments(inst, remainingPayments);
        DB.updateInstallment(inst.id, rebuilt);
      }
      if (loan) {
        const allInst = DB.getInstallmentsByLoan(payment.loan_id_pay);
        const allPaid = allInst.length > 0 && allInst.every(i => i.status_inst === 'pago');
        DB.updateLoan(loan.id, { status_loan: allPaid ? 'quitado' : 'ativo', last_payment_delete_rebuild_at: new Date().toISOString() });
      }
      Utils.toast('Pagamento removido e parcela reconstruída corretamente.', 'success');
      render();
    };

    mvSetPaymentMode = function(mode) {
      const inst = activeModal?.instId ? DB.getInstallmentById(activeModal.instId) : activeModal?.inst;
      if (!inst) return;
      const payDate = document.getElementById('pay-date')?.value || Utils.today();
      const workingInst = { ...inst, due_date: mvGetPaymentCurrentDue(inst) };
      const refDate = mvGetPaymentCycleReferenceDate(workingInst);
      const det = Finance.calcInstallmentDetails(workingInst, refDate);
      const type = document.getElementById('pay-type');
      const title = document.getElementById('pay-mode-title');
      const nextWrap = document.getElementById('pay-next-wrap');
      const loan = DB.getLoanByKey(inst.loan_id_inst);
      const isInstallmentMode = loan && !Finance.isProportionalLoan(loan);
      if (type) type.value = mode;
      if (nextWrap) nextWrap.style.display = (mode === 'quitacao_contrato' || mode === 'antecipacao_parcelas') ? 'none' : 'block';
      const pct = document.getElementById('pay-discount-enabled')?.checked ? Math.max(0, Math.min(100, Number(document.getElementById('pay-penalty-discount-percent')?.value || 0))) : 0;
      const discount = mvRoundMoney(Number(det.accumulatedPenalty || 0) * pct / 100);
      const penaltyAfterDiscount = mvRoundMoney(Math.max(0, Number(det.accumulatedPenalty || 0) - discount));
      mvSetFieldValue('pay-interest-amount', 0);
      mvSetFieldValue('pay-penalty-amount', 0);
      mvSetFieldValue('pay-principal-amount', 0);
      if (mode === 'quitacao_contrato') {
        const payoff = Finance.simulateInstallmentPayoff(inst.loan_id_inst, payDate);
        if (title) title.textContent = 'Quitação total do contrato hoje';
        mvSetFieldValue('pay-principal-amount', payoff.totalHoje || 0);
      } else if (mode === 'antecipacao_parcelas') {
        if (title) title.textContent = 'Antecipar parcelas futuras';
      } else if (mode === 'juros') {
        if (title) title.textContent = 'Pagamento separado - somente juros';
        mvSetFieldValue('pay-interest-amount', det.totalInterestPending || 0);
      } else if (mode === 'multa') {
        if (title) title.textContent = 'Pagamento separado - somente multa';
        mvSetFieldValue('pay-penalty-amount', penaltyAfterDiscount);
      } else if (mode === 'parcial') {
        if (title) title.textContent = 'Pagamento manual separado';
      } else {
        if (title) title.textContent = 'Pagamento integral separado';
        mvSetFieldValue('pay-interest-amount', det.totalInterestPending || 0);
        mvSetFieldValue('pay-penalty-amount', penaltyAfterDiscount);
        mvSetFieldValue('pay-principal-amount', det.principal || 0);
      }
      const pview = document.getElementById('pay-date-preview');
      if (pview) pview.innerHTML = 'Cálculo pela data real: <b>' + Utils.fmtDate(payDate) + '</b> • vencimento considerado: <b>' + Utils.fmtDate(workingInst.due_date) + '</b> • multa nesta data: <b class="text-red-300">' + Utils.fmtMoney(det.accumulatedPenalty || 0) + '</b>';
      mvUpdatePaymentTotal();
      updateAnticipationProjection();
    };

    updatePenaltyDiscountPreview = function() {
      const inst = activeModal?.instId ? DB.getInstallmentById(activeModal.instId) : activeModal?.inst;
      if (!inst) return;

    function mvGetAvulsoValue() {
      return mvRoundMoney(Number(document.getElementById('pay-avulso-amount')?.value || 0));
    }

    function mvSimulateAvulsoSplit(det, value) {
      let remaining = mvRoundMoney(value);
      const jurosSplit = mvSplitInterestPayment(det, remaining);
      const paidToPeriodInterest = mvRoundMoney(jurosSplit.paidToPeriodInterest || 0);
      const paidToExtraInterest = mvRoundMoney(jurosSplit.paidToExtraInterest || 0);
      remaining = mvRoundMoney(remaining - paidToPeriodInterest - paidToExtraInterest);
      const paidToPrincipal = mvRoundMoney(Math.min(Number(det.principal || 0), Math.max(0, remaining)));
      remaining = mvRoundMoney(remaining - paidToPrincipal);
      return {
        paidToPeriodInterest,
        paidToExtraInterest,
        paidToPenalty: 0,
        paidToPrincipal,
        amount: mvRoundMoney(paidToPeriodInterest + paidToExtraInterest + paidToPrincipal),
        unused: mvRoundMoney(Math.max(0, remaining))
      };

    const processPaymentV13 = Crud.processPayment;
    Crud.processPayment = (e) => {
      const type = document.getElementById('pay-type')?.value || 'integral';
      if (type !== 'avulso') return processPaymentV13(e);
      e.preventDefault();
      const instId = activeModal?.instId || activeModal?.inst?.id;
      const paymentDate = document.getElementById('pay-date')?.value || Utils.today();
      const nextDueDate = document.getElementById('pay-next-due')?.value || '';
      if (!instId) return Utils.toast('Parcela não selecionada', 'error');
      const inst = DB.getInstallmentById(instId);
      if (!inst) return Utils.toast('Parcela não encontrada', 'error');
      const currentDueDate = document.getElementById('pay-current-due')?.value || inst.due_date || paymentDate;
      const instForCalc = { ...inst, due_date: currentDueDate };
      const loanForDue = DB.getLoanByKey(inst.loan_id_inst);
      const isProportional = Finance.isProportionalLoan(loanForDue);
      const isInstallmentMode = !isProportional;
      const previousDueDate = currentDueDate;
      if (currentDueDate !== inst.due_date) DB.updateInstallment(inst.id, { due_date: currentDueDate, due_date_manual_updated_at: new Date().toISOString() });

      const paymentCycleReferenceDate = (!isInstallmentMode && paymentDate && previousDueDate && new Date(paymentDate + 'T12:00:00') <= new Date(previousDueDate + 'T12:00:00')) ? previousDueDate : paymentDate;
      const detOriginal = Finance.calcInstallmentDetails(instForCalc, paymentCycleReferenceDate);
      const split = mvSimulateAvulsoSplit(detOriginal, mvGetAvulsoValue());
      if (split.amount <= 0) return Utils.toast('Informe um valor avulso válido para baixar juros ou principal.', 'error');

      const remainingPrincipalAfterPayment = mvRoundMoney(Math.max(0, Number(detOriginal.principal || 0) - split.paidToPrincipal));
      const cumulativePrincipal = Finance.getPaidTotal(inst, 'principal') + split.paidToPrincipal;
      const cumulativePeriodInterest = Finance.getPaidTotal(inst, 'periodInterest') + split.paidToPeriodInterest;
      const cumulativeExtraInterest = Finance.getPaidTotal(inst, 'extraInterest') + split.paidToExtraInterest;
      const cumulativePenalty = Finance.getPaidTotal(inst, 'penalty');

      let newDue = previousDueDate;
      let patch = {
        due_date: previousDueDate,
        paid_principal: mvRoundMoney(Number(inst.paid_principal || 0) + split.paidToPrincipal),
        paid_period_interest: mvRoundMoney(Number(inst.paid_period_interest || 0) + split.paidToPeriodInterest),
        paid_extra_interest: mvRoundMoney(Number(inst.paid_extra_interest || 0) + split.paidToExtraInterest),
        paid_penalty: mvRoundMoney(Number(inst.paid_penalty || 0)),
        total_paid_principal: mvRoundMoney(cumulativePrincipal),
        total_paid_period_interest: mvRoundMoney(cumulativePeriodInterest),
        total_paid_extra_interest: mvRoundMoney(cumulativeExtraInterest),
        total_paid_penalty: mvRoundMoney(cumulativePenalty),
        last_payment_date: paymentDate
      };

      const tempInst = { ...instForCalc, ...patch };
      const detAfter = Finance.calcInstallmentDetails(tempInst, paymentCycleReferenceDate);
      const fullyPaid = remainingPrincipalAfterPayment <= 0.009 && Number(detAfter.totalInterestPending || 0) <= 0.009 && Number(detAfter.accumulatedPenalty || 0) <= 0.009;

      if (fullyPaid) {
        patch = { ...patch, status_inst: 'pago' };
        Utils.toast('Parcela quitada com pagamento avulso.', 'success');
      } else if (isInstallmentMode) {
        patch = { ...patch, status_inst: 'pendente' };
        Utils.toast('Pagamento avulso registrado: juros baixados e sobra abatida do principal.', 'success');
      } else {
        const jurosQuitados = Number(detAfter.totalInterestPending || 0) <= 0.009;
        const multaEmAberto = Number(detAfter.accumulatedPenalty || 0) > 0.009;
        if (jurosQuitados && !multaEmAberto) {
          const paymentBeforeDue = new Date(paymentDate + 'T12:00:00') <= new Date(previousDueDate + 'T12:00:00');
          const baseDateForNextDue = paymentBeforeDue ? previousDueDate : paymentDate;
          newDue = nextDueDate || Finance.getAutomaticNextDueDate(loanForDue, baseDateForNextDue);
          patch = {
            ...patch,
            original_principal_before_recalc: Number(inst.original_principal_before_recalc ?? inst.principal ?? 0),
            original_interest_before_recalc: Number(inst.original_interest_before_recalc ?? inst.interest ?? 0),
            principal: remainingPrincipalAfterPayment,
            interest: 0,
            installment_amount: remainingPrincipalAfterPayment,
            interest_start_date: paymentCycleReferenceDate,
            paid_principal: 0,
            paid_period_interest: 0,
            paid_extra_interest: 0,
            paid_penalty: 0,
            start_balance: remainingPrincipalAfterPayment,
            end_balance: 0,
            due_date: newDue,
            last_payment_date: '',
            status_inst: 'pendente'
          };
          Utils.toast('Pagamento avulso registrado e ciclo renovado pelos juros quitados.', 'success');
        } else {
          patch = { ...patch, status_inst: 'pendente' };
          Utils.toast(multaEmAberto ? 'Pagamento avulso registrado. A multa continua separada em aberto.' : 'Pagamento avulso registrado. Ainda ficou juros em aberto.', 'success');
        }
      }

      DB.addPayment({
        id: Utils.uid(), type: 'payment', payment_id: Utils.uid(), installment_id_pay: inst.id, loan_id_pay: inst.loan_id_inst,
        payment_amount: split.amount, payment_date: paymentDate, payment_cycle_reference_date: paymentCycleReferenceDate,
        payment_type: 'avulso', payment_split_version: 3, previous_due_date: previousDueDate, due_date_before_payment: previousDueDate, new_due_date: (!isInstallmentMode && newDue !== previousDueDate) ? newDue : '',
        paid_to_principal: mvRoundMoney(split.paidToPrincipal), paid_to_period_interest: mvRoundMoney(split.paidToPeriodInterest), paid_to_extra_interest: mvRoundMoney(split.paidToExtraInterest), paid_to_penalty: 0,
        penalty_discount_percent: 0, penalty_discount_value: 0, paid_extra_to_future_installments: 0, normal_excess_unallocated: split.unused,
        observacao: 'Pagamento avulso: baixa juros primeiro e o excedente abate principal. Multa permanece separada.',
        recalculated_remaining_principal: remainingPrincipalAfterPayment, recalculated_future_interest: patch.interest ?? ''
      });

      DB.updateInstallment(inst.id, patch);
      const allInst = DB.getInstallmentsByLoan(inst.loan_id_inst);
      const allPaid = allInst.every(i => i.id === inst.id ? patch.status_inst === 'pago' : i.status_inst === 'pago');
      const loan = DB.getLoanByKey(inst.loan_id_inst);
      if (loan) DB.updateLoan(loan.id, { status_loan: allPaid ? 'quitado' : 'ativo' });
      activeModal = null;
      render();
    };

    /* =====================================================
       V13 - EDIÇÃO DE DATA RECALCULA JUROS DO PERÍODO
       - Ao editar Data do Empréstimo / 1ª Parcela, o saldo corrido volta a usar
         a nova data como início dos juros.
       - Se já existir histórico de pagamentos, reconstrói o ciclo a partir dos
         pagamentos restantes, respeitando a nova data editada.
       - Em contratos parcelados, refaz parcelas/datas e reaplica histórico.
       ===================================================== */
    mvRecalculateInstallmentsForEditedLoan = function(loan, calc, dates) {
      const existing = DB.getInstallmentsByLoan(loan.loan_id).sort((a,b) => Number(a.number || 0) - Number(b.number || 0));
      const existingByNumber = {};
      existing.forEach(item => { existingByNumber[Number(item.number || 0)] = item; });
      const count = Math.max(1, Number(loan.num_installments || 1));
      const nowIso = new Date().toISOString();
      const isProportional = Finance.isProportionalLoan(loan);

      for (let i = 0; i < count; i++) {
        const row = calc.schedule?.[i] || { installmentAmount: loan.amount, principal: loan.amount, interest: 0, startBalance: loan.amount, endBalance: 0 };
        const basePrincipal = mvRoundMoney(row.principal);
        const baseInterest = isProportional ? 0 : mvRoundMoney(row.interest);
        const baseAmount = isProportional ? basePrincipal : mvRoundMoney(row.installmentAmount);
        const basePatch = {
          loan_id_inst: loan.loan_id,
          number: i + 1,
          due_date: dates[i] || loan.first_due || Utils.today(),
          installment_amount: baseAmount,
          principal: basePrincipal,
          interest: baseInterest,
          start_balance: mvRoundMoney(row.startBalance ?? basePrincipal),
          end_balance: mvRoundMoney(row.endBalance ?? 0),
          original_principal_before_discount: basePrincipal,
          original_interest_before_discount: baseInterest,
          original_installment_amount_before_discount: baseAmount,
          original_principal_before_recalc: basePrincipal,
          original_interest_before_recalc: baseInterest,
          edited_at: nowIso,
          // ponto principal: em saldo corrido, juros começam na nova data do empréstimo editada
          interest_start_date: isProportional ? (loan.date || dates[i] || Utils.today()) : ''
        };

        const old = existingByNumber[i + 1];
        if (old) {
          const payments = DB.getPaymentsByLoan(loan.loan_id)
            .filter(p => p.installment_id_pay === old.id)
            .sort((a,b) => String(a.payment_date || '').localeCompare(String(b.payment_date || '')) || String(a.id || '').localeCompare(String(b.id || '')));

          // Primeiro aplica a nova estrutura/data no mesmo registro da parcela.
          DB.updateInstallment(old.id, {
            ...basePatch,
            paid_principal: 0,
            paid_period_interest: 0,
            paid_extra_interest: 0,
            paid_penalty: 0,
            total_paid_principal: 0,
            total_paid_period_interest: 0,
            total_paid_extra_interest: 0,
            total_paid_penalty: 0,
            total_penalty_discount: 0,
            last_payment_date: '',
            status_inst: 'pendente',
            status_antecipacao: '',
            antecipacao_valor_recebido: 0,
            antecipacao_desconto: 0,
            antecipacao_baixa_total: 0,
            antecipacao_data: '',
            recalculated_after_loan_edit_at: nowIso
          });

          const updatedBase = DB.getInstallmentById(old.id);
          if (payments.length > 0) {
            const rebuilt = isProportional
              ? Finance.rebuildInstallmentFromPayments(updatedBase, payments)
              : updatedBase;
            DB.updateInstallment(old.id, rebuilt);
          } else {
            const det = Finance.calcInstallmentDetails(updatedBase, Utils.today());
            DB.updateInstallment(old.id, { status_inst: det.totalDue <= 0.009 ? 'pago' : 'pendente' });
          }
        } else {
          DB.addInstallment({
            id: Utils.uid(), type: 'installment', installment_id: Utils.uid(), ...basePatch,
            paid_principal: 0, paid_period_interest: 0, paid_extra_interest: 0, paid_penalty: 0,
            total_paid_principal: 0, total_paid_period_interest: 0, total_paid_extra_interest: 0, total_paid_penalty: 0,
            total_penalty_discount: 0, last_payment_date: '', status_inst: 'pendente', created_by_loan_edit_at: nowIso
          });
        }
      }

      existing.filter(item => Number(item.number || 0) > count).forEach(item => {
        const hasPayments = DB.getPaymentsByLoan(loan.loan_id).some(p => p.installment_id_pay === item.id);
        if (hasPayments) {
          DB.updateInstallment(item.id, { principal: 0, interest: 0, installment_amount: 0, status_inst: 'pago', removed_by_loan_edit: true, edited_at: nowIso });
        } else {
          DB.deleteInstallment(item.id);
        }
      });

      // Para parcelados, depois de redesenhar a tabela e datas, reaplica pagamentos/antecipações.
      if (!isProportional) {
        Finance.rebuildNonProportionalLoanFromPayments(loan.loan_id);
      }

      const allInst = DB.getInstallmentsByLoan(loan.loan_id);
      const allPaid = allInst.length > 0 && allInst.every(i => i.status_inst === 'pago');
      DB.updateLoan(loan.id, { status_loan: allPaid ? 'quitado' : 'ativo', last_loan_edit_recalc_at: nowIso });
    };

    /* =====================================================
       V16 - SALDO CORRIDO VISÍVEL PARA O CLIENTE
       - No portal do cliente, mostra vencimento do ciclo, capital usado nos juros,
         juros atual, juros previsto até o vencimento, total previsto no vencimento
         e total atualizado hoje.
       - Na mensagem de cobrança do saldo corrido, separa juros no vencimento,
         juros atual, capital contabilizado e multa.
       ===================================================== */
    function mvProportionalProjection(loan, inst) {
      const today = Utils.today();
      const dueDate = inst?.due_date || today;
      const detToday = Finance.calcInstallmentDetails(inst, today);
      const detAtDue = Finance.calcInstallmentDetails(inst, dueDate);
      const client = loan ? DB.getClientById(loan.client_id) : null;
      const dailyRate = Number(loan?.daily_rate_used ?? loan?.late_daily_rate ?? Finance.getLateDailyRate(client));
      const interestStart = detToday.interestStartDate || inst?.interest_start_date || loan?.date || dueDate;
      const daysUntilDue = Math.max(0, Utils.daysDiff(dueDate, today));
      const daysFromStartToDue = Math.max(0, Utils.daysDiff(dueDate, interestStart));
      const jurosHoje = Finance.round2(Number(detToday.totalInterestPending || 0));
      const jurosNoVencimento = Finance.round2(Number(detAtDue.totalInterestPending || 0));
      const jurosFuturoAteVencimento = Finance.round2(Math.max(0, jurosNoVencimento - jurosHoje));
      const capital = Finance.round2(Number(detToday.principal || 0));
      const multaHoje = Finance.round2(Number(detToday.accumulatedPenalty || 0));
      const totalAteVencimento = Finance.round2(capital + jurosNoVencimento);
      const totalAtualizadoHoje = Finance.round2(Number(detToday.totalDue || 0));
      return { today, dueDate, interestStart, dailyRate, daysUntilDue, daysFromStartToDue, capital, jurosHoje, jurosNoVencimento, jurosFuturoAteVencimento, multaHoje, totalAteVencimento, totalAtualizadoHoje, detToday, detAtDue };
    }

      return `<div class="card p-3 mb-3 border-gold-500/20 bg-gold-500/5">

          <div class="stat-card"><p class="text-xs text-slate-400">Juros atual</p><p class="font-bold text-yellow-400">${Utils.fmtMoney(p.jurosHoje)}</p></div>
          <div class="stat-card"><p class="text-xs text-slate-400">Juros até vencimento</p><p class="font-bold text-yellow-300">${Utils.fmtMoney(p.jurosNoVencimento)}</p></div>

    /* =====================================================
       V19 - COBRANÇA ÚNICA + PAGAMENTO AVULSO CORRIGIDO
       - Uma única leitura alimenta painel e mensagem de cobrança.
       - Parcelado separa: valor da parcela, multa e total.
       - Saldo corrido mantém capital, juros atual, juros no vencimento e total.
       - Avulso baixa juros primeiro; excedente baixa capital/principal.

    function mvV19ChargeBreakdown(loan, inst, referenceDate = Utils.today()) {
      if (!loan || !inst) return null;
      const det = Finance.calcInstallmentDetails(inst, referenceDate);
      if (Finance.isProportionalLoan(loan)) {
        const p = mvProportionalProjection(loan, inst);
        return { kind:'corrido', det, projection:p, dueDate: inst.due_date, daysLate: Number(det.daysLate || 0), capital: Number(p.capital || 0), jurosAtual: Number(p.jurosHoje || 0), jurosNoVencimento: Number(p.jurosNoVencimento || 0), jurosFuturo: Number(p.jurosFuturoAteVencimento || 0), multa: Number(p.multaHoje || 0), totalHoje: Number(p.totalAtualizadoHoje || 0), totalVencimento: Number(p.totalAteVencimento || 0) };
      }
      const valorParcelaAberta = mvRoundMoney(Number(det.principal || 0) + Number(det.totalInterestPending || 0));
      const multa = mvRoundMoney(Number(det.accumulatedPenalty || 0));
      return { kind:'parcelado', det, dueDate: inst.due_date, number: inst.number, daysLate: Number(det.daysLate || 0), valorOriginalParcela: Number(inst.installment_amount || 0), valorParcelaAberta, principalAberto: Number(det.principal || 0), jurosAberto: Number(det.totalInterestPending || 0), multa, total: mvRoundMoney(valorParcelaAberta + multa) };
    }
