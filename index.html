<body class="h-full overflow-auto">
  <div id="app" class="h-full w-full"></div>
  <div id="toast-container" class="toast"></div>

  <script>
    // =========================
    // ESTADO
    // =========================
    let currentScreen = 'home';
    let adminLoggedIn = false;
    let clientLoggedIn = null;
    let investorLoggedIn = null;
    let adminTab = 'clients';
    let editingClient = null;
    let editingLoan = null;
    let viewingClient = null;
    let viewingLoan = null;
    let editingInvestor = null;
    let editingInvestorAporte = null;
    let viewingInvestor = null;
    let confirmAction = null;
    let activeModal = null;
    let expandedLoanFolders = {};
    let healthStartDate = '';
    let healthEndDate = '';
    let clientSearchQuery = '';
    let loanSearchQuery = '';
    let clientPortalSelectedLoan = '';
    let mvSearchTimers = {};

    const STORAGE_KEY = 'mv_financeira_local_v1';

    const defaultDB = {
      clients: [],
      loans: [],
      installments: [],
      payments: [],
      investors: [],
      investor_aportes: [],
      investor_payments: [],
      configs: {
        business_name: 'MV Financeira',
        pix_key: '',
        level1_daily_rate: '0.50',
        level2_daily_rate: '0.35',
        level3_daily_rate: '0.20',
        default_rate_daily: '0.50',
        default_rate_weekly: '3.50',
        default_rate_biweekly: '7.50',
        default_rate_monthly: '15.00',
        default_penalty_daily_rate: '1.00',
        admin_password: '@1997#'
      }
    };

    function loadDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(defaultDB));
        const parsed = JSON.parse(raw);
        const configs = { ...defaultDB.configs, ...(parsed.configs || {}) };
        if (configs.admin_password === '1234') configs.admin_password = '@1997#';

        if (!configs.default_rate_daily && configs.default_rate) {
          configs.default_rate_daily = String(configs.default_rate);
        }
        if (!configs.level1_daily_rate) configs.level1_daily_rate = '0.50';
        if (!configs.level2_daily_rate) configs.level2_daily_rate = '0.35';
        if (!configs.level3_daily_rate) configs.level3_daily_rate = '0.20';
        if (!configs.default_rate_weekly) configs.default_rate_weekly = '3.50';
        if (!configs.default_rate_biweekly) configs.default_rate_biweekly = '7.50';
        if (!configs.default_rate_monthly) configs.default_rate_monthly = '15.00';
        if (!configs.default_penalty_daily_rate) configs.default_penalty_daily_rate = '1.00';

        const clients = (parsed.clients || []).map(client => {
          const baseDaily = Number(client.rate_daily ?? client.daily_rate ?? configs.default_rate_daily ?? 0.33);
          return {
            ...client,
            level: String(client.level || '1'),
            custom_daily_rate: Number(client.custom_daily_rate ?? client.rate_daily ?? client.daily_rate ?? baseDaily),
            rate_daily: Number(client.rate_daily ?? client.daily_rate ?? baseDaily),
            rate_weekly: Number(client.rate_weekly ?? configs.default_rate_weekly ?? 3.5),
            rate_biweekly: Number(client.rate_biweekly ?? configs.default_rate_biweekly ?? 7.5),
            rate_monthly: Number(client.rate_monthly ?? configs.default_rate_monthly ?? 15),
            late_daily_rate: Number(client.late_daily_rate ?? client.rate_daily ?? client.daily_rate ?? baseDaily)
          };
        });

        return {
          clients,
          loans: parsed.loans || [],
          installments: parsed.installments || [],
          payments: parsed.payments || [],
          investors: parsed.investors || [],
          investor_aportes: parsed.investor_aportes || [],
          investor_payments: parsed.investor_payments || [],
          configs
        };
      } catch {
        return JSON.parse(JSON.stringify(defaultDB));
      }
    }

    let db = loadDB();


    function migratePenaltyDiscountsV7() {
      try {
        db.configs = db.configs || {};
        if (db.configs.penalty_discount_fix_v8 === '1') return;

        // Correção v8:
        // Desconto de multa NÃO é pagamento e NÃO pode ficar dentro de paid_penalty.
        // paid_penalty precisa guardar somente dinheiro pago em multa.
        // O desconto fica apenas no histórico do pagamento e no total_penalty_discount para exibição.
        // Assim, em empréstimo recorrente/saldo corrido, desconto de mês anterior não reduz multa do mês atual.
        (db.installments || []).forEach(inst => {
          const discountPayments = (db.payments || []).filter(p => p.installment_id_pay === inst.id && Number(p.penalty_discount_value || 0) > 0);
          if (!discountPayments.length) return;
          const totalDiscount = Finance.round2(discountPayments.reduce((sum, p) => sum + Number(p.penalty_discount_value || 0), 0));
          inst.total_penalty_discount = Finance.round2(Math.max(Number(inst.total_penalty_discount || 0), totalDiscount));

          // Desfaz migração antiga que somou desconto em paid_penalty.
          const alreadyRemoved = Number(inst.penalty_discount_removed_from_paid_v8 || 0);
          const toRemove = Finance.round2(Math.max(0, totalDiscount - alreadyRemoved));
          if (toRemove > 0) {
            inst.paid_penalty = Finance.round2(Math.max(0, Number(inst.paid_penalty || 0) - toRemove));
            inst.penalty_discount_removed_from_paid_v8 = Finance.round2(alreadyRemoved + toRemove);
          }
        });

        db.configs.penalty_discount_fix_v8 = '1';
        persistDB();
      } catch (e) {
        console.warn('Migração de desconto de multa não aplicada:', e);
      }
    }

    function persistDB() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      scheduleCloudSave();
    }

    let cloudSaving = false;
    let cloudSaveQueued = false;
    let cloudSaveTimer = null;
    let cloudReady = false;

    function cloneDBForCloud() {
      return JSON.parse(JSON.stringify({
        clients: db.clients || [],
        loans: db.loans || [],
        installments: db.installments || [],
        payments: db.payments || [],
        investors: db.investors || [],
        investor_aportes: db.investor_aportes || [],
        investor_payments: db.investor_payments || [],
        configs: db.configs || {}
      }));
    }

    function scheduleCloudSave() {
      if (!window.mvCloud?.enabled) return;
      clearTimeout(cloudSaveTimer);
      cloudSaveTimer = setTimeout(() => saveCloudDB(), 180);
    }

    async function loadCloudDB() {
      if (!window.mvCloud?.enabled) return;
      try {
        const snap = await window.mvCloud.docRef.get();
        if (snap.exists) {
          const cloud = snap.data() || {};
          db = {
            clients: cloud.clients || [],
            loans: cloud.loans || [],
            installments: cloud.installments || [],
            payments: cloud.payments || [],
            investors: cloud.investors || [],
            investor_aportes: cloud.investor_aportes || [],
            investor_payments: cloud.investor_payments || [],
            configs: { ...defaultDB.configs, ...(cloud.configs || {}) }
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        } else {
          await window.mvCloud.docRef.set({
            ...db,
            updated_at: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
        cloudReady = true;
      } catch (error) {
        console.error('Erro ao carregar Firebase:', error);
        Utils.toast('Sem conexão com Firebase. Usando dados locais.', 'error');
      }
    }

    async function saveCloudDB() {
      if (!window.mvCloud?.enabled) return;
      if (cloudSaving) { cloudSaveQueued = true; return; }
      try {
        cloudSaving = true;
        cloudSaveQueued = false;
        const payload = cloneDBForCloud();
        await window.mvCloud.docRef.set({
          ...payload,
          updated_at: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (error) {
        console.error('Erro ao salvar Firebase:', error);
        Utils.toast('Erro ao salvar online. Confira regras do Firestore.', 'error');
      } finally {
        cloudSaving = false;
        if (cloudSaveQueued) {
          cloudSaveQueued = false;
          setTimeout(() => saveCloudDB(), 80);
        }
      }
    }

    const Utils = {
      fmtMoney: (v) => 'R$ ' + (Number(v)||0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.'),
      fmtDate: (d) => !d ? '-' : d.split('-').length === 3 ? `${d.split('-')[2]}/${d.split('-')[1]}/${d.split('-')[0]}` : d,
      today: () => new Date().toISOString().split('T')[0],
      daysDiff: (d1, d2) => Math.floor((new Date(d1 + 'T12:00:00') - new Date(d2 + 'T12:00:00')) / 86400000),
      uid: () => Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      toast: (msg, type='info') => {
        const t = document.getElementById('toast-container');
        if (!t) return;
        clearTimeout(window.mvToastTimer);
        clearTimeout(window.mvToastCleanupTimer);
        t.textContent = msg;
        t.className = 'toast';
        t.style.display = 'block';
        t.style.borderColor = type === 'error' ? 'rgba(239, 68, 68, 0.4)' : type === 'success' ? 'rgba(34, 197, 94, 0.4)' : 'rgba(212, 160, 23, 0.4)';
        requestAnimationFrame(() => t.classList.add('show'));
        window.mvToastTimer = setTimeout(() => {
          t.classList.remove('show');
          window.mvToastCleanupTimer = setTimeout(() => {
            t.textContent = '';
            t.style.display = 'none';
          }, 420);
        }, 2200);
      },
      validateEmail: (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || email === '',
      validateCPF: (cpf) => cpf.replace(/\D/g, '').length >= 11,
      clearStates: () => {
        editingClient = null;
        editingLoan = null;
        viewingClient = null;
        viewingLoan = null;
        editingInvestor = null;
        editingInvestorAporte = null;
        viewingInvestor = null;
        confirmAction = null;
        activeModal = null;
      }
    };

    function mvNormalizeText(text) {
      return String(text || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }
    function mvEscapeHtml(text) {
      return String(text ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    function mvEscapeJs(text) {
      return String(text ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n').replace(/\r/g, '');
    }
    function mvDebouncedRender(key, delay = 220) {
      clearTimeout(mvSearchTimers[key]);
      mvSearchTimers[key] = setTimeout(() => render(), delay);
    }
    function mvGetLoanSummary(loan, referenceDate = Utils.today()) {
      Finance.ensureInstallmentsForLoan(loan);
      const installments = DB.getInstallmentsByLoan(loan.loan_id);
      let totalDue = 0, principalOpen = 0, interestOpen = 0, penaltyOpen = 0, overdueCount = 0, overdueAmount = 0;
      installments.forEach(inst => {
        const det = Finance.calcInstallmentDetails(inst, referenceDate);
        const isPaid = inst.status_inst === 'pago';
        const isOverdue = !isPaid && det.daysLate > 0;
        totalDue += Number(det.totalDue || 0);
        principalOpen += Number(det.principal || 0);
        interestOpen += Number(det.totalInterestPending || 0);
        penaltyOpen += Number(det.accumulatedPenalty || 0);
        if (isOverdue) { overdueCount++; overdueAmount += Number(det.totalDue || 0); }
      });
      const pendingCount = installments.filter(i => i.status_inst !== 'pago').length;
      const nextPending = installments.find(i => i.status_inst !== 'pago') || null;
      return { installments, totalDue, principalOpen, interestOpen, penaltyOpen, overdueCount, overdueAmount, pendingCount, nextPending };
    }
    function mvOpenInstallmentCharge(instId) {
      const inst = DB.getInstallmentById(instId);
      if (!inst) return Utils.toast('Parcela não encontrada', 'error');
      activeModal = { type:'message', loanKey: inst.loan_id_inst, instId };
      render();
    }
    function mvBuildChargeMessage(loan, installment = null) {
      const client = DB.getClientById(loan.client_id);
      const pix = DB.getConfig('pix_key', 'Não configurado');
      const bizName = DB.getConfig('business_name', 'MV Financeira');
      const calcLabel = Finance.isProportionalLoan(loan) ? 'Saldo corrido proporcional' : (loan.calculation_mode === 'parcela_fixa' ? 'Parcela fixa' : 'Tabela Price');
      if (installment) {
        const det = Finance.calcInstallmentDetails(installment, Utils.today());
        const verbo = det.daysLate > 0 ? 'venceu em' : 'vence em';
        const atraso = det.daysLate > 0 ? `
⚠️ Esta parcela está em atraso.` : '';
        return `Olá, ${client?.name || 'cliente'}!

Sua parcela #${installment.number}, no valor de ${Utils.fmtMoney(det.totalDue)}, ${verbo} ${Utils.fmtDate(installment.due_date)}.${atraso}

💰 FORMA DE PAGAMENTO
PIX: ${pix}

Após o pagamento, envie o comprovante para baixa no sistema.

Atenciosamente,
${bizName}`;
      }
      const summary = mvGetLoanSummary(loan);
      const next = summary.nextPending;
      const nextText = next ? (() => {
        const nextDet = Finance.calcInstallmentDetails(next);
        const verbo = nextDet.daysLate > 0 ? 'venceu em' : 'vence em';
        return `

Próxima cobrança:
Sua parcela #${next.number}, no valor de ${Utils.fmtMoney(nextDet.totalDue)}, ${verbo} ${Utils.fmtDate(next.due_date)}.`;
      })() : '';
      const atrasoText = summary.overdueCount > 0 ? `
⚠️ Parcelas em atraso: ${summary.overdueCount}
Valor em atraso: ${Utils.fmtMoney(summary.overdueAmount)}` : '';
      return `Olá, ${client?.name || 'cliente'}!

Segue o resumo atualizado do seu contrato com a ${bizName}.

🏦 CONTRATO
Tipo: ${calcLabel}
Valor contratado: ${Utils.fmtMoney(loan.amount)}
Valor devido atual: ${Utils.fmtMoney(summary.totalDue)}
Principal em aberto: ${Utils.fmtMoney(summary.principalOpen)}
Juros em aberto: ${Utils.fmtMoney(summary.interestOpen)}
Multa em aberto: ${Utils.fmtMoney(summary.penaltyOpen)}${atrasoText}${nextText}

💰 FORMA DE PAGAMENTO
PIX: ${pix}

Após pagar, envie o comprovante para baixa no sistema.

Atenciosamente,
${bizName}`;
    }

    function mvRecalculateInstallmentsForEditedLoan(loan, calc, dates) {
      const existing = DB.getInstallmentsByLoan(loan.loan_id).sort((a,b) => Number(a.number || 0) - Number(b.number || 0));
      const existingByNumber = {};
      existing.forEach(item => { existingByNumber[Number(item.number || 0)] = item; });
      const count = Math.max(1, Number(loan.num_installments || 1));
      const nowIso = new Date().toISOString();
      for (let i = 0; i < count; i++) {
        const row = calc.schedule?.[i] || { installmentAmount: loan.amount, principal: loan.amount, interest: 0, startBalance: loan.amount, endBalance: 0 };
        const basePatch = {
          loan_id_inst: loan.loan_id,
          number: i + 1,
          due_date: dates[i],
          installment_amount: Finance.round2(row.installmentAmount),
          principal: Finance.round2(row.principal),
          interest: Finance.round2(row.interest),
          start_balance: Finance.round2(row.startBalance),
          end_balance: Finance.round2(row.endBalance),
          original_principal_before_discount: Finance.round2(row.principal),
          original_interest_before_discount: Finance.round2(row.interest),
          original_installment_amount_before_discount: Finance.round2(row.installmentAmount),
          edited_at: nowIso
        };
        const old = existingByNumber[i + 1];
        if (old) {
          const testInst = { ...old, ...basePatch };
          const det = Finance.calcInstallmentDetails(testInst);
          DB.updateInstallment(old.id, { ...basePatch, status_inst: det.totalDue <= 0.009 ? 'pago' : 'pendente' });
        } else {
          DB.addInstallment({
            id: Utils.uid(), type: 'installment', installment_id: Utils.uid(), ...basePatch,
            paid_principal: 0, paid_period_interest: 0, paid_extra_interest: 0, paid_penalty: 0,
            total_paid_principal: 0, total_paid_period_interest: 0, total_paid_extra_interest: 0, total_paid_penalty: 0,
            total_penalty_discount: 0, last_payment_date: '', status_inst: 'pendente'
          });
        }
      }
      existing.filter(item => Number(item.number || 0) > count).forEach(item => {
        const hasPayments = DB.getPaymentsByLoan(loan.loan_id).some(p => p.installment_id_pay === item.id);
        if (hasPayments) {
          DB.updateInstallment(item.id, { principal: 0, interest: 0, installment_amount: 0, status_inst: 'pago', removed_by_loan_edit: true, edited_at: nowIso });
        } else {
          DB.deleteInstallment(item.id);
        }
      });
    }

    const DB = {
      getConfig: (key, def='') => db.configs?.[key] ?? def,
      setConfig: (key, val) => { db.configs[key] = val; persistDB(); },
      getClients: () => db.clients,
      getLoans: () => db.loans,
      getInstallments: () => db.installments,
      getPayments: () => db.payments,
      getInvestors: () => db.investors || [],
      getInvestorById: (id) => (db.investors || []).find(inv => inv.id === id),
      getAportesByInvestor: (investorId) => (db.investor_aportes || []).filter(a => a.investor_id === investorId).sort((a,b) => new Date(a.date) - new Date(b.date)),
      getInvestorPayments: (investorId) => (db.investor_payments || []).filter(p => p.investor_id === investorId).sort((a,b) => new Date(b.date) - new Date(a.date)),
      getInvestorPaymentById: (id) => (db.investor_payments || []).find(p => p.id === id),
      getInvestorAporteById: (id) => (db.investor_aportes || []).find(a => a.id === id),
      getClientById: (id) => db.clients.find(c => c.id === id),
      getLoanById: (id) => db.loans.find(l => l.id === id),
      getLoanByKey: (loanKey) => db.loans.find(l => l.loan_id === loanKey),
      getInstallmentById: (id) => db.installments.find(i => i.id === id),
      getPaymentById: (id) => db.payments.find(p => p.id === id),
      getLoansByClient: (clientId) => db.loans.filter(l => l.client_id === clientId),
      getInstallmentsByLoan: (loanId) => db.installments.filter(i => i.loan_id_inst === loanId).sort((a,b) => a.number - b.number),
      getPaymentsByLoan: (loanId) => db.payments.filter(p => p.loan_id_pay === loanId).sort((a,b) => new Date(b.payment_date) - new Date(a.payment_date)),
      addClient: (data) => { db.clients.push(data); persistDB(); },
      updateClient: (id, patch) => { const i = db.clients.findIndex(c => c.id === id); if (i >= 0) { db.clients[i] = { ...db.clients[i], ...patch }; persistDB(); } },
      deleteClient: (id) => { db.clients = db.clients.filter(c => c.id !== id); persistDB(); },
      addLoan: (data) => { db.loans.push(data); persistDB(); },
      updateLoan: (id, patch) => { const i = db.loans.findIndex(l => l.id === id); if (i >= 0) { db.loans[i] = { ...db.loans[i], ...patch }; persistDB(); } },
      deleteLoan: (id) => { db.loans = db.loans.filter(l => l.id !== id); persistDB(); },
      addInstallment: (data) => { db.installments.push(data); persistDB(); },
      updateInstallment: (id, patch) => { const i = db.installments.findIndex(ins => ins.id === id); if (i >= 0) { db.installments[i] = { ...db.installments[i], ...patch }; persistDB(); } },
      deleteInstallment: (id) => { db.installments = db.installments.filter(i => i.id !== id); persistDB(); },
      addPayment: (data) => { db.payments.push(data); persistDB(); },
      updatePayment: (id, patch) => { const i = db.payments.findIndex(p => p.id === id); if (i >= 0) { db.payments[i] = { ...db.payments[i], ...patch }; persistDB(); } },
      addLoanWithInstallments: (loanData, installmentList) => {
        db.loans.push(loanData);
        installmentList.forEach(item => db.installments.push(item));
        persistDB();
      },
      deletePayment: (id) => { db.payments = db.payments.filter(p => p.id !== id); persistDB(); },
      addInvestor: (data) => { db.investors = db.investors || []; db.investors.push(data); persistDB(); },
      updateInvestor: (id, patch) => { db.investors = db.investors || []; const i = db.investors.findIndex(inv => inv.id === id); if (i >= 0) { db.investors[i] = { ...db.investors[i], ...patch }; persistDB(); } },
      deleteInvestor: (id) => { db.investors = (db.investors || []).filter(inv => inv.id !== id); db.investor_aportes = (db.investor_aportes || []).filter(a => a.investor_id !== id); db.investor_payments = (db.investor_payments || []).filter(p => p.investor_id !== id); persistDB(); },
      addInvestorAporte: (data) => { db.investor_aportes = db.investor_aportes || []; db.investor_aportes.push(data); persistDB(); },
      updateInvestorAporte: (id, patch) => { db.investor_aportes = db.investor_aportes || []; const i = db.investor_aportes.findIndex(a => a.id === id); if (i >= 0) { db.investor_aportes[i] = { ...db.investor_aportes[i], ...patch }; persistDB(); } },
      deleteInvestorAporte: (id) => { db.investor_aportes = (db.investor_aportes || []).filter(a => a.id !== id); persistDB(); },
      addInvestorPayment: (data) => { db.investor_payments = db.investor_payments || []; db.investor_payments.push(data); persistDB(); },
      deleteInvestorPayment: (id) => { db.investor_payments = (db.investor_payments || []).filter(p => p.id !== id); persistDB(); },
      resetAll: () => { db = JSON.parse(JSON.stringify(defaultDB)); persistDB(); }
    };

    const Finance = {
      getLevelDailyRate: (client) => {
        const level = String(client?.level || '1');
        if (level === '1') return Number(DB.getConfig('level1_daily_rate', '0.50'));
        if (level === '2') return Number(DB.getConfig('level2_daily_rate', '0.35'));
        if (level === '3') return Number(DB.getConfig('level3_daily_rate', '0.20'));
        return Number(client?.custom_daily_rate ?? client?.rate_daily ?? DB.getConfig('default_rate_daily', '0.50'));
      },
      convertDailyRateToPeriod: (dailyRate, frequency) => {
        const multiplier = { diario:1, semanal:7, quinzenal:15, mensal:30 }[frequency] || 30;
        return Number(dailyRate || 0) * multiplier;
      },
      getPeriodRate: (client, frequency) => {
        const daily = Finance.getLevelDailyRate(client);
        return Finance.convertDailyRateToPeriod(daily, frequency);
      },
      getLateDailyRate: (client) => Finance.getLevelDailyRate(client),
      daysBetweenDates: (startDate, endDate) => {
        if (!startDate || !endDate) return 0;
        return Math.max(0, Math.floor((new Date(endDate + 'T12:00:00') - new Date(startDate + 'T12:00:00')) / 86400000));
      },
      calcFutureInterest: (principal, dailyRate, startDate, endDate) => {
        const days = Finance.daysBetweenDates(startDate, endDate);
        return Math.max(0, Number(principal || 0) * (Number(dailyRate || 0) / 100) * days);
      },
      getPaidTotal: (inst, key) => {
        const map = {
          principal: ['total_paid_principal', 'paid_principal'],
          periodInterest: ['total_paid_period_interest', 'paid_period_interest'],
          extraInterest: ['total_paid_extra_interest', 'paid_extra_interest'],
          penalty: ['total_paid_penalty', 'paid_penalty']
        };
        const [totalKey, currentKey] = map[key] || [];
        return Number((totalKey && inst?.[totalKey] != null) ? inst[totalKey] : (currentKey ? inst?.[currentKey] : 0)) || 0;
      },
      getScheduledDueDate: (loan, installmentNumber, fallbackDate = '') => {
        if (!loan?.first_due) return fallbackDate || Utils.today();
        const freqDays = { diario:1, semanal:7, quinzenal:15, mensal:30 };
        const days = freqDays[loan.frequency] || 30;
        const d = new Date(loan.first_due + 'T12:00:00');
        d.setDate(d.getDate() + (Number(installmentNumber || 1) - 1) * days);
        return d.toISOString().split('T')[0];
      },
      getAutomaticNextDueDate: (loan, paymentDate) => {
        const freqDays = { diario:1, semanal:7, quinzenal:15, mensal:30 };
        const days = freqDays[loan?.frequency] || 30;
        const d = new Date((paymentDate || Utils.today()) + 'T12:00:00');
        d.setDate(d.getDate() + days);
        return d.toISOString().split('T')[0];
      },
      isProportionalLoan: (loan) => String(loan?.calculation_mode || 'price') === 'proporcional',
      isFixedInstallmentLoan: (loan) => String(loan?.calculation_mode || 'price') === 'parcela_fixa',
      round2: (v) => Math.round((Number(v) || 0) * 100) / 100,
      solveRateFromFixedPayment: (amount, fixedPayment, numInstallments) => {
        const principal = Number(amount || 0);
        const payment = Number(fixedPayment || 0);
        const n = Math.max(1, Number(numInstallments || 1));
        if (principal <= 0 || payment <= 0) return null;
        const minPayment = principal / n;
        if (payment < minPayment - 0.005) return null;
        if (Math.abs(payment - minPayment) <= 0.005) return 0;
        let low = 0;
        let high = 1;
        const pricePayment = (rate) => {
          if (rate <= 0) return minPayment;
          const factor = Math.pow(1 + rate, n);
          return principal * (rate * factor) / (factor - 1);
        };
        while (pricePayment(high) < payment && high < 10) high *= 2;
        for (let k = 0; k < 80; k++) {
          const mid = (low + high) / 2;
          if (pricePayment(mid) < payment) low = mid; else high = mid;
        }
        return (low + high) / 2;
      },
      calcFixedPaymentSchedule: (amount, fixedPayment, numInstallments) => {
        const principal = Number(amount || 0);
        const payment = Number(fixedPayment || 0);
        const n = Math.max(1, Number(numInstallments || 1));
        const rateDecimal = Finance.solveRateFromFixedPayment(principal, payment, n);
        if (rateDecimal === null) return null;
        const schedule = [];
        let balance = principal;
        for (let k = 1; k <= n; k++) {
          const interest = balance * rateDecimal;
          let amortization = payment - interest;
          if (k === n) amortization = balance;
          if (amortization < 0) amortization = 0;
          const installment = k === n ? interest + amortization : payment;
          const startBalance = balance;
          balance = Math.max(0, balance - amortization);
          schedule.push({ number:k, startBalance, interest, principal:amortization, installmentAmount:installment, endBalance:balance });
        }
        return { basePrincipal: principal / n, periodInterest: schedule[0]?.interest || 0, installmentAmount: payment, daysInPeriod: 0, total: schedule.reduce((sum, row) => sum + row.installmentAmount, 0), schedule, periodRate: rateDecimal * 100 };
      },
      applyOverpaymentToLastInstallments: (loanKey, currentInstId, extraAmount) => {
        let remaining = Finance.round2(extraAmount);
        if (!loanKey || remaining <= 0) return 0;
        const installments = DB.getInstallmentsByLoan(loanKey)
          .filter(i => i.id !== currentInstId && i.status_inst !== 'pago')
          .sort((a,b) => Number(b.number || 0) - Number(a.number || 0));
        let applied = 0;
        installments.forEach(inst => {
          if (remaining <= 0) return;
          const det = Finance.calcInstallmentDetails(inst);
          const openTotal = Finance.round2(det.principal + det.totalInterestPending + det.accumulatedPenalty);
          if (openTotal <= 0) return;
          const discount = Math.min(openTotal, remaining);
          let rest = discount;
          let newPrincipal = Number(inst.principal || 0);
          let newInterest = Number(inst.interest || 0);
          let newPenaltyPaid = Number(inst.paid_penalty || 0);
          const reducePrincipal = Math.min(newPrincipal, rest);
          newPrincipal = Finance.round2(newPrincipal - reducePrincipal);
          rest = Finance.round2(rest - reducePrincipal);
          if (rest > 0) {
            const reduceInterest = Math.min(newInterest, rest);
            newInterest = Finance.round2(newInterest - reduceInterest);
            rest = Finance.round2(rest - reduceInterest);
          }
          if (rest > 0) {
            newPenaltyPaid = Finance.round2(newPenaltyPaid + rest);
            rest = 0;
          }
          const newAmount = Finance.round2(newPrincipal + newInterest);
          DB.updateInstallment(inst.id, {
            principal: newPrincipal,
            interest: newInterest,
            installment_amount: newAmount,
            paid_penalty: newPenaltyPaid,
            discount_applied: Finance.round2(Number(inst.discount_applied || 0) + discount),
            original_principal_before_discount: Number(inst.original_principal_before_discount ?? inst.principal ?? 0),
            original_interest_before_discount: Number(inst.original_interest_before_discount ?? inst.interest ?? 0),
            original_installment_amount_before_discount: Number(inst.original_installment_amount_before_discount ?? inst.installment_amount ?? 0),
            status_inst: newAmount <= 0.009 ? 'pago' : inst.status_inst
          });
          remaining = Finance.round2(remaining - discount);
          applied = Finance.round2(applied + discount);
        });
        return applied;
      },

      getOpenFutureInstallmentValue: (inst, referenceDate = null) => {
        const det = Finance.calcInstallmentDetails(inst, referenceDate || Utils.today());
        return Finance.round2(Number(det.principal || 0) + Number(det.totalInterestPending || 0) + Number(det.accumulatedPenalty || 0));
      },

      getPresentValueForInstallment: (loan, inst, paymentDate) => {
        const payDate = paymentDate || Utils.today();
        const det = Finance.calcInstallmentDetails(inst, payDate);
        const futureValue = Finance.round2(Number(det.totalDue || 0));
        const daysAhead = Math.max(0, Utils.daysDiff(inst.due_date, payDate));
        const dailyRateDecimal = Math.max(0, Number(loan?.daily_rate_used ?? loan?.late_daily_rate ?? 0) / 100);
        if (daysAhead <= 0 || dailyRateDecimal <= 0) {
          return { futureValue, presentValue: futureValue, discount: 0, daysAhead, det, isFuture: daysAhead > 0 };
        }
        const factor = Math.pow(1 + dailyRateDecimal, daysAhead);
        const discountedPresentValue = Finance.round2(futureValue / factor);
        // O desconto de antecipação nunca pode reduzir o capital em aberto.
        // Ele só pode retirar juros/encargos futuros. Ex.: emprestou R$ 1.500 hoje,
        // a quitação no mesmo dia não pode ficar abaixo de R$ 1.500.
        const principalFloor = Finance.round2(Math.max(0, Number(det.principal || 0) + Number(det.accumulatedPenalty || 0)));
        const presentValue = Finance.round2(Math.min(futureValue, Math.max(discountedPresentValue, principalFloor)));
        return {
          futureValue,
          presentValue,
          discount: Math.max(0, Finance.round2(futureValue - presentValue)),
          daysAhead,
          det,
          isFuture: true,
          principalFloor
        };
      },
      simulateInstallmentPayoff: (loanKey, paymentDate = null) => {
        const loan = DB.getLoanByKey(loanKey);
        if (!loan || Finance.isProportionalLoan(loan)) return { ok:false, totalHoje:0, totalContrato:0, descontoTotal:0, parcelas:[] };
        const payDate = paymentDate || Utils.today();
        const parcelas = DB.getInstallmentsByLoan(loanKey)
          .filter(inst => inst.status_inst !== 'pago')
          .sort((a,b) => Number(a.number || 0) - Number(b.number || 0))
          .map(inst => {
            const pv = Finance.getPresentValueForInstallment(loan, inst, payDate);
            return {
              installmentId: inst.id,
              numeroParcela: inst.number,
              dataVencimento: inst.due_date,
              diasAntecipados: pv.daysAhead,
              valorOriginalParcela: Finance.round2(pv.futureValue),
              valorParaQuitarHoje: Finance.round2(pv.presentValue),
              descontoAplicado: Finance.round2(pv.discount),
              tipo: pv.isFuture ? 'futura_com_desconto' : 'vencida_ou_atual',
              statusAnterior: inst.status_inst || 'pendente'
            };
          });
        const totalHoje = Finance.round2(parcelas.reduce((s, x) => s + Number(x.valorParaQuitarHoje || 0), 0));
        const totalContrato = Finance.round2(parcelas.reduce((s, x) => s + Number(x.valorOriginalParcela || 0), 0));
        const descontoTotal = Finance.round2(parcelas.reduce((s, x) => s + Number(x.descontoAplicado || 0), 0));
        return { ok:true, totalHoje, totalContrato, descontoTotal, parcelas, quantidadeParcelas: parcelas.length };
      },
      simulateAnticipationByAmount: (loanKey, amountPaid, paymentDate = null) => {
        const loan = DB.getLoanByKey(loanKey);
        if (!loan || Finance.isProportionalLoan(loan)) return { ok:false, valorDigitado:Finance.round2(amountPaid), parcelasQuitadas:0, parcelasAfetadas:[], descontoAntecipacao:0, valorBaixadoTotal:0, saldoRestante:Finance.round2(amountPaid), valorRecebidoAplicado:0 };
        const payDate = paymentDate || Utils.today();
        let saldo = Finance.round2(amountPaid);
        const afetadas = [];
        let descontoTotal = 0;
        let baixadoTotal = 0;
        let aplicado = 0;
        const futuras = DB.getInstallmentsByLoan(loanKey)
          .filter(inst => inst.status_inst !== 'pago' && Utils.daysDiff(inst.due_date, payDate) > 0)
          .sort((a,b) => {
            const da = String(a.due_date || '');
            const db = String(b.due_date || '');
            if (da !== db) return db.localeCompare(da);
            return Number(b.number || 0) - Number(a.number || 0);
          });
        futuras.forEach(inst => {
          if (saldo <= 0.009) return;
          const pv = Finance.getPresentValueForInstallment(loan, inst, payDate);
          if (pv.presentValue <= 0.009 || pv.futureValue <= 0.009) return;
          if (saldo + 0.009 >= pv.presentValue) {
            const recebido = pv.presentValue;
            saldo = Finance.round2(saldo - recebido);
            aplicado = Finance.round2(aplicado + recebido);
            descontoTotal = Finance.round2(descontoTotal + pv.discount);
            baixadoTotal = Finance.round2(baixadoTotal + pv.futureValue);
            afetadas.push({
              numeroParcela: inst.number,
              installmentId: inst.id,
              dataVencimento: inst.due_date,
              diasAntecipados: pv.daysAhead,
              valorOriginalParcela: Finance.round2(pv.futureValue),
              valorPresenteCalculado: Finance.round2(pv.presentValue),
              valorRecebidoAplicado: Finance.round2(recebido),
              descontoAplicado: Finance.round2(pv.discount),
              valorFuturoAbatido: Finance.round2(pv.futureValue),
              statusNovo: 'quitada_antecipada'
            });
          } else {
            const fator = pv.presentValue > 0 ? (pv.futureValue / pv.presentValue) : 1;
            const recebido = saldo;
            const futuroAbatido = Math.min(pv.futureValue, Finance.round2(recebido * fator));
            const desconto = Math.max(0, Finance.round2(futuroAbatido - recebido));
            aplicado = Finance.round2(aplicado + recebido);
            descontoTotal = Finance.round2(descontoTotal + desconto);
            baixadoTotal = Finance.round2(baixadoTotal + futuroAbatido);
            afetadas.push({
              numeroParcela: inst.number,
              installmentId: inst.id,
              dataVencimento: inst.due_date,
              diasAntecipados: pv.daysAhead,
              valorOriginalParcela: Finance.round2(pv.futureValue),
              valorPresenteCalculado: Finance.round2(pv.presentValue),
              valorRecebidoAplicado: Finance.round2(recebido),
              descontoAplicado: Finance.round2(desconto),
              valorFuturoAbatido: Finance.round2(futuroAbatido),
              statusNovo: 'parcialmente_antecipada'
            });
            saldo = 0;
          }
        });
        return {
          ok: afetadas.length > 0,
          valorDigitado: Finance.round2(amountPaid),
          valorRecebidoAplicado: Finance.round2(aplicado),
          parcelasQuitadas: afetadas.filter(a => a.statusNovo === 'quitada_antecipada').length,
          parcelasAfetadas: afetadas,
          descontoAntecipacao: Finance.round2(descontoTotal),
          valorBaixadoTotal: Finance.round2(baixadoTotal),
          saldoRestante: Finance.round2(saldo)
        };
      },
      applyInstallmentPayoff: (loanKey, amountPaid, paymentDate = null) => {
        const loan = DB.getLoanByKey(loanKey);
        if (!loan) return { ok:false, message:'Empréstimo não encontrado' };
        if (Finance.isProportionalLoan(loan)) return { ok:false, message:'Quitação projetada aqui vale para contratos parcelados.' };
        const payDate = paymentDate || Utils.today();
        const payoff = Finance.simulateInstallmentPayoff(loanKey, payDate);
        if (!payoff.ok || payoff.totalHoje <= 0.009) return { ok:false, message:'Nenhuma parcela em aberto para quitar.' };
        if (Number(amountPaid || 0) + 0.009 < payoff.totalHoje) return { ok:false, message:'Valor insuficiente para quitar. Valor necessário hoje: ' + Utils.fmtMoney(payoff.totalHoje) };
        let paidToPrincipal = 0, paidToPeriodInterest = 0, paidToExtraInterest = 0, paidToPenalty = 0;
        const afetadas = [];
        payoff.parcelas.forEach(row => {
          const inst = DB.getInstallmentById(row.installmentId);
          if (!inst || inst.status_inst === 'pago') return;
          const det = Finance.calcInstallmentDetails(inst, payDate);
          if (row.tipo === 'futura_com_desconto') {
            DB.updateInstallment(inst.id, {
              principal: 0,
              interest: 0,
              installment_amount: 0,
              status_inst: 'pago',
              status_antecipacao: 'quitada_antecipada',
              antecipacao_valor_recebido: Finance.round2(Number(inst.antecipacao_valor_recebido || 0) + Number(row.valorParaQuitarHoje || 0)),
              antecipacao_desconto: Finance.round2(Number(inst.antecipacao_desconto || 0) + Number(row.descontoAplicado || 0)),
              antecipacao_baixa_total: Finance.round2(Number(inst.antecipacao_baixa_total || 0) + Number(row.valorOriginalParcela || 0)),
              antecipacao_data: payDate,
              discount_applied: Finance.round2(Number(inst.discount_applied || 0) + Number(row.descontoAplicado || 0)),
              original_principal_before_discount: Number(inst.original_principal_before_discount ?? inst.principal ?? 0),
              original_interest_before_discount: Number(inst.original_interest_before_discount ?? inst.interest ?? 0),
              original_installment_amount_before_discount: Number(inst.original_installment_amount_before_discount ?? inst.installment_amount ?? 0),
              last_payment_date: payDate
            });
          } else {
            const patch = {
              paid_principal: Finance.round2(Number(inst.paid_principal || 0) + Number(det.principal || 0)),
              paid_period_interest: Finance.round2(Number(inst.paid_period_interest || 0) + Number(det.periodInterestPending || 0)),
              paid_extra_interest: Finance.round2(Number(inst.paid_extra_interest || 0) + Number(det.extraInterestPending || 0)),
              paid_penalty: Finance.round2(Number(inst.paid_penalty || 0) + Number(det.accumulatedPenalty || 0)),
              total_paid_principal: Finance.round2(Number(inst.total_paid_principal || 0) + Number(det.principal || 0)),
              total_paid_period_interest: Finance.round2(Number(inst.total_paid_period_interest || 0) + Number(det.periodInterestPending || 0)),
              total_paid_extra_interest: Finance.round2(Number(inst.total_paid_extra_interest || 0) + Number(det.extraInterestPending || 0)),
              total_paid_penalty: Finance.round2(Number(inst.total_paid_penalty || 0) + Number(det.accumulatedPenalty || 0)),
              last_payment_date: payDate,
              status_inst: 'pago'
            };
            paidToPrincipal = Finance.round2(paidToPrincipal + Number(det.principal || 0));
            paidToPeriodInterest = Finance.round2(paidToPeriodInterest + Number(det.periodInterestPending || 0));
            paidToExtraInterest = Finance.round2(paidToExtraInterest + Number(det.extraInterestPending || 0));
            paidToPenalty = Finance.round2(paidToPenalty + Number(det.accumulatedPenalty || 0));
            DB.updateInstallment(inst.id, patch);
          }
          afetadas.push({ ...row, statusNovo:'quitada' });
        });
        const updated = DB.getInstallmentsByLoan(loanKey);
        const allPaid = updated.length > 0 && updated.every(i => i.status_inst === 'pago');
        DB.updateLoan(loan.id, { status_loan: allPaid ? 'quitado' : 'ativo', last_payoff_at: new Date().toISOString() });
        return {
          ok:true,
          message:'Contrato quitado com projeção de valor presente.',
          valorRecebido: Finance.round2(amountPaid),
          valorNecessario: payoff.totalHoje,
          valorBaixadoTotal: payoff.totalContrato,
          descontoAntecipacao: payoff.descontoTotal,
          saldoNaoAplicado: Finance.round2(Math.max(0, Number(amountPaid || 0) - payoff.totalHoje)),
          parcelasAfetadas: afetadas,
          paidToPrincipal,
          paidToPeriodInterest,
          paidToExtraInterest,
          paidToPenalty
        };
      },
      reduceInstallmentByFutureValue: (inst, futureValueToReduce, referenceDate = null) => {
        const totalFuture = Finance.getOpenFutureInstallmentValue(inst, referenceDate || Utils.today());
        const reduction = Math.min(Finance.round2(futureValueToReduce), totalFuture);
        if (reduction <= 0.009 || totalFuture <= 0.009) return { principal: Number(inst.principal || 0), interest: Number(inst.interest || 0), installment_amount: Number(inst.installment_amount || 0) };
        const principal = Number(inst.principal || 0);
        const interest = Number(inst.interest || 0);
        const base = Math.max(0.01, principal + interest);
        const principalReduce = Math.min(principal, Finance.round2(reduction * (principal / base)));
        const interestReduce = Math.min(interest, Finance.round2(reduction - principalReduce));
        let newPrincipal = Finance.round2(principal - principalReduce);
        let newInterest = Finance.round2(interest - interestReduce);
        let leftover = Finance.round2(reduction - principalReduce - interestReduce);
        if (leftover > 0.009) {
          const extraPrincipal = Math.min(newPrincipal, leftover);
          newPrincipal = Finance.round2(newPrincipal - extraPrincipal);
          leftover = Finance.round2(leftover - extraPrincipal);
        }
        if (leftover > 0.009) {
          const extraInterest = Math.min(newInterest, leftover);
          newInterest = Finance.round2(newInterest - extraInterest);
        }
        return {
          principal: newPrincipal,
          interest: newInterest,
          installment_amount: Finance.round2(newPrincipal + newInterest)
        };
      },
      applyAnticipationToFutureInstallments: (loanKey, amountPaid, paymentDate) => {
        const loan = DB.getLoanByKey(loanKey);
        if (!loan) return { ok:false, message:'Empréstimo não encontrado', parcelasAfetadas:[], valorRecebido:0, descontoAntecipacao:0, valorBaixadoTotal:0, saldoNaoAplicado:Number(amountPaid||0) };
        if (Finance.isProportionalLoan(loan)) return { ok:false, message:'Antecipação por parcelas futuras vale apenas para contratos parcelados.', parcelasAfetadas:[], valorRecebido:0, descontoAntecipacao:0, valorBaixadoTotal:0, saldoNaoAplicado:Number(amountPaid||0) };
        const taxaDiariaDecimal = Math.max(0, Number(loan.daily_rate_used ?? loan.late_daily_rate ?? 0) / 100);
        const payDate = paymentDate || Utils.today();
        let saldo = Finance.round2(amountPaid);
        let valorRecebidoAplicadoTotal = 0;
        let descontoTotal = 0;
        let baixadoTotal = 0;
        const afetadas = [];
        const futuras = DB.getInstallmentsByLoan(loanKey)
          .filter(inst => inst.status_inst !== 'pago' && Utils.daysDiff(inst.due_date, payDate) > 0)
          .sort((a,b) => {
            const da = String(a.due_date || '');
            const db = String(b.due_date || '');
            if (da !== db) return db.localeCompare(da);
            return Number(b.number || 0) - Number(a.number || 0);
          });

        futuras.forEach(inst => {
          if (saldo <= 0.009) return;
          const statusAnterior = inst.status_inst || 'pendente';
          const dias = Math.max(0, Utils.daysDiff(inst.due_date, payDate));
          if (dias <= 0) return;
          const pv = Finance.getPresentValueForInstallment(loan, inst, payDate);
          const valorFuturoParcela = Finance.round2(pv.futureValue || 0);
          const valorPresente = Finance.round2(pv.presentValue || 0);
          const fator = valorPresente > 0 ? (valorFuturoParcela / valorPresente) : 1;
          if (valorFuturoParcela <= 0.009 || valorPresente <= 0.009) return;

          if (saldo + 0.009 >= valorPresente) {
            const valorRecebidoAplicado = valorPresente;
            const desconto = Math.max(0, Finance.round2(valorFuturoParcela - valorPresente));
            const novoStatus = 'quitada_antecipada';
            DB.updateInstallment(inst.id, {
              principal: 0,
              interest: 0,
              installment_amount: 0,
              status_inst: 'pago',
              status_antecipacao: novoStatus,
              antecipacao_valor_recebido: Finance.round2(Number(inst.antecipacao_valor_recebido || 0) + valorRecebidoAplicado),
              antecipacao_desconto: Finance.round2(Number(inst.antecipacao_desconto || 0) + desconto),
              antecipacao_baixa_total: Finance.round2(Number(inst.antecipacao_baixa_total || 0) + valorFuturoParcela),
              antecipacao_data: payDate,
              discount_applied: Finance.round2(Number(inst.discount_applied || 0) + desconto),
              original_principal_before_discount: Number(inst.original_principal_before_discount ?? inst.principal ?? 0),
              original_interest_before_discount: Number(inst.original_interest_before_discount ?? inst.interest ?? 0),
              original_installment_amount_before_discount: Number(inst.original_installment_amount_before_discount ?? inst.installment_amount ?? 0)
            });
            saldo = Finance.round2(saldo - valorPresente);
            valorRecebidoAplicadoTotal = Finance.round2(valorRecebidoAplicadoTotal + valorRecebidoAplicado);
            descontoTotal = Finance.round2(descontoTotal + desconto);
            baixadoTotal = Finance.round2(baixadoTotal + valorFuturoParcela);
            afetadas.push({
              numeroParcela: inst.number,
              installmentId: inst.id,
              valorOriginalParcela: Finance.round2(valorFuturoParcela),
              valorPresenteCalculado: valorPresente,
              valorRecebidoAplicado: valorRecebidoAplicado,
              descontoAplicado: desconto,
              valorFuturoAbatido: Finance.round2(valorFuturoParcela),
              statusAnterior,
              statusNovo: novoStatus,
              dataVencimento: inst.due_date,
              diasAntecipados: dias
            });
          } else {
            const valorRecebidoAplicado = saldo;
            const valorFuturoAbatido = Math.min(valorFuturoParcela, Finance.round2(valorRecebidoAplicado * fator));
            const desconto = Math.max(0, Finance.round2(valorFuturoAbatido - valorRecebidoAplicado));
            const reduced = Finance.reduceInstallmentByFutureValue(inst, valorFuturoAbatido, payDate);
            const novoStatus = reduced.installment_amount <= 0.009 ? 'quitada_antecipada' : 'parcialmente_antecipada';
            DB.updateInstallment(inst.id, {
              ...reduced,
              status_inst: novoStatus === 'quitada_antecipada' ? 'pago' : 'pendente',
              status_antecipacao: novoStatus,
              antecipacao_valor_recebido: Finance.round2(Number(inst.antecipacao_valor_recebido || 0) + valorRecebidoAplicado),
              antecipacao_desconto: Finance.round2(Number(inst.antecipacao_desconto || 0) + desconto),
              antecipacao_baixa_total: Finance.round2(Number(inst.antecipacao_baixa_total || 0) + valorFuturoAbatido),
              antecipacao_data: payDate,
              discount_applied: Finance.round2(Number(inst.discount_applied || 0) + desconto),
              original_principal_before_discount: Number(inst.original_principal_before_discount ?? inst.principal ?? 0),
              original_interest_before_discount: Number(inst.original_interest_before_discount ?? inst.interest ?? 0),
              original_installment_amount_before_discount: Number(inst.original_installment_amount_before_discount ?? inst.installment_amount ?? 0)
            });
            saldo = 0;
            valorRecebidoAplicadoTotal = Finance.round2(valorRecebidoAplicadoTotal + valorRecebidoAplicado);
            descontoTotal = Finance.round2(descontoTotal + desconto);
            baixadoTotal = Finance.round2(baixadoTotal + valorFuturoAbatido);
            afetadas.push({
              numeroParcela: inst.number,
              installmentId: inst.id,
              valorOriginalParcela: Finance.round2(valorFuturoParcela),
              valorPresenteCalculado: valorPresente,
              valorRecebidoAplicado: valorRecebidoAplicado,
              descontoAplicado: desconto,
              valorFuturoAbatido: Finance.round2(valorFuturoAbatido),
              statusAnterior,
              statusNovo: novoStatus,
              dataVencimento: inst.due_date,
              diasAntecipados: dias
            });
          }
        });

        const updated = DB.getInstallmentsByLoan(loanKey);
        const allPaid = updated.length > 0 && updated.every(i => i.status_inst === 'pago');
        DB.updateLoan(loan.id, { status_loan: allPaid ? 'quitado' : 'ativo', last_anticipation_at: new Date().toISOString() });
        return {
          ok: afetadas.length > 0,
          message: afetadas.length > 0 ? 'Antecipação aplicada com desconto nas parcelas futuras.' : 'Nenhuma parcela futura em aberto para antecipar.',
          valorRecebido: Finance.round2(Number(amountPaid || 0)),
          valorRecebidoAplicado: Finance.round2(valorRecebidoAplicadoTotal),
          descontoAntecipacao: Finance.round2(descontoTotal),
          valorBaixadoTotal: Finance.round2(baixadoTotal),
          saldoNaoAplicado: Finance.round2(saldo),
          modoAplicacao: 'de_tras_para_frente',
          parcelasAfetadas: afetadas
        };
      },
      rebuildNonProportionalLoanFromPayments: (loanKey) => {
        const loan = DB.getLoanByKey(loanKey);
        if (!loan) return false;
        if (Finance.isProportionalLoan(loan)) return false;

        Finance.ensureInstallmentsForLoan(loan);
        const installments = DB.getInstallmentsByLoan(loanKey).sort((a,b) => Number(a.number || 0) - Number(b.number || 0));
        const payments = DB.getPaymentsByLoan(loanKey).sort((a,b) => {
          const da = String(a.payment_date || '');
          const db = String(b.payment_date || '');
          if (da !== db) return da.localeCompare(db);
          return String(a.id || '').localeCompare(String(b.id || ''));
        });

        const n = Math.max(1, Number(loan.num_installments || installments.length || 1));
        const amount = Number(loan.amount || 0);
        const calc = Finance.isFixedInstallmentLoan(loan)
          ? Finance.calcFixedPaymentSchedule(amount, Number(loan.fixed_installment_value || 0), n)
          : Finance.calcInstallmentAmount(amount, Number(loan.rate_used || 0), loan.frequency || 'mensal', n);

        const schedule = calc?.schedule || [];

        // 1) Volta as parcelas ao desenho original do empréstimo, sem mudar as datas cadastradas.
        installments.forEach(inst => {
          const row = schedule[Number(inst.number || 1) - 1] || {};
          const basePrincipal = Finance.round2(Number(row.principal ?? inst.original_principal_before_discount ?? inst.principal ?? 0));
          const baseInterest = Finance.round2(Number(row.interest ?? inst.original_interest_before_discount ?? inst.interest ?? 0));
          const baseAmount = Finance.round2(Number(row.installmentAmount ?? (basePrincipal + baseInterest)));
          DB.updateInstallment(inst.id, {
            principal: basePrincipal,
            interest: baseInterest,
            installment_amount: baseAmount,
            start_balance: Finance.round2(Number(row.startBalance ?? inst.start_balance ?? 0)),
            end_balance: Finance.round2(Number(row.endBalance ?? inst.end_balance ?? 0)),
            paid_principal: 0,
            paid_period_interest: 0,
            paid_extra_interest: 0,
            paid_penalty: 0,
            total_paid_principal: 0,
            total_paid_period_interest: 0,
            total_paid_extra_interest: 0,
            total_paid_penalty: 0,
            total_penalty_discount: 0,
            last_payment_date: '',
            status_inst: 'pendente',
            status_antecipacao: '',
            antecipacao_valor_recebido: 0,
            antecipacao_desconto: 0,
            antecipacao_baixa_total: 0,
            antecipacao_data: '',
            discount_applied: 0,
            original_principal_before_discount: basePrincipal,
            original_interest_before_discount: baseInterest,
            original_installment_amount_before_discount: baseAmount,
            payment_history_synced_at: new Date().toISOString()
          });
        });

        // 2) Reaplica os pagamentos existentes em ordem de data.
        // Pagamento normal NÃO vira antecipação. Antecipação só ocorre quando payment_type = antecipacao_parcelas.
        payments.forEach(pay => {
          const paymentDate = pay.payment_date || Utils.today();
          if (pay.payment_type === 'antecipacao_parcelas') {
            const result = Finance.applyAnticipationToFutureInstallments(loanKey, Number(pay.payment_amount || 0), paymentDate);
            DB.updatePayment(pay.id, {
              antecipacao_discount_total: Finance.round2(result.descontoAntecipacao || 0),
              antecipacao_total_baixado: Finance.round2(result.valorBaixadoTotal || 0),
              antecipacao_valor_recebido_aplicado: Finance.round2(result.valorRecebidoAplicado || 0),
              antecipacao_saldo_nao_aplicado: Finance.round2(result.saldoNaoAplicado || 0),
              parcelas_afetadas: result.parcelasAfetadas || [],
              paid_extra_to_future_installments: 0,
              paid_to_principal: 0,
              paid_to_period_interest: 0,
              paid_to_extra_interest: 0,
              paid_to_penalty: 0
            });
            return;
          }

          const currentInst = DB.getInstallmentById(pay.installment_id_pay);
          if (!currentInst) return;
          let det = Finance.calcInstallmentDetails(currentInst, paymentDate);
          const replayPenaltyDiscount = Finance.round2(Math.min(Number(det.accumulatedPenalty || 0), Number(pay.penalty_discount_value || 0)));
          if (replayPenaltyDiscount > 0) {
            det = { ...det, accumulatedPenalty: Finance.round2(det.accumulatedPenalty - replayPenaltyDiscount), totalDue: Finance.round2(det.totalDue - replayPenaltyDiscount), balance: Finance.round2((det.balance || det.totalDue) - replayPenaltyDiscount) };
          }
          let remaining = Number(pay.payment_amount || 0);
          let paidToPeriodInterest = Math.min(det.periodInterestPending, remaining); remaining = Finance.round2(remaining - paidToPeriodInterest);
          let paidToExtraInterest = Math.min(det.extraInterestPending, remaining); remaining = Finance.round2(remaining - paidToExtraInterest);
          let paidToPenalty = Math.min(det.accumulatedPenalty, remaining); remaining = Finance.round2(remaining - paidToPenalty);
          let paidToPrincipal = 0;
          if (pay.payment_type !== 'jurosMulta') {
            paidToPrincipal = Math.min(det.principal, remaining);
            remaining = Finance.round2(remaining - paidToPrincipal);
          }

          const patch = {
            paid_principal: Finance.round2(Number(currentInst.paid_principal || 0) + paidToPrincipal),
            paid_period_interest: Finance.round2(Number(currentInst.paid_period_interest || 0) + paidToPeriodInterest),
            paid_extra_interest: Finance.round2(Number(currentInst.paid_extra_interest || 0) + paidToExtraInterest),
            // paid_penalty guarda SOMENTE dinheiro pago em multa.
            // Desconto de multa é isolado no pagamento e não abate ciclos/vencimentos futuros.
            paid_penalty: Finance.round2(Number(currentInst.paid_penalty || 0) + paidToPenalty),
            total_paid_principal: Finance.round2(Number(currentInst.total_paid_principal || 0) + paidToPrincipal),
            total_paid_period_interest: Finance.round2(Number(currentInst.total_paid_period_interest || 0) + paidToPeriodInterest),
            total_paid_extra_interest: Finance.round2(Number(currentInst.total_paid_extra_interest || 0) + paidToExtraInterest),
            total_paid_penalty: Finance.round2(Number(currentInst.total_paid_penalty || 0) + paidToPenalty),
            total_penalty_discount: Finance.round2(Number(currentInst.total_penalty_discount || 0) + replayPenaltyDiscount),
            last_payment_date: paymentDate
          };
          const testInst = { ...currentInst, ...patch };
          const detAfter = Finance.calcInstallmentDetails(testInst, paymentDate);
          patch.status_inst = detAfter.totalDue <= 0.009 ? 'pago' : 'pendente';
          DB.updateInstallment(currentInst.id, patch);

          DB.updatePayment(pay.id, {
            paid_to_principal: Finance.round2(paidToPrincipal),
            paid_to_period_interest: Finance.round2(paidToPeriodInterest),
            paid_to_extra_interest: Finance.round2(paidToExtraInterest),
            paid_to_penalty: Finance.round2(paidToPenalty),
            paid_extra_to_future_installments: 0,
            normal_excess_unallocated: Finance.round2(Math.max(0, remaining))
          });
        });

        const updatedInstallments = DB.getInstallmentsByLoan(loanKey);
        const allPaid = updatedInstallments.length > 0 && updatedInstallments.every(i => i.status_inst === 'pago');
        DB.updateLoan(loan.id, { status_loan: allPaid ? 'quitado' : 'ativo', last_discount_recalc_at: new Date().toISOString() });
        return true;
      },
      rebuildInstallmentFromPayments: (inst, paymentsToReplay) => {
        const loan = DB.getLoanByKey(inst.loan_id_inst);
        const client = loan ? DB.getClientById(loan.client_id) : null;
        const dailyRate = Number(loan?.daily_rate_used ?? Finance.getLateDailyRate(client));
        const scheduledDue = Finance.getScheduledDueDate(loan, inst.number, inst.due_date);
        const round2 = Finance.round2;
        const isProportional = Finance.isProportionalLoan(loan);
        const originalPrincipal = Number(inst.original_principal_before_recalc ?? (Number(inst.principal || 0) + Finance.getPaidTotal(inst, 'principal')));
        const originalInterest = isProportional ? 0 : Number(inst.original_interest_before_recalc ?? (Number(inst.interest || 0) + Finance.getPaidTotal(inst, 'periodInterest')));
        let state = {
          ...inst,
          principal: round2(originalPrincipal),
          interest: round2(originalInterest),
          installment_amount: round2(originalPrincipal + originalInterest),
          paid_principal: 0,
          paid_period_interest: 0,
          paid_extra_interest: 0,
          paid_penalty: 0,
          total_paid_principal: 0,
          total_paid_period_interest: 0,
          total_paid_extra_interest: 0,
          total_paid_penalty: 0,
          total_penalty_discount: 0,
          due_date: scheduledDue,
          last_payment_date: '',
          interest_start_date: isProportional ? (loan?.date || inst.interest_start_date || scheduledDue) : (inst.interest_start_date || ''),
          start_balance: round2(originalPrincipal),
          end_balance: 0,
          status_inst: 'pendente'
        };

        const ordered = [...(paymentsToReplay || [])].sort((a,b) => {
          const da = String(a.payment_date || '');
          const db = String(b.payment_date || '');
          if (da !== db) return da.localeCompare(db);
          return String(a.id || '').localeCompare(String(b.id || ''));
        });

        ordered.forEach(p => {
          const paymentDate = p.payment_date || Utils.today();
          let det = Finance.calcInstallmentDetails(state, paymentDate);
          const replayPenaltyDiscount = round2(Math.min(Number(det.accumulatedPenalty || 0), Number(p.penalty_discount_value || 0)));
          if (replayPenaltyDiscount > 0) {
            det = { ...det, accumulatedPenalty: round2(det.accumulatedPenalty - replayPenaltyDiscount), totalDue: round2(det.totalDue - replayPenaltyDiscount), balance: round2((det.balance || det.totalDue) - replayPenaltyDiscount) };
            state.total_penalty_discount = round2(Number(state.total_penalty_discount || 0) + replayPenaltyDiscount);
          }
          let remaining = Number(p.payment_amount || 0);
          let paidToPeriodInterest = Math.min(det.periodInterestPending, remaining); remaining -= paidToPeriodInterest;
          let paidToExtraInterest = Math.min(det.extraInterestPending, remaining); remaining -= paidToExtraInterest;
          let paidToPenalty = Math.min(det.accumulatedPenalty, remaining); remaining -= paidToPenalty;
          let paidToPrincipal = 0;
          if (p.payment_type !== 'jurosMulta') {
            paidToPrincipal = Math.min(det.principal, remaining);
            remaining -= paidToPrincipal;
          }

          state.paid_period_interest = round2(Number(state.paid_period_interest || 0) + paidToPeriodInterest);
          state.paid_extra_interest = round2(Number(state.paid_extra_interest || 0) + paidToExtraInterest);
          // paid_penalty guarda SOMENTE dinheiro pago em multa.
          // Desconto de multa é isolado no pagamento e não abate ciclos/vencimentos futuros.
          state.paid_penalty = round2(Number(state.paid_penalty || 0) + paidToPenalty);
          state.paid_principal = round2(Number(state.paid_principal || 0) + paidToPrincipal);
          state.total_paid_period_interest = round2(Number(state.total_paid_period_interest || 0) + paidToPeriodInterest);
          state.total_paid_extra_interest = round2(Number(state.total_paid_extra_interest || 0) + paidToExtraInterest);
          state.total_paid_penalty = round2(Number(state.total_paid_penalty || 0) + paidToPenalty);
          state.total_paid_principal = round2(Number(state.total_paid_principal || 0) + paidToPrincipal);
          state.last_payment_date = paymentDate;

          const remainingPrincipal = Math.max(0, det.principal - paidToPrincipal);
          const detAfter = Finance.calcInstallmentDetails(state, paymentDate);
          const penaltyAfterCurrentDiscount = round2(Math.max(0, Number(detAfter.accumulatedPenalty || 0) - Number(replayPenaltyDiscount || 0)));
          const fullyPaid = remainingPrincipal <= 0.009 && detAfter.totalInterestPending <= 0.009 && penaltyAfterCurrentDiscount <= 0.009;
          const minimumToRollCycle = round2(Number(det.totalInterestPending || 0) + Number(det.accumulatedPenalty || 0));
          const paidInterestPenaltyNow = round2(paidToPeriodInterest + paidToExtraInterest + paidToPenalty);
          const canRollCycle = minimumToRollCycle <= 0.009 || paidInterestPenaltyNow + 0.009 >= minimumToRollCycle;

          if (fullyPaid) {
            state.status_inst = 'pago';
          } else if (isProportional && !canRollCycle) {
            // Pagamento parcial de juros/multa não renova o ciclo e não zera juros.
            // Desconto de multa também não pode contar como juros pagos.
            state.status_inst = 'pendente';
          } else {
            const previousCycleDue = state.due_date;
            const paymentBeforeDue = new Date(paymentDate + 'T12:00:00') < new Date(previousCycleDue + 'T12:00:00');
            const newDue = p.new_due_date || (paymentBeforeDue ? previousCycleDue : Finance.getAutomaticNextDueDate(loan, paymentDate));
            state.original_principal_before_recalc = originalPrincipal;
            state.original_interest_before_recalc = originalInterest;
            state.principal = round2(remainingPrincipal);
            if (isProportional) {
              state.interest = 0;
              state.installment_amount = round2(state.principal);
              state.interest_start_date = paymentDate;
            } else {
              const interestStartDate = paymentBeforeDue ? previousCycleDue : paymentDate;
              const futureInterest = Finance.calcFutureInterest(remainingPrincipal, dailyRate, interestStartDate, newDue);
              state.interest = round2(futureInterest);
              state.installment_amount = round2(state.principal + state.interest);
            }
            state.paid_principal = 0;
            state.paid_period_interest = 0;
            state.paid_extra_interest = 0;
            state.paid_penalty = 0;
            state.start_balance = state.principal;
            state.end_balance = 0;
            state.due_date = newDue;
            state.last_payment_date = '';
            state.status_inst = 'pendente';
          }
        });
        return state;
      },
      calcInstallmentAmount: (amount, periodRate, frequency, numInstallments) => {
        const freqDays = { diario:1, semanal:7, quinzenal:15, mensal:30 };
        const daysInPeriod = freqDays[frequency] || 30;
        const n = Math.max(1, Number(numInstallments || 1));
        const principal = Number(amount || 0);
        const i = Number(periodRate || 0) / 100;
        let installmentAmount = 0;
        if (i <= 0) {
          installmentAmount = principal / n;
        } else {
          const factor = Math.pow(1 + i, n);
          installmentAmount = principal * (i * factor) / (factor - 1);
        }
        const schedule = [];
        let balance = principal;
        for (let k = 1; k <= n; k++) {
          const interest = i <= 0 ? 0 : balance * i;
          let amortization = installmentAmount - interest;
          if (k === n) amortization = balance;
          const installment = k === n ? interest + amortization : installmentAmount;
          const startBalance = balance;
          balance = Math.max(0, balance - amortization);
          schedule.push({ number: k, startBalance, interest, principal: amortization, installmentAmount: installment, endBalance: balance });
        }
        return { basePrincipal: principal / n, periodInterest: schedule[0]?.interest || 0, installmentAmount, daysInPeriod, total: schedule.reduce((sum, row) => sum + row.installmentAmount, 0), schedule };
      },
      generateInstallmentDates: (firstDue, frequency, count) => {
        const dates = [];
        const freqDays = { diario:1, semanal:7, quinzenal:15, mensal:30 };
        const days = freqDays[frequency] || 30;
        let d = new Date(firstDue + 'T12:00:00');
        for (let i = 0; i < count; i++) { dates.push(d.toISOString().split('T')[0]); d = new Date(d.getTime() + days * 86400000); }
        return dates;
      },
      ensureInstallmentsForLoan: (loan) => {
        if (!loan?.loan_id) return;
        const existing = DB.getInstallmentsByLoan(loan.loan_id);
        if (existing.length > 0) return;
        const amount = Number(loan.amount || 0);
        const instCount = Number(loan.num_installments || 1);
        const rate = Number(loan.rate_used || 0);
        const freq = loan.frequency || 'mensal';
        const firstDue = loan.first_due || loan.date || Utils.today();
        const calc = Finance.calcInstallmentAmount(amount, rate, freq, instCount);
        const dates = Finance.generateInstallmentDates(firstDue, freq, instCount);
        const installmentList = [];
        for (let i = 0; i < instCount; i++) {
          const row = calc.schedule[i] || { installmentAmount: calc.installmentAmount, principal: calc.basePrincipal, interest: 0, startBalance: amount, endBalance: 0 };
          installmentList.push({
            id: Utils.uid(), type: 'installment', installment_id: Utils.uid(), loan_id_inst: loan.loan_id,
            number: i + 1, due_date: dates[i], installment_amount: Math.round(row.installmentAmount * 100) / 100,
            principal: Math.round(row.principal * 100) / 100, interest: Math.round(row.interest * 100) / 100,
            start_balance: Math.round(row.startBalance * 100) / 100, end_balance: Math.round(row.endBalance * 100) / 100,
            paid_principal: 0, paid_period_interest: 0, paid_extra_interest: 0, paid_penalty: 0,
            last_payment_date: '', status_inst: 'pendente'
          });
        }
        installmentList.forEach(item => db.installments.push(item));
        persistDB();
      },
      calcInstallmentDetails: (inst, referenceDate = null) => {
        const loan = DB.getLoanByKey(inst.loan_id_inst);
        const client = loan ? DB.getClientById(loan.client_id) : null;
        const lateDailyRate = Number(loan?.daily_rate_used ?? loan?.late_daily_rate ?? Finance.getLateDailyRate(client));
        const penaltyRate = Number(loan?.penalty_daily_rate ?? DB.getConfig('default_penalty_daily_rate', '1.00'));
        const originalPrincipal = Number(inst.principal || 0);
        const paidPrincipal = Number(inst.paid_principal || 0);
        const paidExtraInterest = Number(inst.paid_extra_interest || 0);
        const paidPenalty = Number(inst.paid_penalty || 0);
        const principalRemaining = Math.max(0, originalPrincipal - paidPrincipal);
        const baseDate = referenceDate || Utils.today();
        const todayDate = new Date(baseDate + 'T12:00:00');
        const dueDate = new Date(inst.due_date + 'T12:00:00');

        if (Finance.isProportionalLoan(loan)) {
          const interestStart = inst.interest_start_date || inst.last_payment_date || loan?.date || inst.due_date || baseDate;
          const daysRunning = Finance.daysBetweenDates(interestStart, baseDate);
          const grossInterest = principalRemaining * (lateDailyRate / 100) * daysRunning;
          const paidPeriodInterest = Number(inst.paid_period_interest || 0);
          const periodInterestPending = Math.max(0, grossInterest - paidPeriodInterest);
          const daysLate = todayDate > dueDate ? Math.floor((todayDate - dueDate) / 86400000) : 0;
          // MULTA COMPOSTA: no saldo corrido, a multa de atraso fica separada do juros.
          // Ela incide 1% ao dia composto sobre o capital em aberto + juros corridos pendentes,
          // enquanto o cliente não quitar ao menos o valor mínimo de juros/multa do ciclo.
          const penaltyBase = Math.max(0, principalRemaining + periodInterestPending);
          const penaltyBrut = daysLate > 0 ? penaltyBase * (Math.pow(1 + (penaltyRate / 100), daysLate) - 1) : 0;
          const accumulatedPenalty = Math.max(0, penaltyBrut - paidPenalty);
          const totalInterestPending = periodInterestPending;
          const totalDue = Math.max(0, principalRemaining + totalInterestPending + accumulatedPenalty);
          return {
            principal: principalRemaining,
            periodInterestPending,
            extraInterestPending: 0,
            extraInterestDaysLate: 0,
            accumulatedPenalty,
            totalInterestPending,
            earlyDiscount: 0,
            daysLate,
            daysRunning,
            interestStartDate: interestStart,
            totalDue,
            balance: totalDue
          };
        }

        const periodInterest = Number(inst.interest || 0);
        const paidPeriodInterest = Number(inst.paid_period_interest || 0);
        const periodInterestPending = Math.max(0, periodInterest - paidPeriodInterest);
        const lastPaymentDate = inst.last_payment_date ? new Date(inst.last_payment_date + 'T12:00:00') : null;
        const interestStartDate = lastPaymentDate && lastPaymentDate > dueDate ? lastPaymentDate : dueDate;
        if (todayDate < dueDate) {
          const totalDue = Math.max(0, principalRemaining + periodInterestPending);
          return { principal: principalRemaining, periodInterestPending, extraInterestPending: 0, extraInterestDaysLate: 0, accumulatedPenalty: 0, totalInterestPending: periodInterestPending, earlyDiscount: 0, daysLate: 0, totalDue, balance: totalDue };
        }
        let daysLate = 0;
        if (todayDate > interestStartDate) daysLate = Math.floor((todayDate - interestStartDate) / 86400000);
        const extraInterestDaysLate = principalRemaining * (lateDailyRate / 100) * daysLate;
        const extraInterestPending = Math.max(0, extraInterestDaysLate - paidExtraInterest);
        const totalInterestPending = periodInterestPending + extraInterestPending;
        // MULTA COMPOSTA em contratos parcelados: separada dos juros.
        // Base correta: PARCELA INTEIRA EM ABERTO = principal restante + juros da parcela + juros extras de atraso.
        // Não pode ser calculada apenas sobre os juros, pois a multa contratual incide sobre o débito total vencido da parcela.
        const penaltyBase = Math.max(0, principalRemaining + periodInterestPending + extraInterestPending);
        const penaltyBrut = daysLate > 0 ? penaltyBase * (Math.pow(1 + (penaltyRate / 100), daysLate) - 1) : 0;
        const accumulatedPenalty = Math.max(0, penaltyBrut - paidPenalty);
        const totalDue = Math.max(0, principalRemaining + totalInterestPending + accumulatedPenalty);
        return { principal: principalRemaining, periodInterestPending, extraInterestPending, extraInterestDaysLate, accumulatedPenalty, totalInterestPending, earlyDiscount: 0, daysLate, totalDue, balance: totalDue };
      }
    };


    const InvestorFinance = {
      daysFrom: (date) => Math.max(0, Utils.daysDiff(Utils.today(), date || Utils.today())),
      daysBetween: (startDate, endDate) => Math.max(0, Utils.daysDiff(endDate || Utils.today(), startDate || Utils.today())),
      calcAporteAt: (ap, referenceDate = null) => {
        const investor = DB.getInvestorById(ap?.investor_id || '');
        const rate = Number(investor?.daily_rate || 0);
        const amount = Number(ap?.amount || 0);
        const baseDate = ap?.date || Utils.today();
        const refDate = referenceDate || Utils.today();
        const days = InvestorFinance.daysBetween(baseDate, refDate);
        const profit = amount * (rate / 100) * days;
        const totalReinvested = Number(ap?.total_reinvested || 0);
        const totalProfitPaid = Number(ap?.total_profit_paid || 0);
        const totalPrincipalPaid = Number(ap?.total_principal_paid || 0);
        return {
          amount,
          rate,
          days,
          profit: Finance.round2(profit),
          total: Finance.round2(amount + profit),
          baseDate,
          refDate,
          totalReinvested,
          totalProfitPaid,
          totalPrincipalPaid
        };
      },
      calcAporte: (ap) => InvestorFinance.calcAporteAt(ap, Utils.today()),
      calcInvestor: (investor) => {
        const aportes = DB.getAportesByInvestor(investor?.id || '');
        const payments = DB.getInvestorPayments(investor?.id || '');
        let invested = 0, profit = 0, grossBalance = 0, reinvested = 0, principalWithdrawn = 0;
        aportes.forEach(ap => {
          const c = InvestorFinance.calcAporte(ap);
          invested += c.amount;
          profit += c.profit;
          grossBalance += c.total;
          reinvested += Number(ap.total_reinvested || 0);
          principalWithdrawn += Number(ap.total_principal_paid || 0);
        });
        const paidCash = payments.filter(p => p.payment_kind !== 'reaporte').reduce((sum, p) => sum + Number(p.amount || 0), 0);
        const paidProfitCash = payments.filter(p => p.payment_kind !== 'reaporte').reduce((sum, p) => sum + Number(p.paid_profit || 0), 0);
        const paidPrincipalCash = payments.filter(p => p.payment_kind !== 'reaporte').reduce((sum, p) => sum + Number(p.paid_principal || 0), 0);
        const reinvestedPayments = payments.filter(p => p.payment_kind === 'reaporte').reduce((sum, p) => sum + Number(p.amount || 0), 0);
        const reinvestedTotal = Finance.round2(reinvestedPayments || reinvested);
        // Rendimentos ficam separados do capital aplicado.
        // Rendimento Total = rendimento atual em aberto + rendimento já recebido em dinheiro.
        // A Receber = Rendimento Total - Já Recebido. Reaporte fica em campo próprio e não entra como dinheiro a receber.
        const rendimentoTotal = Finance.round2(profit + paidProfitCash);
        const jaRecebidoRendimento = Finance.round2(paidProfitCash);
        const aReceberRendimento = Finance.round2(Math.max(0, rendimentoTotal - jaRecebidoRendimento));
        return {
          invested: Finance.round2(invested),
          profit: Finance.round2(profit),
          rendimentoTotal,
          grossBalance: Finance.round2(grossBalance),
          paid: Finance.round2(paidCash),
          paidCash: Finance.round2(paidCash),
          paidProfitCash: jaRecebidoRendimento,
          paidPrincipalCash: Finance.round2(paidPrincipalCash),
          reinvested: reinvestedTotal,
          principalWithdrawn: Finance.round2(principalWithdrawn || paidPrincipalCash),
          availableProfit: aReceberRendimento,
          netToReceive: aReceberRendimento,
          aportesCount: aportes.length,
          paymentsCount: payments.length
        };
      },
      chooseAporteForPayment: (investorId, paymentDate) => {
        const aportes = DB.getAportesByInvestor(investorId).filter(ap => Number(ap.amount || 0) > 0.009);
        if (!aportes.length) return null;
        const withProfit = aportes.map(ap => ({ ap, calc: InvestorFinance.calcAporteAt(ap, paymentDate) }))
          .sort((a,b) => (b.calc.profit - a.calc.profit) || String(a.ap.date || '').localeCompare(String(b.ap.date || '')));
        return (withProfit.find(x => x.calc.profit > 0.009) || withProfit[0]).ap;
      }
    };
