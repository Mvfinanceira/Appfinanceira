    function mvV19ApplyAvulsoPayment(e) {
      e.preventDefault();
      const instId = activeModal?.instId || activeModal?.inst?.id;
      const paymentDate = document.getElementById('pay-date')?.value || Utils.today();
      const nextDueDate = document.getElementById('pay-next-due')?.value || '';
      if (!instId) return Utils.toast('Parcela não selecionada', 'error');
      const inst = DB.getInstallmentById(instId);
      if (!inst) return Utils.toast('Parcela não encontrada', 'error');
      const loan = DB.getLoanByKey(inst.loan_id_inst);
      if (!loan) return Utils.toast('Empréstimo não encontrado', 'error');
      const currentDueDate = document.getElementById('pay-current-due')?.value || inst.due_date || paymentDate;
      if (currentDueDate !== inst.due_date) DB.updateInstallment(inst.id, { due_date: currentDueDate, due_date_manual_updated_at: new Date().toISOString() });
      const workingInst = { ...inst, due_date: currentDueDate };
      const isProportional = Finance.isProportionalLoan(loan);
      const amountTyped = mvGetAvulsoValue();
      if (amountTyped <= 0) return Utils.toast('Informe o valor do pagamento avulso.', 'error');

      // Pagamento avulso é calculado pela DATA REAL selecionada: baixa juros aberto naquela data e o excedente vai ao capital.
      const detOriginal = Finance.calcInstallmentDetails(workingInst, paymentDate);
      const split = mvSimulateAvulsoSplit(detOriginal, amountTyped);
      if (split.amount <= 0) return Utils.toast('Não há juros ou capital em aberto para aplicar esse pagamento avulso.', 'error');

      const cumulativePrincipal = mvRoundMoney(Finance.getPaidTotal(inst, 'principal') + split.paidToPrincipal);
      const cumulativePeriodInterest = mvRoundMoney(Finance.getPaidTotal(inst, 'periodInterest') + split.paidToPeriodInterest);
      const cumulativeExtraInterest = mvRoundMoney(Finance.getPaidTotal(inst, 'extraInterest') + split.paidToExtraInterest);
      const cumulativePenalty = mvRoundMoney(Finance.getPaidTotal(inst, 'penalty'));

      let patch = {
        due_date: currentDueDate,
        paid_principal: mvRoundMoney(Number(inst.paid_principal || 0) + split.paidToPrincipal),
        paid_period_interest: mvRoundMoney(Number(inst.paid_period_interest || 0) + split.paidToPeriodInterest),
        paid_extra_interest: mvRoundMoney(Number(inst.paid_extra_interest || 0) + split.paidToExtraInterest),
        paid_penalty: mvRoundMoney(Number(inst.paid_penalty || 0)),
        total_paid_principal: cumulativePrincipal,
        total_paid_period_interest: cumulativePeriodInterest,
        total_paid_extra_interest: cumulativeExtraInterest,
        total_paid_penalty: cumulativePenalty,
        last_payment_date: paymentDate
      };

      const tempInst = { ...workingInst, ...patch };
      const detAfter = Finance.calcInstallmentDetails(tempInst, paymentDate);
      const remainingPrincipalAfterPayment = mvRoundMoney(Number(detAfter.principal || 0));
      const jurosQuitados = Number(detAfter.totalInterestPending || 0) <= 0.009;
      const multaAberta = Number(detAfter.accumulatedPenalty || 0) > 0.009;
      const fullyPaid = remainingPrincipalAfterPayment <= 0.009 && jurosQuitados && !multaAberta;
      let newDue = currentDueDate;

      if (fullyPaid) {
        patch = { ...patch, status_inst: 'pago' };
        Utils.toast('Pagamento avulso quitou juros e capital desta parcela.', 'success');
      } else if (isProportional && jurosQuitados) {
        const baseDateForNextDue = new Date(paymentDate + 'T12:00:00') <= new Date(currentDueDate + 'T12:00:00') ? currentDueDate : paymentDate;
        newDue = nextDueDate || Finance.getAutomaticNextDueDate(loan, baseDateForNextDue);
        patch = {
          ...patch,
          original_principal_before_recalc: Number(inst.original_principal_before_recalc ?? inst.principal ?? 0),
          original_interest_before_recalc: Number(inst.original_interest_before_recalc ?? inst.interest ?? 0),
          principal: remainingPrincipalAfterPayment,
          interest: 0,
          installment_amount: remainingPrincipalAfterPayment,
          interest_start_date: paymentDate,
          paid_principal: 0,
          paid_period_interest: 0,
          paid_extra_interest: 0,
          paid_penalty: 0,
          start_balance: remainingPrincipalAfterPayment,
          end_balance: 0,
          due_date: newDue,
          last_payment_date: '',
          status_inst: 'pendente'
        };
        Utils.toast('Avulso aplicado: juros baixados e sobra abatida do capital. Novo ciclo atualizado.', 'success');
      } else {
        patch = { ...patch, status_inst: 'pendente' };
        Utils.toast('Avulso aplicado: juros baixados primeiro e sobra abatida do capital.', 'success');
      }

      DB.addPayment({
        id: Utils.uid(), type: 'payment', payment_id: Utils.uid(), installment_id_pay: inst.id, loan_id_pay: inst.loan_id_inst,
        payment_amount: split.amount, payment_date: paymentDate, payment_cycle_reference_date: paymentDate,
        payment_type: 'avulso', payment_split_version: 19, previous_due_date: currentDueDate, due_date_before_payment: currentDueDate, new_due_date: newDue !== currentDueDate ? newDue : '',
        paid_to_principal: split.paidToPrincipal, paid_to_period_interest: split.paidToPeriodInterest, paid_to_extra_interest: split.paidToExtraInterest, paid_to_penalty: 0,
        penalty_discount_percent: 0, penalty_discount_value: 0, paid_extra_to_future_installments: 0, normal_excess_unallocated: split.unused,
        observacao: 'Pagamento avulso: baixa juros primeiro; excedente abate capital/principal. Multa permanece separada.'
      });
      DB.updateInstallment(inst.id, patch);
      const allInst = DB.getInstallmentsByLoan(inst.loan_id_inst);
      const allPaid = allInst.length > 0 && allInst.every(i => i.id === inst.id ? patch.status_inst === 'pago' : i.status_inst === 'pago');
      DB.updateLoan(loan.id, { status_loan: allPaid ? 'quitado' : 'ativo' });
      activeModal = null;
      render();
    }

    const processPaymentV19Base = Crud.processPayment;
    Crud.processPayment = function(e) {
      const type = document.getElementById('pay-type')?.value || 'integral';
      if (type === 'avulso') return mvV19ApplyAvulsoPayment(e);
      return processPaymentV19Base(e);
    };

</script>
