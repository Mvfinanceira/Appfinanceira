        let inst = parseInt(document.getElementById('lf-inst').value, 10);
        const calculationMode = document.getElementById('lf-calc-mode')?.value || 'price';
        const fixedInstallmentValue = parseFloat(document.getElementById('lf-fixed-payment')?.value || '0');
        const penaltyDailyRate = parseFloat(document.getElementById('lf-penalty-rate')?.value || DB.getConfig('default_penalty_daily_rate','1.00'));
        const loanDate = document.getElementById('lf-date').value || Utils.today();
        let firstDue = document.getElementById('lf-first').value;
        const manualPeriodRate = parseFloat(document.getElementById('lf-rate')?.value || '0');

        if (!clientId) return Utils.toast('Selecione um cliente', 'error');
        if (!amount || amount <= 0) return Utils.toast('Valor inválido', 'error');
        if (calculationMode === 'proporcional') inst = 1;
        if (!inst || inst < 1) return Utils.toast('Número de parcelas inválido', 'error');
        if (calculationMode === 'parcela_fixa' && (!fixedInstallmentValue || fixedInstallmentValue <= 0)) return Utils.toast('Informe o valor da parcela fixa', 'error');
        if (isNaN(penaltyDailyRate) || penaltyDailyRate < 0) return Utils.toast('Informe a % diária da multa de atraso', 'error');

        if (!firstDue) {
          const d = new Date(loanDate + 'T12:00:00');
          d.setDate(d.getDate() + 30);
          firstDue = d.toISOString().split('T')[0];
        }

        const client = DB.getClientById(clientId);
        const multi = { diario:1, semanal:7, quinzenal:15, mensal:30 }[freq] || 30;
        let dailyRate = Finance.getLevelDailyRate(client);
        let rate = Finance.getPeriodRate(client, freq);
        let calc = null;
        if (calculationMode === 'parcela_fixa') {
          calc = Finance.calcFixedPaymentSchedule(amount, fixedInstallmentValue, inst);
          if (!calc) return Utils.toast('Parcela fixa menor que a amortização mínima. Aumente o valor da parcela.', 'error');
          rate = Number(calc.periodRate || 0);
          dailyRate = multi > 0 ? rate / multi : rate;
        } else {
          rate = isNaN(manualPeriodRate) || manualPeriodRate < 0 ? rate : manualPeriodRate;
          dailyRate = multi > 0 ? rate / multi : rate;
          if (isNaN(rate) || rate < 0) return Utils.toast('Taxa do empréstimo inválida', 'error');
          calc = Finance.calcInstallmentAmount(amount, rate, freq, inst);
        }
        const loanId = currentLoan?.loan_id || Utils.uid();

        const loanData = {
          id: currentLoan?.id || Utils.uid(), type: 'loan', loan_id: loanId, client_id: clientId, amount,
          frequency: freq, num_installments: inst, date: loanDate, first_due: firstDue,
          status_loan: currentLoan?.status_loan || 'ativo', calculation_mode: calculationMode,
          rate_used: rate, daily_rate_used: dailyRate, client_level_used: client?.level || '1', late_daily_rate: dailyRate,
          penalty_daily_rate: penaltyDailyRate, fixed_installment_value: calculationMode === 'parcela_fixa' ? fixedInstallmentValue : 0,
          calculated_from_fixed_installment: calculationMode === 'parcela_fixa', edited_at: isEdit ? new Date().toISOString() : (currentLoan?.edited_at || '')
        };

        const dates = Finance.generateInstallmentDates(firstDue, freq, inst);
        const installmentList = [];
        if (calculationMode === 'proporcional') {
          installmentList.push({
            id: Utils.uid(), type: 'installment', installment_id: Utils.uid(), loan_id_inst: loanId, number: 1, due_date: firstDue,
            installment_amount: Math.round(amount * 100) / 100, principal: Math.round(amount * 100) / 100, interest: 0,
            interest_start_date: loanDate, original_principal_before_recalc: Math.round(amount * 100) / 100, original_interest_before_recalc: 0,
            start_balance: Math.round(amount * 100) / 100, end_balance: 0,
            paid_principal: 0, paid_period_interest: 0, paid_extra_interest: 0, paid_penalty: 0,
            total_paid_principal: 0, total_paid_period_interest: 0, total_paid_extra_interest: 0, total_paid_penalty: 0,
            total_penalty_discount: 0, last_payment_date: '', status_inst: 'pendente'
          });
        } else {
          for (let i = 0; i < inst; i++) {
            const row = calc.schedule[i];
            installmentList.push({
              id: Utils.uid(), type: 'installment', installment_id: Utils.uid(), loan_id_inst: loanId, number: i + 1, due_date: dates[i],
              installment_amount: Math.round(row.installmentAmount * 100) / 100, principal: Math.round(row.principal * 100) / 100,
              interest: Math.round(row.interest * 100) / 100, start_balance: Math.round(row.startBalance * 100) / 100, end_balance: Math.round(row.endBalance * 100) / 100,
              paid_principal: 0, paid_period_interest: 0, paid_extra_interest: 0, paid_penalty: 0,
              total_paid_principal: 0, total_paid_period_interest: 0, total_paid_extra_interest: 0, total_paid_penalty: 0,
              total_penalty_discount: 0, last_payment_date: '', status_inst: 'pendente'
            });
          }
        }

        if (isEdit && currentLoan) {
          DB.updateLoan(currentLoan.id, loanData);
          mvRecalculateInstallmentsForEditedLoan({ ...currentLoan, ...loanData }, calculationMode === 'proporcional' ? { schedule: [{ installmentAmount: amount, principal: amount, interest: 0, startBalance: amount, endBalance: 0 }] } : calc, dates);
          Utils.toast('Empréstimo atualizado e parcelas recalculadas!', 'success');
          viewingLoan = currentLoan.id;
        } else {
          DB.addLoanWithInstallments(loanData, installmentList);
          Utils.toast('Empréstimo criado!', 'success');
        }

        render();
      },
      processPayment: (e) => {

        const type = document.getElementById('pay-type').value;

        const inst = DB.getInstallmentById(instId);
        if (!inst) return Utils.toast('Parcela não encontrada', 'error');

        const loanForDue = DB.getLoanByKey(inst.loan_id_inst);
        const clientForLoan = loanForDue ? DB.getClientById(loanForDue.client_id) : null;
        const dailyRateForLoan = Number(loanForDue?.daily_rate_used ?? Finance.getLateDailyRate(clientForLoan));
        const previousDueDate = inst.due_date;

          if (!isInstallmentMode) return Utils.toast('Quitação projetada automática vale para contratos parcelados.', 'error');

            type: 'payment',

            paid_to_penalty: 0
          });
          Utils.toast('Antecipação aplicada: desconto ' + Utils.fmtMoney(result.descontoAntecipacao) + ' | baixa total ' + Utils.fmtMoney(result.valorBaixadoTotal), 'success');
          activeModal = null;
          render();
          return;
        }

        const getAutomaticNextDueDate = () => {
          const freqDays = { diario:1, semanal:7, quinzenal:15, mensal:30 };
          const days = freqDays[loanForDue?.frequency] || 30;
          const d = new Date(paymentDate + 'T12:00:00');
          d.setDate(d.getDate() + days);
          return d.toISOString().split('T')[0];
        };

        let desiredNewDue = nextDueDate;
        if (desiredNewDue && new Date(desiredNewDue + 'T12:00:00') <= new Date(paymentDate + 'T12:00:00')) {
          return Utils.toast('A nova data precisa ser maior que a data do pagamento', 'error');
        }

        // Em contrato recorrente/saldo corrido, quando a data real do pagamento é antes ou no vencimento,
        // o pagamento cobre o ciclo daquele vencimento. Portanto o cálculo usa o vencimento como data-base,
        // não a data de hoje e nem deixa multa aparecer só porque o lançamento foi registrado depois.
        const paymentCycleReferenceDate = (!isInstallmentMode && paymentDate && previousDueDate && new Date(paymentDate + 'T12:00:00') <= new Date(previousDueDate + 'T12:00:00')) ? previousDueDate : paymentDate;
        let det = Finance.calcInstallmentDetails(inst, paymentCycleReferenceDate);
        const penaltyDiscountValue = Finance.round2(Math.min(Number(det.accumulatedPenalty || 0), Number(det.accumulatedPenalty || 0) * requestedPenaltyDiscountPercent / 100));
        if (penaltyDiscountValue > 0) {
          det = { ...det, accumulatedPenalty: Finance.round2(det.accumulatedPenalty - penaltyDiscountValue), totalDue: Finance.round2(det.totalDue - penaltyDiscountValue), balance: Finance.round2((det.balance || det.totalDue) - penaltyDiscountValue) };
        }
        const minimumToRollCycle = Finance.round2(Number(det.totalInterestPending || 0) + Number(det.accumulatedPenalty || 0));
        let remainingAmount = amount;

        let paidToPeriodInterest = 0;
        let paidToExtraInterest = 0;
        let paidToPenalty = 0;
        let paidToPrincipal = 0;

        let newPaidPrincipal = Number(inst.paid_principal || 0);
        let newPaidPeriodInterest = Number(inst.paid_period_interest || 0);
        let newPaidExtraInterest = Number(inst.paid_extra_interest || 0);
        let newPaidPenalty = Number(inst.paid_penalty || 0);

        // Ordem correta: juros do período -> juros extras -> multa -> principal.
        paidToPeriodInterest = Math.min(det.periodInterestPending, remainingAmount);
        newPaidPeriodInterest += paidToPeriodInterest;
        remainingAmount -= paidToPeriodInterest;

        paidToExtraInterest = Math.min(det.extraInterestPending, remainingAmount);
        newPaidExtraInterest += paidToExtraInterest;
        remainingAmount -= paidToExtraInterest;

        paidToPenalty = Math.min(det.accumulatedPenalty, remainingAmount);
        newPaidPenalty += paidToPenalty;
        remainingAmount -= paidToPenalty;

        if (type !== 'jurosMulta') {
          paidToPrincipal = Math.min(det.principal, remainingAmount);
          newPaidPrincipal += paidToPrincipal;
          remainingAmount -= paidToPrincipal;
        }

        const remainingPrincipalAfterPayment = Math.max(0, det.principal - paidToPrincipal);
        const cumulativePrincipal = Finance.getPaidTotal(inst, 'principal') + paidToPrincipal;
        const cumulativePeriodInterest = Finance.getPaidTotal(inst, 'periodInterest') + paidToPeriodInterest;
        const cumulativeExtraInterest = Finance.getPaidTotal(inst, 'extraInterest') + paidToExtraInterest;
        const cumulativePenalty = Finance.getPaidTotal(inst, 'penalty') + paidToPenalty;

        let newDue = previousDueDate;
        let patch = {
          paid_principal: newPaidPrincipal,
          paid_period_interest: newPaidPeriodInterest,
          paid_extra_interest: newPaidExtraInterest,
          // paid_penalty guarda SOMENTE dinheiro pago em multa.
          // Desconto de multa é isolado no pagamento atual e NÃO abate próximos vencimentos.
          paid_penalty: Finance.round2(newPaidPenalty),
          total_paid_principal: cumulativePrincipal,
          total_paid_period_interest: cumulativePeriodInterest,
          total_paid_extra_interest: cumulativeExtraInterest,
          total_paid_penalty: cumulativePenalty,
          total_penalty_discount: Finance.round2(Number(inst.total_penalty_discount || 0) + penaltyDiscountValue),
          last_payment_date: paymentDate
        };

        const tempInst = { ...inst, ...patch };
        const detAfter = Finance.calcInstallmentDetails(tempInst, paymentCycleReferenceDate);
        const penaltyAfterCurrentDiscount = Finance.round2(Math.max(0, Number(detAfter.accumulatedPenalty || 0) - Number(penaltyDiscountValue || 0)));
        const fullyPaid = remainingPrincipalAfterPayment <= 0.009 && detAfter.totalInterestPending <= 0.009 && penaltyAfterCurrentDiscount <= 0.009;
        const extraForFutureInstallments = Math.max(0, remainingAmount);

        if (fullyPaid) {
          // Em Tabela Price e Parcela Fixa, quitar parcela não deve gerar a mesma parcela novamente em outra data.
          // Ela fica como PAGA e qualquer valor a mais entra como desconto nas últimas parcelas.
          patch = { ...patch, status_inst: 'pago' };
          if (isInstallmentMode) {
            patch.last_payment_date = paymentDate;
          }
          Utils.toast('Parcela quitada!', 'success');
        } else if (isInstallmentMode) {
          // Em modelos por parcelas, pagamento parcial NÃO renova vencimento e NÃO recalcula a mesma parcela.
          // A parcela permanece pendente com os abatimentos registrados. Reprocessamento por nova data só vale no saldo corrido proporcional.
          patch = { ...patch, status_inst: 'pendente' };
          Utils.toast('Pagamento parcial registrado sem alterar o vencimento da parcela.', 'success');
        } else {
          // Saldo corrido proporcional: só cria novo ciclo se o cliente pagou todo o mínimo
          // de juros + multa do ciclo. Se pagar menos, NÃO dá baixa total nem reinicia a data-base.
          // Para renovar o ciclo recorrente, o desconto NÃO conta como juros pagos.
          // O cliente precisa pagar em dinheiro os juros pendentes + a multa restante após desconto.
          const paidInterestPenaltyNow = Finance.round2(paidToPeriodInterest + paidToExtraInterest + paidToPenalty);
          const canRollCycle = minimumToRollCycle <= 0.009 || paidInterestPenaltyNow + 0.009 >= minimumToRollCycle;
          if (!canRollCycle) {
            patch = { ...patch, status_inst: 'pendente' };
            Utils.toast('Pagamento parcial registrado. Ainda ficou juros ou multa real em aberto para este ciclo; o vencimento não foi renovado.', 'success');
          } else {
            const paymentBeforeDue = new Date(paymentDate + 'T12:00:00') <= new Date(previousDueDate + 'T12:00:00');
            // Se pagou antes/no vencimento e quitou o ciclo, o vencimento precisa avançar para o próximo ciclo.
            // Antes o sistema mantinha o vencimento antigo, e por isso no dia de hoje aparecia multa indevida.
            const baseDateForNextDue = paymentBeforeDue ? previousDueDate : paymentDate;
            newDue = desiredNewDue || Finance.getAutomaticNextDueDate(loanForDue, baseDateForNextDue);
            const roundedPrincipal = Math.round(remainingPrincipalAfterPayment * 100) / 100;
            patch = {
              ...patch,
              original_principal_before_recalc: Number(inst.original_principal_before_recalc ?? inst.principal ?? 0),
              original_interest_before_recalc: Number(inst.original_interest_before_recalc ?? inst.interest ?? 0),
              principal: roundedPrincipal,
              interest: 0,
              installment_amount: roundedPrincipal,
              interest_start_date: paymentCycleReferenceDate,
              paid_principal: 0,
              paid_period_interest: 0,
              paid_extra_interest: 0,
              paid_penalty: 0,
              start_balance: roundedPrincipal,
              end_balance: 0,
              due_date: newDue,
              last_payment_date: '',
              status_inst: 'pendente'
            };
            Utils.toast('Pagamento registrado. Juros/multa quitados e saldo corrido atualizado pela data do pagamento!', 'success');
          }
        }

        DB.addPayment({
          id: Utils.uid(),
          type: 'payment',
          payment_id: Utils.uid(),
          installment_id_pay: inst.id,
          loan_id_pay: inst.loan_id_inst,
          payment_amount: amount,
          payment_date: paymentDate,
          payment_cycle_reference_date: paymentCycleReferenceDate,
          payment_type: type,
          previous_due_date: previousDueDate,
          new_due_date: (!isInstallmentMode && newDue !== previousDueDate) ? newDue : '',
          paid_to_principal: paidToPrincipal,
          paid_to_period_interest: paidToPeriodInterest,
          paid_to_extra_interest: paidToExtraInterest,
          paid_to_penalty: paidToPenalty,
          penalty_discount_percent: requestedPenaltyDiscountPercent,
          penalty_discount_value: penaltyDiscountValue,
          paid_extra_to_future_installments: 0,
          recalculated_remaining_principal: remainingPrincipalAfterPayment,
          recalculated_future_interest: patch.interest ?? ''
        });

        DB.updateInstallment(inst.id, patch);

        // Pagamento normal não aplica desconto/antecipação nas futuras parcelas.
        // Para isso, use explicitamente o tipo "Antecipar parcelas futuras".

        const allInst = DB.getInstallmentsByLoan(inst.loan_id_inst);
        const allPaid = allInst.every(i => i.id === inst.id ? patch.status_inst === 'pago' : i.status_inst === 'pago');
        const loan = DB.getLoanByKey(inst.loan_id_inst);
        if (loan) DB.updateLoan(loan.id, { status_loan: allPaid ? 'quitado' : 'ativo' });

        activeModal = null;
        render();
      },

      recalculateLoanHistory: (loanKey) => {
        const loan = DB.getLoanByKey(loanKey);
        if (!loan) return Utils.toast('Empréstimo não encontrado', 'error');
        Finance.ensureInstallmentsForLoan(loan);
        if (!Finance.isProportionalLoan(loan)) {
          Finance.rebuildNonProportionalLoanFromPayments(loanKey);
          Utils.toast('Histórico sincronizado e descontos recalculados conforme os pagamentos atuais!', 'success');
          confirmAction = null;
          render();
          return;
        }

        // Correção importante:
        // Este botão NÃO deve reprocessar a dívida do zero, pois isso muda vencimentos,
        // apaga abatimentos já lançados e pode transformar pagamento antigo em novo ciclo.
        // Agora ele apenas sincroniza o resumo da parcela com o histórico já registrado.
        // Os pagamentos continuam intactos, as datas de vencimento não são alteradas e
        // os valores pagos são recompostos a partir do próprio histórico de pagamentos.
        const installments = DB.getInstallmentsByLoan(loanKey);
        const allPayments = DB.getPaymentsByLoan(loanKey);

        installments.forEach(inst => {
          const instPayments = allPayments
            .filter(p => p.installment_id_pay === inst.id)
            .sort((a,b) => {
              const da = String(a.payment_date || '');
              const db = String(b.payment_date || '');
              if (da !== db) return da.localeCompare(db);
              return String(a.id || '').localeCompare(String(b.id || ''));
            });

          const hasPaymentHistory = instPayments.length > 0;
          const sumField = (field) => Finance.round2(instPayments.reduce((s,p) => s + Number(p[field] || 0), 0));
          const totalPrincipal = sumField('paid_to_principal');
          const totalPeriodInterest = sumField('paid_to_period_interest');
          const totalExtraInterest = sumField('paid_to_extra_interest');
          const totalPenalty = sumField('paid_to_penalty');
          const totalAllocated = Finance.round2(totalPrincipal + totalPeriodInterest + totalExtraInterest + totalPenalty);
          const totalPaidAmount = Finance.round2(instPayments.reduce((s,p) => s + Number(p.payment_amount || 0), 0));
          const latestPaymentDate = hasPaymentHistory ? instPayments[instPayments.length - 1].payment_date : (inst.last_payment_date || '');
          const originalDueDate = inst.due_date;
          const originalInterestStart = inst.interest_start_date || '';
          const originalStatus = inst.status_inst || 'pendente';
          const loanForInst = DB.getLoanByKey(inst.loan_id_inst);
          const isProportional = Finance.isProportionalLoan(loanForInst);

          let patch = {
            due_date: originalDueDate,
            payment_history_synced_at: new Date().toISOString()
          };

          if (hasPaymentHistory && totalAllocated > 0.009) {
            patch = {
              ...patch,
              total_paid_principal: totalPrincipal,
              total_paid_period_interest: totalPeriodInterest,
              total_paid_extra_interest: totalExtraInterest,
              total_paid_penalty: totalPenalty
            };

            if (!isProportional) {
              patch.paid_principal = totalPrincipal;
              patch.paid_period_interest = totalPeriodInterest;
              patch.paid_extra_interest = totalExtraInterest;
              patch.paid_penalty = totalPenalty;
              patch.last_payment_date = latestPaymentDate || inst.last_payment_date || '';

              const testInst = { ...inst, ...patch, due_date: originalDueDate };
              const det = Finance.calcInstallmentDetails(testInst, latestPaymentDate || Utils.today());
              const expectedBase = Finance.round2(Number(inst.principal || 0) + Number(inst.interest || 0));
              const isPaidNow = det.totalDue <= 0.009 || totalAllocated >= expectedBase - 0.009 || originalStatus === 'pago';
              patch.status_inst = isPaidNow ? 'pago' : 'pendente';
            } else {
              patch.interest_start_date = originalInterestStart || inst.interest_start_date || '';
              patch.last_payment_date = inst.last_payment_date || '';
              patch.status_inst = originalStatus;
            }
          } else if (hasPaymentHistory && totalAllocated <= 0.009 && totalPaidAmount > 0.009) {
            patch.last_payment_date = latestPaymentDate || inst.last_payment_date || '';
            patch.status_inst = originalStatus;
          }

          DB.updateInstallment(inst.id, patch);
        });

        const updatedInstallments = DB.getInstallmentsByLoan(loanKey);
        const allPaid = updatedInstallments.length > 0 && updatedInstallments.every(i => i.status_inst === 'pago');
        DB.updateLoan(loan.id, { status_loan: allPaid ? 'quitado' : 'ativo', last_history_sync_at: new Date().toISOString() });
        Utils.toast('Histórico sincronizado sem alterar vencimentos nem apagar valores pagos!', 'success');
        confirmAction = null;
        render();
      },

      deleteClient: (clientId) => {
        const loans = DB.getLoansByClient(clientId);
        loans.forEach(loan => {
          const insts = DB.getInstallmentsByLoan(loan.loan_id);
          insts.forEach(inst => DB.deleteInstallment(inst.id));
          const pays = DB.getPaymentsByLoan(loan.loan_id);
          pays.forEach(pay => DB.deletePayment(pay.id));
          DB.deleteLoan(loan.id);
        });
        DB.deleteClient(clientId);
        Utils.toast('Cliente excluído', 'success');
        Utils.clearStates();
        render();
      },

      deleteLoan: (loanId, loanKey) => {
        const insts = DB.getInstallmentsByLoan(loanKey);
        insts.forEach(inst => DB.deleteInstallment(inst.id));
        const pays = DB.getPaymentsByLoan(loanKey);
        pays.forEach(pay => DB.deletePayment(pay.id));
        DB.deleteLoan(loanId);
        Utils.toast('Empréstimo excluído', 'success');
        Utils.clearStates();
        render();
      },

      deletePayment: (paymentId) => {
        const payment = DB.getPaymentById(paymentId);
        if (!payment) return;
        const inst = DB.getInstallmentById(payment.installment_id_pay);
        if (!inst) return;
        const loan = DB.getLoanByKey(payment.loan_id_pay);

        DB.deletePayment(paymentId);

        // Em Tabela Price e Parcela Fixa, pagamento a mais gera desconto nas últimas parcelas.
        // Ao excluir o pagamento, precisa reconstruir TODAS as parcelas do empréstimo,
        // limpar os descontos antigos e reaplicar somente os pagamentos que ainda existem.
        if (loan && !Finance.isProportionalLoan(loan)) {
          Finance.rebuildNonProportionalLoanFromPayments(payment.loan_id_pay);
          Utils.toast('Pagamento removido. Descontos e parcelas recalculados!', 'success');
          render();
          return;
        }

        const remainingPayments = DB.getPaymentsByLoan(payment.loan_id_pay)
          .filter(p => p.installment_id_pay === payment.installment_id_pay);

        const rebuilt = Finance.rebuildInstallmentFromPayments(inst, remainingPayments);
        DB.updateInstallment(inst.id, rebuilt);

        if (loan) {
          const allInst = DB.getInstallmentsByLoan(payment.loan_id_pay);
          const allPaid = allInst.every(i => i.id === inst.id ? rebuilt.status_inst === 'pago' : i.status_inst === 'pago');
          DB.updateLoan(loan.id, { status_loan: allPaid ? 'quitado' : 'ativo' });
        }

        Utils.toast('Pagamento removido e valores recalculados!', 'success');
        render();
      }
    };

      const title = DB.getConfig('business_name', 'MV Financeira');
      document.documentElement.style.overflowX = 'hidden';
      document.body.style.overflowX = 'hidden';

      switch (currentScreen) {
        case 'home': app.innerHTML = renderHome(title); break;
        case 'adminLogin': app.innerHTML = renderAdminLogin(title); break;
        case 'clientLogin': app.innerHTML = renderClientLogin(title); break;
        case 'investorLogin': app.innerHTML = renderInvestorLogin(title); break;
        case 'admin': app.innerHTML = renderAdmin(title); break;
        case 'client': app.innerHTML = renderClientPortal(title); break;
        case 'investor': app.innerHTML = renderInvestorPortal(title); break;
      }

      // Evita o navegador manter rolagem lateral antiga após atualizar o arquivo no celular.
      document.documentElement.scrollLeft = 0;
      document.body.scrollLeft = 0;

      if (confirmAction) showConfirmModal();
      if (activeModal?.type === 'payment') showPaymentModal();
      if (activeModal?.type === 'message') showMessageModal();
      lucide.createIcons();
      if (currentScreen === 'admin' && editingLoan !== null) setTimeout(updateLoanRatePlaceholder, 0);
      if (currentScreen === 'admin' && editingClient !== null) setTimeout(toggleCustomRateField, 0);
    }

      const tabs = [
        { id:'clients', icon:'users', label:'Clientes' },

        { id:'investors', icon:'trending-up', label:'Investidores' },

        { id:'health', icon:'heart-pulse', label:'Saúde' },

      ];
      let content = '';
      switch(adminTab) {
        case 'clients': content = renderClientsTab(); break;
        case 'loans': content = renderLoansTab(); break;
        case 'investors': content = renderInvestorsTab(); break;
        case 'delete-loans': content = renderDeleteLoansTab(); break;

        ${clients.length === 0 ? '<p class="text-slate-500 text-center py-8">Nenhum cliente cadastrado</p>' : filteredClients.length === 0 ? '<p class="text-slate-500 text-center py-8">Nenhum cliente encontrado com essa pesquisa.</p>' : `<div class="space-y-3">${filteredClients.map(c => {

          const overdue = activeLoans.reduce((sum, loan) => sum + mvGetLoanSummary(loan).overdueCount, 0);
          const dueTotal = activeLoans.reduce((sum, loan) => sum + mvGetLoanSummary(loan).totalDue, 0);

      const inv = DB.getInvestorById(viewingInvestor);

      const aportes = DB.getAportesByInvestor(inv.id);
      const payments = DB.getInvestorPayments(inv.id);
      const cashPayments = payments.filter(p => p.payment_kind !== 'reaporte');
      const reinvestPayments = payments.filter(p => p.payment_kind === 'reaporte');
      const editingAp = editingInvestorAporte ? DB.getInvestorAporteById(editingInvestorAporte) : null;
      const activeAportes = aportes.filter(ap => Number(ap.amount || 0) > 0.009);
      const aporteOptions = activeAportes.map(ap => {
        const c = InvestorFinance.calcAporte(ap);
        return `<option value="${ap.id}">${Utils.fmtMoney(c.amount)} • ${Utils.fmtDate(ap.date)} • rendimento ${Utils.fmtMoney(c.profit)}</option>`;
      }).join('');
      const aporteFormTitle = editingAp ? 'Editar Aporte' : 'Adicionar Aporte';

      return `<div>

            <button onclick="editingInvestor=JSON.parse(JSON.stringify(DB.getInvestorById('${inv.id}')));viewingInvestor=null;editingInvestorAporte=null;render()" class="btn-outline py-2 px-3 text-xs flex-1">Editar Investidor</button>

        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">

              <span class="badge ${canReinvest ? 'badge-active' : 'badge-pending'}">${canReinvest ? '30d+' : c.days + 'd'}</span>

              <div class="stat-card"><p class="text-[11px] text-slate-400">Rendimento Atual em Aberto</p><p class="text-sm font-bold text-green-400">${Utils.fmtMoney(c.profit)}</p></div>
              <div class="stat-card"><p class="text-[11px] text-slate-400">Saldo do Aporte</p><p class="text-sm font-bold text-gold-400">${Utils.fmtMoney(c.total)}</p></div>

      }) : loans;

ount > 0 ? 'text-red-300 font-semibold' : 'text-slate-400'}">${group.clientLoans.length} empréstimos • ${group.activeCount} ativos • ${group.paidCount} quitados${group.overdueCount > 0 ? ' • ' + group.overdueCount + ' atraso(s)' : ''}</p><p class="text-sm text-gold-400">Emprestado: ${Utils.fmtMoney(group.totalAmount)} • Devido: ${Utils.fmtMoney(group.totalDue)}</p></div></div><div class="flex items-center gap-2 shrink-0"><span class="badge ${group.overdueCount > 0 ? 'badge-overdue' : group.activeCount > 0 ? 'badge-active' : 'badge-paid'}">${group.overdueCount > 0 ? 'ATRASO' : group.activeCount > 0 ? 'ativo' : 'quitado'}</span><i data-lucide="${open ? 'chevron-up' : 'chevron-down'}" class="w-4 h-4 text-slate-400"></i></div></div>${open ? `<div class="mt-4 pt-3 border-t border-gold-800/20">${group.clientLoans.map(l => renderLoanCard(l, true)).join('')}</div>` : ''}</div>`; }).join('')}</div>`;

    function updateLoanRatePlaceholder() {
      const freq = document.getElementById('lf-freq')?.value || 'mensal';
      const clientId = document.getElementById('lf-client')?.value || '';
      const client = clientId ? DB.getClientById(clientId) : null;
      const rateInput = document.getElementById('lf-rate');
      const calcMode = document.getElementById('lf-calc-mode')?.value || 'price';
      const instInput = document.getElementById('lf-inst');
      const fixedWrap = document.getElementById('lf-fixed-wrap');
      const fixedInput = document.getElementById('lf-fixed-payment');
      const label = document.getElementById('lf-rate-label');
      const help = document.getElementById('lf-rate-help');
      const preview = document.getElementById('lf-preview');
      const labels = { diario: '% cobrada por dia', semanal: '% cobrada por semana', quinzenal: '% cobrada por quinzena', mensal: '% cobrada por mês' };
      const multi = { diario:1, semanal:7, quinzenal:15, mensal:30 }[freq] || 30;
      const dailyRate = client ? Finance.getLevelDailyRate(client) : Number(DB.getConfig('level1_daily_rate','0.50'));
      let periodRate = Finance.convertDailyRateToPeriod(dailyRate, freq);
      const amount = Number(document.getElementById('lf-amount')?.value || 0);
      if (fixedWrap) fixedWrap.style.display = calcMode === 'parcela_fixa' ? 'block' : 'none';
      if (instInput) {
        if (calcMode === 'proporcional') { instInput.value = 1; instInput.disabled = true; }
        else { instInput.disabled = false; }
      }
      const n = Number(document.getElementById('lf-inst')?.value || 0);
      const fixedPayment = Number(fixedInput?.value || 0);
      const manualRateActive = rateInput?.dataset.manualRate === '1' && calcMode !== 'parcela_fixa';
      if (manualRateActive) periodRate = Number(rateInput.value || periodRate);
      if (calcMode === 'parcela_fixa' && amount > 0 && n > 0 && fixedPayment > 0) {
        const fixedCalc = Finance.calcFixedPaymentSchedule(amount, fixedPayment, n);
        if (fixedCalc) periodRate = Number(fixedCalc.periodRate || 0);
      }
      if (label) label.textContent = calcMode === 'parcela_fixa' ? 'Taxa calculada pelo valor da parcela' : (labels[freq] || labels.mensal);
      if (rateInput && !manualRateActive) rateInput.value = periodRate.toFixed(2);
      if (help) {
        if (calcMode === 'parcela_fixa') help.textContent = 'Modo vice-versa: informe valor, número de parcelas e valor da parcela; o sistema calcula os juros/taxa equivalente.';
        else help.textContent = manualRateActive ? 'Taxa manual ativa: ' + periodRate.toFixed(2) + '% no prazo escolhido (~' + (periodRate / multi).toFixed(4) + '% ao dia).' : (client ? 'Cliente nível ' + (client.level || '1') + ': ' + dailyRate.toFixed(2) + '% ao dia × ' + multi + ' = ' + periodRate.toFixed(2) + '% no prazo escolhido.' : 'Selecione um cliente para aplicar a taxa do nível.');
      }
      if (preview) {
        if (amount > 0 && n > 0) {
          if (calcMode === 'proporcional') {
            const exampleDays = multi;
            const proportionalInterest = amount * (dailyRate / 100) * exampleDays;
            preview.innerHTML = '<b>Saldo corrido proporcional:</b><br>O juros é calculado dia a dia sobre o saldo em aberto.<br>Exemplo no prazo escolhido: ' + exampleDays + ' dias × ' + dailyRate.toFixed(2) + '% ao dia = <b class="text-gold-400">' + Utils.fmtMoney(proportionalInterest) + '</b> de juros sobre ' + Utils.fmtMoney(amount) + '.<br>Se houver pagamento antes do vencimento, calcula só até a data do pagamento e o restante abate principal.';
          } else if (calcMode === 'parcela_fixa') {
            if (!fixedPayment || fixedPayment <= 0) {
              preview.innerHTML = '<b>Parcela Fixa:</b><br>Informe o valor da parcela para o sistema calcular os juros no caminho inverso.';
            } else {
              const fixedCalc = Finance.calcFixedPaymentSchedule(amount, fixedPayment, n);
              if (!fixedCalc) {
                preview.innerHTML = '<b class="text-red-300">Parcela inválida:</b><br>A parcela fixa precisa ser maior ou igual a ' + Utils.fmtMoney(amount / n) + ' para amortizar o empréstimo.';
              } else {
                const first = fixedCalc.schedule[0];
                const impliedDaily = (Number(fixedCalc.periodRate || 0) / multi);
                preview.innerHTML = '<b>Parcela Fixa / cálculo vice-versa:</b><br>Parcela definida: <b class="text-gold-400">' + Utils.fmtMoney(fixedPayment) + '</b><br>Taxa equivalente no prazo: <b class="text-gold-400">' + Number(fixedCalc.periodRate || 0).toFixed(2) + '%</b> (~' + impliedDaily.toFixed(4) + '% ao dia)<br>1ª parcela: juros ' + Utils.fmtMoney(first.interest) + ' + amortização ' + Utils.fmtMoney(first.principal) + '<br>Total das parcelas: ' + Utils.fmtMoney(fixedCalc.total) + ' | Juros total: ' + Utils.fmtMoney(fixedCalc.total - amount);
              }
            }
          } else {
            const calc = Finance.calcInstallmentAmount(amount, periodRate, freq, n);
            const first = calc.schedule[0];
            preview.innerHTML = '<b>Simulação Price:</b><br>Parcela fixa: <b class="text-gold-400">' + Utils.fmtMoney(calc.installmentAmount) + '</b><br>1ª parcela: juros ' + Utils.fmtMoney(first.interest) + ' + amortização ' + Utils.fmtMoney(first.principal) + '<br>Total estimado: ' + Utils.fmtMoney(calc.total);
          }
        } else {
          preview.textContent = calcMode === 'proporcional' ? 'Informe o valor para ver a simulação proporcional.' : calcMode === 'parcela_fixa' ? 'Informe valor, quantidade de parcelas e valor da parcela fixa.' : 'Informe valor e número de parcelas para ver a simulação Price.';
        }
      }
    }

    function renderLoanDetail() {
      const loan = DB.getLoanById(viewingLoan);
      if (!loan) { viewingLoan = null; return '<p>Não encontrado</p>'; }
      Finance.ensureInstallmentsForLoan(loan);
      const installments = DB.getInstallmentsByLoan(loan.loan_id);
      const payments = DB.getPaymentsByLoan(loan.loan_id);
      // Total recebido precisa ser SEMPRE a soma real dos pagamentos lançados,
      // não a soma dos campos internos de principal/juros da parcela.
      // Esses campos podem mudar quando há sincronização, desconto nas últimas parcelas
      // ou ajustes retroativos, mas o dinheiro recebido é o histórico de pagamentos.
      const totalPaymentReceived = payments.reduce((s, p) => s + Number(p.payment_amount || 0), 0);
      const totalAnticipationDiscount = payments.reduce((s, p) => s + Number(p.antecipacao_discount_total || 0), 0);
      const totalAnticipationBaixa = payments.reduce((s, p) => s + Number(p.antecipacao_total_baixado || 0), 0);

      let totalRealDebt = 0, totalPrincipalOpen = 0, totalInterestOpen = 0, totalPenaltyOpen = 0, totalPaidPrincipal = 0, totalPaidPeriodInterest = 0, totalPaidExtraInterest = 0, totalPaidPenalty = 0;
      installments.forEach(inst => {
        const det = Finance.calcInstallmentDetails(inst);
        totalRealDebt += det.totalDue;
        totalPrincipalOpen += det.principal;
        totalInterestOpen += det.totalInterestPending;
        totalPenaltyOpen += det.accumulatedPenalty;
        totalPaidPrincipal += Finance.getPaidTotal(inst, 'principal');
        totalPaidPeriodInterest += Finance.getPaidTotal(inst, 'periodInterest');
        totalPaidExtraInterest += Finance.getPaidTotal(inst, 'extraInterest');
        totalPaidPenalty += Finance.getPaidTotal(inst, 'penalty');
      });

      return `<div>

              <p class="text-xs text-slate-400">Multa atraso: ${Number(loan.penalty_daily_rate ?? DB.getConfig('default_penalty_daily_rate','1.00')).toFixed(2)}% ao dia</p>
            </div>
            <span class="badge ${loan.status_loan==='ativo'?'badge-active':'badge-paid'}">${loan.status_loan}</span>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 text-center text-sm">
            <div class="stat-card"><p class="text-xs text-slate-400">Valor Devido</p><p class="font-bold text-red-400">${Utils.fmtMoney(totalRealDebt)}</p></div>
            <div class="stat-card"><p class="text-xs text-slate-400">Principal Aberto</p><p class="font-bold text-gold-400">${Utils.fmtMoney(totalPrincipalOpen)}</p></div>
            <div class="stat-card"><p class="text-xs text-slate-400">Juros Aberto</p><p class="font-bold text-yellow-400">${Utils.fmtMoney(totalInterestOpen)}</p></div>
            <div class="stat-card"><p class="text-xs text-slate-400">Multa Aberta</p><p class="font-bold text-red-300">${Utils.fmtMoney(totalPenaltyOpen)}</p></div>
            <div class="stat-card"><p class="text-xs text-slate-400">Principal Pago</p><p class="font-bold text-green-400">${Utils.fmtMoney(totalPaidPrincipal)}</p></div>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mt-2 text-center text-sm">
            <div class="stat-card"><p class="text-xs text-slate-400">Juros Pagos</p><p class="font-bold text-green-400">${Utils.fmtMoney(totalPaidPeriodInterest + totalPaidExtraInterest)}</p></div>
            <div class="stat-card"><p class="text-xs text-slate-400">Multa Paga</p><p class="font-bold text-green-400">${Utils.fmtMoney(totalPaidPenalty)}</p></div>
            <div class="stat-card"><p class="text-xs text-slate-400">Total Recebido</p><p class="font-bold text-green-400">${Utils.fmtMoney(totalPaymentReceived)}</p><p class="text-[10px] text-slate-500 mt-1">Dinheiro que entrou</p></div>
            <div class="stat-card"><p class="text-xs text-slate-400">Desconto Antecipação</p><p class="font-bold text-emerald-300">${Utils.fmtMoney(totalAnticipationDiscount)}</p><p class="text-[10px] text-slate-500 mt-1">Não é recebido</p></div>
            <div class="stat-card"><p class="text-xs text-slate-400">Baixa Total no Contrato</p><p class="font-bold text-gold-400">${Utils.fmtMoney(totalPaymentReceived + totalAnticipationDiscount)}</p><p class="text-[10px] text-slate-500 mt-1">Recebido + desconto</p></div>
          </div>
          <div class="flex gap-2 mt-3">
            <button onclick="activeModal={type:'message',loanKey:'${loan.loan_id}'};render()" class="btn-outline flex-1 py-2 text-sm flex items-center justify-center gap-1"><i data-lucide="message-circle" class="w-4 h-4"></i> Cobrar contrato</button>
            <button onclick="confirmAction={type:'recalcLoan',loanKey:'${loan.loan_id}',clientName:'${DB.getClientById(loan.client_id)?.name || 'Cliente'}',amount:'${Utils.fmtMoney(loan.amount)}'};render()" class="btn-outline flex-1 py-2 text-sm flex items-center justify-center gap-1"><i data-lucide="refresh-cw" class="w-4 h-4"></i> Sincronizar histórico</button>
            <button onclick="editingLoan=JSON.parse(JSON.stringify(DB.getLoanById('${loan.id}')));viewingLoan=null;render()" class="btn-outline py-2 px-3 text-sm flex items-center gap-1"><i data-lucide="pencil" class="w-4 h-4"></i> Editar</button>
            <button onclick="confirmAction={type:'deleteLoan',id:'${loan.id}',loanKey:'${loan.loan_id}',clientName:'${DB.getClientById(loan.client_id)?.name || 'Cliente'}',amount:'${Utils.fmtMoney(loan.amount)}'};render()" class="btn-danger py-2 px-3 text-sm flex items-center gap-1"><i data-lucide="trash-2" class="w-4 h-4"></i> Excluir</button>
          </div>
          <button type="button" onclick="editingLoan=JSON.parse(JSON.stringify(DB.getLoanById('${loan.id}')));viewingLoan=null;render()" class="btn-gold w-full py-3 mt-3 text-sm font-bold flex items-center justify-center gap-2"><i data-lucide="pencil" class="w-4 h-4"></i> EDITAR ESTE EMPRÉSTIMO</button>
          ${installments.some(i => i.status_inst !== 'pago') ? `<button type="button" onclick="activeModal={type:'payment',instId:'${installments.find(i => i.status_inst !== 'pago').id}'};render();" class="btn-gold w-full py-3 mt-3 text-sm font-bold flex items-center justify-center gap-2"><i data-lucide="credit-card" class="w-4 h-4"></i> Registrar pagamento da próxima parcela</button>` : ''}
        </div>
        <h3 class="font-semibold mb-2">Parcelas</h3>
        ${installments.map(inst => {
          const det = Finance.calcInstallmentDetails(inst);
          const isPaid = inst.status_inst === 'pago';
          const isOverdue = !isPaid && det.daysLate > 0;
          return `<div class="card p-3 mb-3">
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-3">
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium">#${inst.number} - ${Utils.fmtMoney(inst.installment_amount)}</p>
                <p class="text-xs text-slate-400">Venc: ${Utils.fmtDate(inst.due_date)} ${isOverdue ? `(${det.daysLate}d atraso)` : ''}</p>
                <p class="text-xs text-slate-500">Principal Pago: ${Utils.fmtMoney(Finance.getPaidTotal(inst, 'principal'))} | Principal Pendente: ${Utils.fmtMoney(det.principal)}</p>
                <p class="text-xs text-slate-500">Juros Pagos: ${Utils.fmtMoney(Finance.getPaidTotal(inst, 'periodInterest') + Finance.getPaidTotal(inst, 'extraInterest'))} | Juros Pendentes: ${Utils.fmtMoney(det.totalInterestPending)}</p>
                ${Number(inst.antecipacao_desconto || 0) > 0 ? `<p class="text-xs text-emerald-300">Desconto por antecipação: ${Utils.fmtMoney(inst.antecipacao_desconto)} • Baixa total: ${Utils.fmtMoney(inst.antecipacao_baixa_total || 0)}</p>` : Number(inst.discount_applied || 0) > 0 ? `<p class="text-xs text-green-300">Desconto aplicado: ${Utils.fmtMoney(inst.discount_applied)}</p>` : ''}
                ${!isPaid && det.accumulatedPenalty > 0 ? `<p class="text-xs text-red-300">Multa: ${Utils.fmtMoney(det.accumulatedPenalty)} | Multa Paga: ${Utils.fmtMoney(Finance.getPaidTotal(inst, 'penalty'))}</p>` : ''}
                ${Number(inst.total_penalty_discount || 0) > 0 ? `<p class="text-xs text-emerald-300">Desconto na multa aplicado: ${Utils.fmtMoney(inst.total_penalty_discount)}</p>` : ''}
              </div>
              <div class="flex flex-row sm:flex-col items-stretch sm:items-end gap-2 w-full sm:w-auto">
                <span class="badge ${isPaid?'badge-paid':isOverdue?'badge-overdue':'badge-pending'} justify-center">${inst.status_antecipacao === 'quitada_antecipada' ? 'Quitada antecipada' : inst.status_antecipacao === 'parcialmente_antecipada' ? 'Parcial antecipada' : isPaid?'Pago':isOverdue?'Atraso':'Pendente'}</span>
                ${!isPaid ? `<button type="button" onclick="event.preventDefault();event.stopPropagation();activeModal={type:'payment',instId:'${inst.id}'};render();" class="btn-gold py-2 px-4 text-xs font-bold whitespace-nowrap flex-1 sm:flex-none">Registrar pagamento</button><button type="button" onclick="event.preventDefault();event.stopPropagation();mvOpenInstallmentCharge('${inst.id}')" class="btn-outline py-2 px-4 text-xs font-bold whitespace-nowrap flex-1 sm:flex-none">Cobrar</button>` : ''}
              </div>
            </div>
          </div>`;
        }).join('')}
        <h3 class="font-semibold mb-2 mt-4">Histórico de Pagamentos</h3>
        ${payments.length === 0 ? '<p class="text-slate-500 text-sm text-center py-4">Nenhum pagamento</p>' : payments.map(p => `<div class="card p-3 mb-2">
          <div class="flex justify-between items-start gap-3">
            <div class="flex-1">
              <div class="flex justify-between"><p class="text-sm">${Utils.fmtMoney(p.payment_amount)}</p><p class="text-xs text-slate-400">${Utils.fmtDate(p.payment_date)}</p></div>
              <p class="text-xs text-slate-400 capitalize">${p.payment_type === 'antecipacao_parcelas' ? 'Antecipação de parcelas futuras' : p.payment_type === 'jurosMulta' ? 'Juros + Multa' : p.payment_type === 'integral' ? 'Integral' : 'Parcial'}</p>
              ${p.payment_type === 'antecipacao_parcelas' ? `<div class="text-xs text-slate-500 mt-1 space-y-1">
                <p>Total recebido: ${Utils.fmtMoney(p.payment_amount || 0)} • Desconto: ${Utils.fmtMoney(p.antecipacao_discount_total || 0)} • Baixa total: ${Utils.fmtMoney(p.antecipacao_total_baixado || 0)}</p>
                ${(p.parcelas_afetadas || []).map(a => `<p class="text-emerald-300">Parcela #${a.numeroParcela}: ${a.statusNovo === 'quitada_antecipada' ? 'quitada' : 'abatida'} por ${Utils.fmtMoney(a.valorRecebidoAplicado)} • desconto ${Utils.fmtMoney(a.descontoAplicado)} • ${a.diasAntecipados} dia(s)</p>`).join('')}
              </div>` : `<p class="text-xs text-slate-500 mt-1">Principal: ${Utils.fmtMoney(p.paid_to_principal || 0)} • J. Período: ${Utils.fmtMoney(p.paid_to_period_interest || 0)} • J. Extras: ${Utils.fmtMoney(p.paid_to_extra_interest || 0)} • Multa: ${Utils.fmtMoney(p.paid_to_penalty || 0)}</p>${Number(p.penalty_discount_value || 0) > 0 ? `<p class="text-xs text-emerald-300 mt-1">Desconto de multa: ${Utils.fmtMoney(p.penalty_discount_value)} (${Number(p.penalty_discount_percent || 0).toFixed(2)}%)</p>` : ''}`}
            </div>
            <button onclick="confirmAction={type:'deletePayment',id:'${p.id}',amount:'${Utils.fmtMoney(p.payment_amount)}'};render()" class="btn-danger py-1 px-2 text-xs flex items-center gap-1"><i data-lucide="trash-2" class="w-3 h-3"></i> Excluir</button>
          </div>
        </div>`).join('')}
      </div>`;
    }

    function renderHealthTab() {
      const loans = DB.getLoans();
      const allInst = DB.getInstallments();
      const payments = DB.getPayments();
      const totalLent = loans.reduce((s,l) => s + Number(l.amount || 0), 0);
      // Recebido geral = soma real de todos os pagamentos recebidos registrados.
      const totalReceived = payments.reduce((s,p) => s + Number(p.payment_amount || 0), 0);
      const overdueInst = allInst.filter(i => i.status_inst !== 'pago' && Utils.daysDiff(Utils.today(), i.due_date) > 0);
      const totalOverdue = overdueInst.reduce((s,i) => s + Finance.calcInstallmentDetails(i).totalDue, 0);
      const profit = totalReceived - totalLent;

      const today = Utils.today();
      const addDays = (dateStr, days) => {
        const d = new Date(dateStr + 'T12:00:00');
        d.setDate(d.getDate() + days);
        return d.toISOString().split('T')[0];
      };
      const now = new Date(today + 'T12:00:00');
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1, 12, 0, 0).toISOString().split('T')[0];
      const weekEnd = addDays(today, 7);
      const monthEndDate = new Date(now.getFullYear(), now.getMonth() + 1, 0, 12, 0, 0);
      const monthEnd = monthEndDate.toISOString().split('T')[0];
      if (!healthStartDate) healthStartDate = monthStart;
      if (!healthEndDate) healthEndDate = today;
      let selectedStart = healthStartDate;
      let selectedEnd = healthEndDate;
      if (selectedStart > selectedEnd) {
        const tmp = selectedStart;
        selectedStart = selectedEnd;
        selectedEnd = tmp;
      }

      const pendingInst = allInst.filter(i => i.status_inst !== 'pago');

      const buildForecastRows = (startDate, endDate) => {
        return pendingInst
          .filter(inst => inst.due_date >= startDate && inst.due_date <= endDate)
          .map(inst => {
            const loan = DB.getLoanByKey(inst.loan_id_inst);
            const client = loan ? DB.getClientById(loan.client_id) : null;
            const det = Finance.calcInstallmentDetails(inst, inst.due_date);
            const statusKind = inst.due_date < today ? 'overdue' : inst.due_date === today ? 'today' : 'normal';
            const statusLabel = statusKind === 'overdue' ? 'Em atraso' : statusKind === 'today' ? 'Vence hoje' : 'Em dia';
            return {
              date: inst.due_date,
              clientName: client?.name || 'Cliente não encontrado',
              loanId: loan?.id || '',
              instNumber: inst.number || 1,
              amount: Number(det.totalDue || 0),
              type: Finance.isProportionalLoan(loan) ? 'Saldo corrido' : 'Price',
              status: statusLabel,
              statusKind
            };
          })
          .sort((a,b) => a.date.localeCompare(b.date) || a.clientName.localeCompare(b.clientName));
      };

      const groupForecastByDate = (rows) => rows.reduce((acc, row) => {
        if (!acc[row.date]) acc[row.date] = { date: row.date, total: 0, rows: [] };
        acc[row.date].total += row.amount;
        acc[row.date].rows.push(row);
        return acc;
      }, {});

      const rowVisual = (statusKind) => {
        if (statusKind === 'overdue') return { cls: 'bg-red-500/10 border border-red-500/30', text: 'text-red-300' };
        if (statusKind === 'today') return { cls: 'bg-yellow-400/10 border border-yellow-400/30', text: 'text-yellow-300' };
        return { cls: 'bg-navy-800/30 border border-transparent', text: 'text-slate-400' };
      };

      const renderForecastList = (rows, emptyText) => {
        if (!rows.length) return `<p class="text-slate-500 text-sm text-center py-4">${emptyText}</p>`;
        const grouped = groupForecastByDate(rows);
        return Object.values(grouped).map(group => `
          <div class="border border-gold-800/20 rounded-xl p-3 mb-3 bg-navy-900/20">
            <div class="flex items-center justify-between gap-3 mb-2">
              <div>
                <p class="font-semibold text-sm text-gold-300">${Utils.fmtDate(group.date)}</p>
                <p class="text-xs text-slate-500">${group.rows.length} recebimento(s) previsto(s)</p>
              </div>
              <p class="text-sm font-bold text-green-400">${Utils.fmtMoney(group.total)}</p>
            </div>
            <div class="space-y-2">
              ${group.rows.map(row => {
                const visual = rowVisual(row.statusKind);
                return `
                <div class="flex items-center justify-between gap-3 text-xs rounded-lg p-2 ${visual.cls}">
                  <div class="min-w-0">
                    <p class="text-slate-200 truncate">${row.clientName}</p>
                    <p class="text-slate-500">Parcela #${row.instNumber} • ${row.type} • <span class="${visual.text} font-semibold">${row.status}</span></p>
                  </div>
                  <div class="flex items-center gap-2 shrink-0">
                    <span class="text-green-300 font-semibold">${Utils.fmtMoney(row.amount)}</span>
                    ${row.loanId ? `<button onclick="viewingLoan='${row.loanId}';adminTab='loans';render()" class="btn-outline py-1 px-2 text-[10px]">Abrir</button>` : ''}
                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>
        `).join('');
      };

      const weekRows = buildForecastRows(today, weekEnd);
      const monthRows = buildForecastRows(today, monthEnd);
      const todayRows = buildForecastRows(today, today);
      const intervalRows = buildForecastRows(selectedStart, selectedEnd);
      const weekTotal = weekRows.reduce((s,r) => s + r.amount, 0);
      const monthTotal = monthRows.reduce((s,r) => s + r.amount, 0);
      const todayTotal = todayRows.reduce((s,r) => s + r.amount, 0);
      const intervalForecastTotal = intervalRows.reduce((s,r) => s + r.amount, 0);
      const intervalPayments = payments.filter(p => (p.payment_date || '') >= selectedStart && (p.payment_date || '') <= selectedEnd);
      // Recebido no intervalo = soma real dos pagamentos com data dentro do calendário escolhido.
      const intervalReceivedTotal = intervalPayments.reduce((s,p) => s + Number(p.payment_amount || 0), 0);

      return `<div class="fade-in">
        <h2 class="text-lg font-semibold mb-4">Saúde Financeira</h2>
        <div class="grid grid-cols-2 gap-3 mb-4">
          <div class="stat-card"><div class="flex items-center gap-2 mb-1"><i data-lucide="trending-up" class="w-4 h-4 text-gold-400"></i><span class="text-xs text-slate-400">Emprestado</span></div><p class="text-lg font-bold text-gold-400">${Utils.fmtMoney(totalLent)}</p></div>
          <div class="stat-card"><div class="flex items-center gap-2 mb-1"><i data-lucide="wallet" class="w-4 h-4 text-green-400"></i><span class="text-xs text-slate-400">Recebido</span></div><p class="text-lg font-bold text-green-400">${Utils.fmtMoney(totalReceived)}</p></div>
          <div class="stat-card"><div class="flex items-center gap-2 mb-1"><i data-lucide="alert-circle" class="w-4 h-4 text-red-400"></i><span class="text-xs text-slate-400">Em Atraso</span></div><p class="text-lg font-bold text-red-400">${Utils.fmtMoney(totalOverdue)}</p><p class="text-xs text-slate-500">${overdueInst.length} parcelas</p></div>
          <div class="stat-card"><div class="flex items-center gap-2 mb-1"><i data-lucide="bar-chart-3" class="w-4 h-4 ${profit>=0?'text-green-400':'text-red-400'}"></i><span class="text-xs text-slate-400">Resultado Bruto</span></div><p class="text-lg font-bold ${profit>=0?'text-green-400':'text-red-400'}">${Utils.fmtMoney(profit)}</p></div>
        </div>

        <div class="card p-4 mb-4">
          <div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-3 mb-4">
            <div>
              <h3 class="font-semibold text-sm flex items-center gap-2"><i data-lucide="calendar-search" class="w-4 h-4 text-gold-400"></i> Consulta por Intervalo</h3>
              <p class="text-xs text-slate-500">Escolha as datas para ver o total recebido e a previsão no período.</p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 w-full lg:w-auto">
              <div><label class="text-xs text-slate-400">Data inicial</label><input type="date" class="input-field" value="${selectedStart}" onchange="healthStartDate=this.value;render()"></div>
              <div><label class="text-xs text-slate-400">Data final</label><input type="date" class="input-field" value="${selectedEnd}" onchange="healthEndDate=this.value;render()"></div>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
            <div class="stat-card"><span class="text-xs text-slate-400">Recebido no intervalo</span><p class="text-lg font-bold text-green-400">${Utils.fmtMoney(intervalReceivedTotal)}</p><p class="text-xs text-slate-500">${intervalPayments.length} pagamento(s)</p></div>
            <div class="stat-card"><span class="text-xs text-slate-400">Previsão no intervalo</span><p class="text-lg font-bold text-gold-400">${Utils.fmtMoney(intervalForecastTotal)}</p><p class="text-xs text-slate-500">${intervalRows.length} parcela(s) em aberto</p></div>
            <div class="stat-card"><span class="text-xs text-slate-400">Período selecionado</span><p class="text-sm font-bold text-slate-200">${Utils.fmtDate(selectedStart)} até ${Utils.fmtDate(selectedEnd)}</p><p class="text-xs text-slate-500">Calendário ajustável</p></div>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div>
              <h4 class="text-sm font-semibold mb-2 text-gold-300">Previsão de pagamentos no intervalo</h4>
              <div class="flex flex-wrap gap-2 mb-2 text-[11px]">
                <span class="px-2 py-1 rounded-full bg-navy-800/50 text-slate-300">Normal: em dia</span>
                <span class="px-2 py-1 rounded-full bg-yellow-400/10 text-yellow-300 border border-yellow-400/20">Amarelo: vence hoje</span>
                <span class="px-2 py-1 rounded-full bg-red-500/10 text-red-300 border border-red-500/20">Vermelho: atrasado</span>
              </div>
              ${renderForecastList(intervalRows, 'Nenhuma parcela em aberto nesse intervalo.')}
            </div>
            <div>
              <h4 class="text-sm font-semibold mb-2 text-green-300">Recebimentos realizados no intervalo</h4>
              ${intervalPayments.length === 0 ? '<p class="text-slate-500 text-sm text-center py-4">Nenhum pagamento recebido nesse intervalo.</p>' : intervalPayments.sort((a,b) => String(a.payment_date||'').localeCompare(String(b.payment_date||''))).map(p => {
                const loan = DB.getLoanByKey(p.loan_id_pay);
                const client = loan ? DB.getClientById(loan.client_id) : null;
                return `<div class="flex items-center justify-between gap-3 text-xs bg-green-500/10 border border-green-500/20 rounded-lg p-2 mb-2">
                  <div class="min-w-0">
                    <p class="text-slate-200 truncate">${client?.name || 'Cliente não encontrado'}</p>
                    <p class="text-slate-500">${Utils.fmtDate(p.payment_date)} • ${p.payment_type === 'jurosMulta' ? 'Juros + Multa' : p.payment_type === 'integral' ? 'Integral' : 'Parcial'}</p>
                  </div>
                  <span class="text-green-300 font-semibold shrink-0">${Utils.fmtMoney(Number(p.payment_amount || 0))}</span>
                </div>`;
              }).join('')}
            </div>
          </div>
        </div>

        <div class="card p-4 mb-4">
          <div class="flex items-center justify-between mb-3">
            <div>
              <h3 class="font-semibold text-sm flex items-center gap-2"><i data-lucide="calendar-days" class="w-4 h-4 text-gold-400"></i> Previsão de Recebimento</h3>
              <p class="text-xs text-slate-500">Baseada nas datas de vencimento das parcelas em aberto.</p>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
            <div class="stat-card"><span class="text-xs text-slate-400">Hoje</span><p class="text-lg font-bold text-green-400">${Utils.fmtMoney(todayTotal)}</p><p class="text-xs text-slate-500">${todayRows.length} parcela(s)</p></div>
            <div class="stat-card"><span class="text-xs text-slate-400">Próximos 7 dias</span><p class="text-lg font-bold text-green-400">${Utils.fmtMoney(weekTotal)}</p><p class="text-xs text-slate-500">${Utils.fmtDate(today)} até ${Utils.fmtDate(weekEnd)}</p></div>
            <div class="stat-card"><span class="text-xs text-slate-400">Até fim do mês</span><p class="text-lg font-bold text-green-400">${Utils.fmtMoney(monthTotal)}</p><p class="text-xs text-slate-500">${Utils.fmtDate(today)} até ${Utils.fmtDate(monthEnd)}</p></div>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div>
              <h4 class="text-sm font-semibold mb-2 text-gold-300">Recebimentos da semana</h4>
              ${renderForecastList(weekRows, 'Nenhum recebimento previsto para os próximos 7 dias.')}
            </div>
            <div>
              <h4 class="text-sm font-semibold mb-2 text-gold-300">Recebimentos do mês</h4>
              ${renderForecastList(monthRows, 'Nenhum recebimento previsto até o fim do mês.')}

    function handleSettingsSave(e) {
      e.preventDefault();

      const level3 = document.getElementById('set-level3').value.trim() || '0.20';
      DB.setConfig('level1_daily_rate', level1);

    function exportJSON() {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'mv-financeira-backup.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importJSON(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          db = {
            clients: parsed.clients || [],
            loans: parsed.loans || [],
            installments: parsed.installments || [],
            payments: parsed.payments || [],
            investors: parsed.investors || [],
            investor_aportes: parsed.investor_aportes || [],
            investor_payments: parsed.investor_payments || [],
            configs: { ...defaultDB.configs, ...(parsed.configs || {}) }
          };
          persistDB();
          Utils.toast('Backup importado!', 'success');
          render();
        } catch {
          Utils.toast('Arquivo inválido', 'error');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function mvGetPaymentCycleReferenceDate(inst) {
      const paymentDate = document.getElementById('pay-date')?.value || Utils.today();
      if (!inst) return paymentDate;
      const loan = DB.getLoanByKey(inst.loan_id_inst);
      if (loan && Finance.isProportionalLoan(loan) && inst.due_date && new Date(paymentDate + 'T12:00:00') <= new Date(inst.due_date + 'T12:00:00')) {
        return inst.due_date;
      }
      return paymentDate;
    }

    function mvRefreshPaymentByDate() {
      const mode = document.getElementById('pay-type')?.value || 'integral';
      mvSetPaymentMode(mode);
    }

    function mvSetPaymentMode(mode) {
      const inst = activeModal?.instId ? DB.getInstallmentById(activeModal.instId) : activeModal?.inst;
      if (!inst) return;
      const payDate = document.getElementById('pay-date')?.value || Utils.today();
      const refDate = mvGetPaymentCycleReferenceDate(inst);
      const det = Finance.calcInstallmentDetails(inst, refDate);
      const type = document.getElementById('pay-type');
      const title = document.getElementById('pay-mode-title');
      const nextWrap = document.getElementById('pay-next-wrap');
      const amount = document.getElementById('pay-amount');
      if (mode === 'quitacao_contrato') {
        const payoff = Finance.simulateInstallmentPayoff(inst.loan_id_inst, payDate);
        if (type) type.value = 'quitacao_contrato';
        if (title) title.textContent = 'Quitação total do contrato hoje';
        if (nextWrap) nextWrap.style.display = 'none';
        if (amount) amount.value = Finance.round2(payoff.totalHoje || 0).toFixed(2);
      } else if (mode === 'antecipacao_parcelas') {
        if (type) type.value = 'antecipacao_parcelas';
        if (title) title.textContent = 'Antecipar parcelas futuras';
        if (nextWrap) nextWrap.style.display = 'none';
      } else if (mode === 'jurosMulta') {
        if (type) type.value = 'jurosMulta';
        if (title) title.textContent = 'Pagamento normal - juros e multa';
        if (nextWrap) nextWrap.style.display = 'block';
        if (amount) amount.value = Finance.round2(det.totalInterestPending + det.accumulatedPenalty).toFixed(2);
      } else if (mode === 'parcial') {
        if (type) type.value = 'parcial';
        if (title) title.textContent = 'Pagamento normal - parcial';
        if (nextWrap) nextWrap.style.display = 'block';
      } else {
        if (type) type.value = 'integral';
        if (title) title.textContent = 'Pagamento normal - integral';
        if (nextWrap) nextWrap.style.display = 'block';
        if (amount) amount.value = Finance.round2(det.totalDue).toFixed(2);
      }
      updatePenaltyDiscountPreview();
      updateAnticipationProjection();
    }

    function updateAnticipationProjection() {
      const inst = activeModal?.instId ? DB.getInstallmentById(activeModal.instId) : activeModal?.inst;
      const preview = document.getElementById('anticipation-preview');
      if (!inst || !preview) return;
      const loan = DB.getLoanByKey(inst.loan_id_inst);
      if (!loan || Finance.isProportionalLoan(loan)) return;
      const paymentDate = document.getElementById('pay-date')?.value || Utils.today();
      const amount = Number(document.getElementById('pay-amount')?.value || 0);
      const payoff = Finance.simulateInstallmentPayoff(inst.loan_id_inst, paymentDate);
      const sim = Finance.simulateAnticipationByAmount(inst.loan_id_inst, amount, paymentDate);
      const payoffTotal = document.getElementById('payoff-total-today');
      const payoffDiscount = document.getElementById('payoff-discount-total');
      const payoffCount = document.getElementById('payoff-installments-count');
      if (payoffTotal) payoffTotal.textContent = Utils.fmtMoney(payoff.totalHoje || 0);
      if (payoffDiscount) payoffDiscount.textContent = Utils.fmtMoney(payoff.descontoTotal || 0);
      if (payoffCount) payoffCount.textContent = String(payoff.quantidadeParcelas || 0);
      const affected = sim.parcelasAfetadas || [];
      const detalhes = affected.slice(0, 4).map(a => `#${a.numeroParcela} ${a.statusNovo === 'quitada_antecipada' ? 'quita' : 'abate'} ${Utils.fmtMoney(a.valorFuturoAbatido || 0)}`).join(' • ');
      preview.innerHTML = `Com ${Utils.fmtMoney(amount)} antecipado: <b class="text-green-300">quita ${sim.parcelasQuitadas || 0} parcela(s)</b>, afeta <b>${affected.length}</b>, baixa <b>${Utils.fmtMoney(sim.valorBaixadoTotal || 0)}</b> e gera desconto de <b class="text-emerald-300">${Utils.fmtMoney(sim.descontoAntecipacao || 0)}</b>. ${sim.saldoRestante > 0 ? 'Sobra não aplicada: <b class="text-yellow-300">' + Utils.fmtMoney(sim.saldoRestante) + '</b>.' : ''}${detalhes ? '<br><span class="text-slate-500">' + detalhes + '</span>' : ''}`;
    }

    function updatePenaltyDiscountPreview() {
      const inst = activeModal?.instId ? DB.getInstallmentById(activeModal.instId) : activeModal?.inst;
      if (!inst) return;
      const det = Finance.calcInstallmentDetails(inst, mvGetPaymentCycleReferenceDate(inst));
      const enabled = document.getElementById('pay-discount-enabled')?.checked;
      const pct = enabled ? Math.max(0, Math.min(100, parseFloat(document.getElementById('pay-penalty-discount-percent')?.value || '0'))) : 0;
      const discount = Finance.round2(Number(det.accumulatedPenalty || 0) * pct / 100);
      const newTotal = Finance.round2(Number(det.totalDue || 0) - discount);
      const preview = document.getElementById('pay-penalty-discount-preview');
      const total = document.getElementById('pay-total-after-discount');
      if (preview) preview.textContent = Utils.fmtMoney(discount);
      if (total) total.textContent = 'Total após desconto: ' + Utils.fmtMoney(newTotal);
      const amount = document.getElementById('pay-amount');
      const type = document.getElementById('pay-type')?.value || 'integral';
      if (enabled && amount && type === 'integral') amount.value = newTotal.toFixed(2);
    }
